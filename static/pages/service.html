<style>
  #page-content {
      --svc-line: color-mix(in srgb, var(--tblr-body-color) 9%, transparent);
      --svc-line-strong: color-mix(in srgb, var(--tblr-body-color) 15%, transparent);
      --svc-text-2: color-mix(in srgb, var(--tblr-body-color) 64%, transparent);
      --svc-text-3: color-mix(in srgb, var(--tblr-body-color) 44%, transparent);
      --svc-hover: color-mix(in srgb, var(--tblr-body-color) 3.5%, transparent);
      --svc-accent: var(--tblr-primary);
      --svc-mono: var(--tblr-font-monospace);
  }

  .svc-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      color: var(--svc-text-2);
      font-size: 13px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
  }

  .svc-summary[hidden],
  .job-rail[hidden] { display: none; }

  .svc-summary-sep { color: var(--svc-text-3); }
  .svc-summary-name { color: var(--svc-text-3); }

  .svc-summary-time {
      color: var(--tblr-body-color);
      font-family: var(--svc-mono);
      font-size: 12px;
  }

  .svc-group { margin-top: 32px; }
  .svc-group:first-child { margin-top: 24px; }

  .svc-group-title {
      margin: 0 0 8px;
      padding-left: 20px;
      color: var(--svc-text-3);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
  }

  .svc-panel {
      overflow: hidden;
      background-color: var(--tblr-bg-surface);
      border: 1px solid var(--svc-line);
      border-radius: 12px;
  }

  .svc-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 116px 104px 16px;
      align-items: center;
      column-gap: 16px;
      min-height: 60px;
      padding: 8px 20px;
      border-top: 1px solid var(--svc-line);
      color: inherit;
      text-decoration: none;
      transition: background-color 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .svc-row:first-child { border-top: 0; }

  .svc-row:hover {
      background-color: color-mix(in srgb, var(--svc-color, var(--tblr-body-color)) 4.5%, transparent);
  }

  .svc-row:focus-visible {
      outline: 2px solid var(--svc-accent);
      outline-offset: -2px;
  }

  .svc-icon {
      display: flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      color: color-mix(in srgb, var(--svc-color, var(--tblr-body-color)) 78%, var(--tblr-body-color));
      font-size: 18px;
      line-height: 1;
      background-color: color-mix(in srgb, var(--svc-color, var(--tblr-body-color)) 11%, var(--tblr-bg-surface));
      border: 1px solid color-mix(in srgb, var(--svc-color, var(--tblr-body-color)) 22%, transparent);
      border-radius: 8px;
  }

  .svc-icon svg { width: 18px; height: 18px; }

  .svc-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 2px;
  }

  .svc-name {
      color: var(--tblr-body-color);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
  }

  .svc-desc {
      overflow: hidden;
      color: var(--svc-text-3);
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
  }

  .svc-cadence {
      color: var(--svc-text-2);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
  }

  .svc-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--svc-text-3);
      font-size: 12px;
      white-space: nowrap;
  }

  .svc-state.is-running { color: var(--svc-accent); }

  .svc-go {
      justify-self: end;
      color: var(--svc-text-3);
      font-size: 16px;
  }

  .svc-led,
  .job-led {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 2px;
      background-color: color-mix(in srgb, var(--tblr-body-color) 28%, transparent);
  }

  .svc-led.is-service {
      background-color: color-mix(in srgb, var(--svc-color, var(--tblr-body-color)) 82%, var(--tblr-body-color));
  }

  .svc-led.is-on,
  .job-led.is-on {
      background-color: var(--svc-accent);
      animation: svc-led-breathe 2.6s ease-in-out infinite;
  }

  .svc-led.is-off,
  .job-led.is-off {
      background-color: transparent;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tblr-body-color) 30%, transparent);
  }

  @keyframes svc-led-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .38; }
  }

  @media (prefers-reduced-motion: reduce) {
      .svc-led.is-on,
      .job-led.is-on { animation: none; }
  }

  .svc-empty {
      padding: 48px 20px;
      text-align: center;
  }

  .svc-empty-icon {
      color: var(--svc-text-3);
      font-size: 24px;
  }

  .svc-empty-title {
      margin-top: 12px;
      color: var(--tblr-body-color);
      font-size: 14px;
      font-weight: 500;
  }

  .svc-empty-desc {
      margin-top: 4px;
      color: var(--svc-text-3);
      font-size: 13px;
  }

  #modal-job-list .modal-content { border-radius: 14px; }

  #modal-job-list .modal-header {
      align-items: flex-start;
      padding: 20px 24px 16px;
  }

  #modal-job-list .modal-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
  }

  .job-sub {
      margin-top: 2px;
      color: var(--svc-text-3);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
  }

  .job-rail {
      padding: 12px 24px 8px;
      border-bottom: 1px solid var(--svc-line);
  }

  .job-rail-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--svc-text-3);
      font-size: 12px;
  }

  .job-rail-now {
      font-family: var(--svc-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
  }

  .job-rail-track {
      position: relative;
      height: 40px;
      margin-top: 6px;
  }

  .job-rail-base {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;
      height: 1px;
      background-color: var(--svc-line-strong);
  }

  .job-rail-tick {
      position: absolute;
      bottom: 16px;
      width: 1px;
      height: 5px;
      background-color: var(--svc-line);
  }

  .job-rail-tick-label {
      position: absolute;
      bottom: 0;
      color: var(--svc-text-3);
      font-family: var(--svc-mono);
      font-size: 10px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transform: translateX(-50%);
  }

  .job-rail-tick-label.is-start { transform: none; }
  .job-rail-tick-label.is-end { transform: translateX(-100%); }

  .job-rail-mark {
      position: absolute;
      bottom: 16px;
      width: 2px;
      height: 12px;
      border-radius: 1px;
      background-color: color-mix(in srgb, var(--tblr-body-color) 34%, transparent);
      transform: translateX(-1px);
  }

  .job-rail-mark.is-next {
      height: 18px;
      background-color: var(--svc-accent);
  }

  .job-head,
  .job-row {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) 128px 92px 64px;
      align-items: center;
      column-gap: 12px;
      padding: 0 24px;
  }

  .job-head {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 32px;
      border-bottom: 1px solid var(--svc-line);
      background-color: var(--tblr-bg-surface);
      color: var(--svc-text-3);
      font-size: 11px;
  }

  .job-head .is-right { text-align: right; }

  .job-row {
      min-height: 52px;
      padding-top: 8px;
      padding-bottom: 8px;
      border-top: 1px solid var(--svc-line);
  }

  .job-row:first-child { border-top: 0; }
  .job-row:hover { background-color: var(--svc-hover); }

  .job-name {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
      color: var(--tblr-body-color);
      font-size: 14px;
      line-height: 1.35;
  }

  .job-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
  }

  .job-tag {
      flex: 0 0 auto;
      padding: 1px 6px;
      border: 1px solid var(--svc-line-strong);
      border-radius: 4px;
      color: var(--svc-text-3);
      font-size: 10px;
      line-height: 1.4;
  }

  .job-cadence {
      overflow: hidden;
      color: var(--svc-text-3);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
  }

  .job-next {
      color: var(--svc-text-2);
      font-family: var(--svc-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
  }

  .job-status {
      color: var(--svc-text-3);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
  }

  .job-status.is-running { color: var(--svc-accent); }
  .job-status.is-queued { color: var(--svc-text-2); }

  .job-empty {
      padding: 40px 24px;
      color: var(--svc-text-3);
      font-size: 13px;
      text-align: center;
  }

  @media (max-width: 767.98px) {
      .svc-row {
          grid-template-columns: 32px minmax(0, 1fr) auto;
          column-gap: 12px;
          padding: 10px 16px;
      }

      .svc-cadence,
      .svc-go { display: none; }

      .svc-group-title { padding-left: 16px; }
  }

  @media (max-width: 639.98px) {
      #modal-job-list .modal-header { padding: 16px 20px 12px; }

      .job-rail { padding: 12px 20px 8px; }

      .job-head { display: none; }

      .job-row {
          grid-template-columns: 8px minmax(0, 1fr) auto;
          grid-template-areas:
              "led name status"
              ". cadence next";
          row-gap: 2px;
          padding: 10px 20px;
      }

      .job-led {
          grid-area: led;
          align-self: start;
          margin-top: 6px;
      }

      .job-name { grid-area: name; }
      .job-cadence { grid-area: cadence; font-size: 11px; }
      .job-next { grid-area: next; font-size: 11px; }
      .job-status { grid-area: status; }
  }
</style>

<script type="text/javascript">

  // 显示服务提示框
  function show_service_modal(id, name) {
    switch(id) {
      case "nametest":
        $('#modal-nametest').modal('show');
        break;
      case "ruletest":
        $('#modal-ruletest').modal('show');
        break;
      case "nettest":
        $('[id^="nettest_item_res"]').empty();
        $('#modal-nettest').modal('show');
        break;
      case "processes":
        $('#modal-system-processes').modal('show');
        setTimeout(refresh_system_process, 1000);
        break;
      case "blacklist":

  // 定时任务列表自动刷新
  // 页面为 SPA 动态载入，重复进入时先清理上一次的轮询
  if (window.jobListRefreshTimer) {
    clearInterval(window.jobListRefreshTimer);
    window.jobListRefreshTimer = null;
  }
  var jobListRefreshTimer = null;
  var jobListLastSignature = null;

  // 转义任务名称等字段，避免特殊字符破坏页面结构
  function escape_job_html(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);
  }

  // 时间解析与展示：当天只显示时分，跨天补上「明天 / 月-日」
  function parse_job_date(value) {
    if (!value) {
      return null;
    }
    const date = new Date(String(value).replace(" ", "T"));
    return isNaN(date.getTime()) ? null : date;
  }

  function pad_job_num(value) {
    return String(value).padStart(2, "0");
  }

  function format_job_clock(date) {
    return `${pad_job_num(date.getHours())}:${pad_job_num(date.getMinutes())}`;
  }

  function format_job_time(value) {
    const date = parse_job_date(value);
    if (!date) {
      return "—";
    }
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const clock = format_job_clock(date);
    if (date.toDateString() === now.toDateString()) {
      return clock;
    }
    if (date.toDateString() === tomorrow.toDateString()) {
      return `明天 ${clock}`;
    }
    return `${pad_job_num(date.getMonth() + 1)}-${pad_job_num(date.getDate())} ${clock}`;
  }

  // 统一间隔描述里的空格（「每30分钟」→「每 30 分钟」）
  function format_job_frequency(value) {
    return String(value ?? "")
      .replace(/^每(?=\d)/, "每 ")
      .replace(/(\d)(分钟|小时|秒|天)/g, "$1 $2");
  }

  // 任务状态：执行中 / 排队中 / 待执行
  function get_job_status(info) {
    if (info.running) {
      return {key: "running", led: "is-on", cls: "is-running", text: "执行中"};
    }
    if (info.pending) {
      return {key: "queued", led: "", cls: "is-queued", text: "排队中"};
    }
    if (!info.next_run_time) {
      return {key: "paused", led: "is-off", cls: "", text: "已暂停"};
    }
    return {key: "scheduled", led: "", cls: "", text: "待执行"};
  }

  // 接下来 24 小时的排程轨道，每个任务只标出它的下一次执行点
  function draw_job_rail(jobs) {
    const rail = $("#job-rail");
    const now = new Date();
    const window_ms = 24 * 60 * 60 * 1000;
    const marks = [];

    jobs.forEach(info => {
      const date = parse_job_date(info.next_run_time);
      if (!date) {
        return;
      }
      const offset = date.getTime() - now.getTime();
      if (offset < -60000 || offset > window_ms) {
        return;
      }
      marks.push({offset: offset, name: info.name, time: format_job_time(info.next_run_time)});
    });

    if (!marks.length) {
      rail.attr("hidden", true);
      return;
    }

    marks.sort((a, b) => a.offset - b.offset);
    $("#job-rail-now").text(`现在 ${format_job_clock(now)}`);

    let content = '<div class="job-rail-base"></div>';
    for (let step = 0; step <= 4; step++) {
      const ratio = step / 4;
      const tickTime = new Date(now.getTime() + ratio * window_ms);
      const position = (ratio * 100).toFixed(3);
      const labelClass = step === 0 ? " is-start" : (step === 4 ? " is-end" : "");
      content += `<span class="job-rail-tick" style="left:${position}%"></span>`;
      content += `<span class="job-rail-tick-label${labelClass}" style="left:${position}%">${format_job_clock(tickTime)}</span>`;
    }

    marks.forEach(mark => {
      const position = Math.min(100, Math.max(0, mark.offset / window_ms * 100)).toFixed(3);
      const nextClass = mark === marks[0] ? " is-next" : "";
      const markTitle = escape_job_html(`${mark.name} ${mark.time}`);
      content += `<span class="job-rail-mark${nextClass}" style="left:${position}%" title="${markTitle}"></span>`;
    });

    $("#job-rail-track").html(content);
    rail.removeAttr("hidden");
  }

  // 查询定时任务信息
  function draw_cron_job_list(silent = false) {

    axios_post_do("get_jobs", {}, function (ret) {
      if (ret.code != "0") {
        return;
      }

      const jobs = ret.result || [];

      // 轮询时数据未变化则不重绘，避免闪烁及滚动位置丢失
      const signature = JSON.stringify(jobs);
      if (silent && signature === jobListLastSignature) {
        return;
      }
      jobListLastSignature = signature;

      const runningCount = jobs.filter(job => job.running).length;
      $("#job-list-summary").text(
        jobs.length
          ? `共 ${jobs.length} 个任务${runningCount ? ` · ${runningCount} 个执行中` : ""}`
          : "暂无定时任务"
      );

      draw_job_rail(jobs);

      const jobListBody = $("#job-list-body").empty();
      if (!jobs.length) {
        jobListBody.append('<div class="job-empty">暂无定时任务</div>');
        return;
      }

      jobs.forEach(info => {
        const status = get_job_status(info);
        const isPlugin = !!info.from_plugin;
        const pluginTag = isPlugin ? '<span class="job-tag">插件</span>' : "";
        // 执行频率：优先使用后端转换的文字描述，未识别时回退到原始触发器信息
        const frequency = escape_job_html(format_job_frequency(info.trigger_text || info.trigger_details || ""));
        const nextRun = escape_job_html(format_job_time(info.next_run_time));
        const row = `
          <div class="job-row" title="${escape_job_html(info.trigger_details || "")}">
            <span class="job-led ${status.led}"></span>
            <span class="job-name">
              <span class="job-name-text">${escape_job_html(info.name)}</span>
              ${pluginTag}
            </span>
            <span class="job-cadence">${frequency || "—"}</span>
            <span class="job-next">${nextRun}</span>
            <span class="job-status ${status.cls}">${status.text}</span>
          </div>`;
        jobListBody.append(row);
      });
    }, false);
  }

  // 打开面板期间轮询刷新执行状态
  function start_job_list_refresh() {
    stop_job_list_refresh();
    jobListRefreshTimer = setInterval(() => {
      // 页面已切换时停止轮询
      if (!$('#modal-job-list').length) {
        stop_job_list_refresh();
        return;
      }
      draw_cron_job_list(true);
    }, 3000);
  }

  function stop_job_list_refresh() {
    if (jobListRefreshTimer) {
      clearInterval(jobListRefreshTimer);
      jobListRefreshTimer = null;
    }
  }

  $("#modal-job-list").on("hidden.bs.modal", function () {
    stop_job_list_refresh();
    jobListLastSignature = null;
  });

  // 初始化DropZone
  backup_dropzone = new Dropzone("#back_file");
  backup_dropzone.options.acceptedFiles = ".zip";

</script>

<script type="text/javascript">

  // 服务分组与说明：分组只影响展示顺序，未知服务归入「其他」
  var SERVICE_GROUPS = [
    {title: "自动任务", ids: ["rssdownload", "subscribe_search_all", "pttransfer", "sync"]},
    {title: "维护工具", ids: ["blacklist", "rsshistory", "backup", "checkupdate"]},
    {title: "诊断工具", ids: ["nametest", "ruletest", "nettest", "cron_job_list", "processes"]}
  ];

  var SERVICE_ICONS = {
    rssdownload: "ti-rss",
    subscribe_search_all: "ti-search",
    pttransfer: "ti-transform",
    sync: "ti-refresh",
    blacklist: "ti-trash",
    rsshistory: "ti-eraser",
    nametest: "ti-text-recognition",
    ruletest: "ti-filter",
    cron_job_list: "ti-calendar-month",
    nettest: "ti-world-www",
    backup: "ti-database",
    checkupdate: "ti-refresh-dot",
    processes: "ti-cpu"
  };

  var SERVICE_DESCS = {
    rssdownload: "按间隔检查订阅并下载新种子",
    subscribe_search_all: "定期搜索还没有完成的订阅",
    pttransfer: "把下载完成的文件转移到媒体库",
    sync: "监控目录变化并同步文件",
    blacklist: "清理已转移文件的记录，允许重新转移",
    rsshistory: "清理已经下载过的 RSS 记录",
    nametest: "测试种子名与文件名的识别结果",
    ruletest: "用过滤规则组测试种子",
    cron_job_list: "查看排队与待执行的定时任务",
    nettest: "检查站点与 API 的连通性",
    backup: "备份或恢复配置文件",
    checkupdate: "检查并更新系统镜像",
    processes: "查看后台进程与内存占用"
  };

  // 服务配色沿用 services.json 的 color 字段，只用于图标砖、状态灯和悬浮底色
  var SERVICE_COLOR_VARS = {
    blue: "--tblr-blue",
    green: "--tblr-green",
    orange: "--tblr-orange",
    red: "--tblr-red",
    purple: "--tblr-purple",
    lime: "--tblr-lime",
    yellow: "--tblr-yellow",
    cyan: "--tblr-cyan",
    azure: "--tblr-azure",
    teal: "--tblr-teal"
  };

  // 定时任务名与页面服务项的对应关系，用于显示执行状态
  var SERVICE_JOB_NAMES = {
    rssdownload: ["RSS订阅"],
    subscribe_search_all: ["订阅定时搜索"],
    pttransfer: ["下载文件转移"]
  };

  var servicePageData = null;
  var servicePageJobs = [];
  var serviceJobsLoaded = false;

  // 后端时间只写「30 分钟」时不带「每」，这里补上前缀
  function format_service_cadence(value) {
    const text = String(value ?? "").trim();
    if (!text) {
      return "";
    }
    return /^\d+\s*(分钟|小时)$/.test(text) ? `每 ${text}` : text;
  }

  function get_service_job_state(id, jobs) {
    const names = SERVICE_JOB_NAMES[id] || [];
    for (const info of jobs) {
      if (!names.includes(info.name)) {
        continue;
      }
      if (info.running) {
        return "running";
      }
      if (info.pending) {
        return "pending";
      }
    }
    return "";
  }

  function build_service_row(id, task, jobs) {
    const name = task.name || id;
    const desc = SERVICE_DESCS[id] || "";
    const icon = SERVICE_ICONS[id];
    const iconHtml = icon ? `<i class="ti ${icon}"></i>` : (task.svg || "");
    const cadence = format_service_cadence(task.time);
    const isAuto = SERVICE_GROUPS[0].ids.includes(id);
    const colorVar = SERVICE_COLOR_VARS[task.color];
    const colorStyle = colorVar ? ` style="--svc-color: var(${colorVar})"` : "";
    let stateHtml = "";

    if (isAuto) {
      const jobState = get_service_job_state(id, jobs);
      const enabled = task.state === "ON";
      let label = enabled ? "已启用" : "已停用";
      let ledClass = enabled ? "is-service" : "is-off";
      let stateClass = "";
      if (jobState === "running") {
        label = "运行中";
        ledClass = "is-on";
        stateClass = "is-running";
      } else if (jobState === "pending") {
        label = "排队中";
        ledClass = "is-service";
      }
      stateHtml = `<span class="svc-state ${stateClass}"><span class="svc-led ${ledClass}"></span>${label}</span>`;
    }

    return `
      <a class="svc-row" href="javascript:void(0)" data-id="${escape_job_html(id)}" data-name="${escape_job_html(name)}"${colorStyle}>
        <span class="svc-icon">${iconHtml}</span>
        <span class="svc-copy">
          <span class="svc-name">${escape_job_html(name)}</span>
          ${desc ? `<span class="svc-desc">${escape_job_html(desc)}</span>` : ""}
        </span>
        <span class="svc-cadence">${escape_job_html(cadence)}</span>
        <span>${stateHtml}</span>
        <i class="ti ti-chevron-right svc-go"></i>
      </a>`;
  }

  function render_service_summary(jobs) {
    const summary = $("#svc-summary");
    if (!jobs.length) {
      summary.html("<span>暂无定时任务</span>").removeAttr("hidden");
      return;
    }
    const runningCount = jobs.filter(job => job.running).length;
    // 「下次」优先取页面上的自动任务，避免总是显示内部的元数据保存等高频任务
    const serviceJobNames = new Set(Object.values(SERVICE_JOB_NAMES).flat());
    const serviceJobs = jobs.filter(job => serviceJobNames.has(job.name));
    const nextPool = serviceJobs.some(job => job.next_run_time) ? serviceJobs : jobs;
    const nextJob = nextPool
      .map(job => ({job: job, date: parse_job_date(job.next_run_time)}))
      .filter(item => item.date)
      .sort((a, b) => a.date - b.date)[0];

    const parts = [`<span>${jobs.length} 个定时任务</span>`];
    if (runningCount) {
      parts.push(`<span class="d-inline-flex align-items-center gap-2"><span class="svc-led is-on"></span>${runningCount} 个执行中</span>`);
    }
    if (nextJob) {
      parts.push(`<span>下次 <span class="svc-summary-time">${escape_job_html(format_job_time(nextJob.job.next_run_time))}</span><span class="svc-summary-name"> ${escape_job_html(nextJob.job.name)}</span></span>`);
    }
    summary.html(parts.join('<span class="svc-summary-sep">·</span>')).removeAttr("hidden");
  }

  function render_services(tasks, jobs) {
    const list = $("#services-list").empty();
    const grouped = [];
    const used = new Set();

    SERVICE_GROUPS.forEach(group => {
      const ids = group.ids.filter(id => tasks[id]);
      if (ids.length) {
        grouped.push({title: group.title, ids: ids});
        ids.forEach(id => used.add(id));
      }
    });

    const rest = Object.keys(tasks).filter(id => !used.has(id));
    if (rest.length) {
      grouped.push({title: "其他", ids: rest});
    }

    grouped.forEach(group => {
      const panel = $('<div class="svc-panel"></div>');
      group.ids.forEach(id => {
        panel.append(build_service_row(id, tasks[id], jobs));
      });
      list.append(`
        <section class="svc-group">
          <div class="svc-group-title">${escape_job_html(group.title)}</div>
          ${panel.prop("outerHTML")}
        </section>`);
    });
  }

  function refresh_service_page() {
    if (!servicePageData) {
      return;
    }
    const tasks = servicePageData.schedulerTasks || {};
    if (!Object.keys(tasks).length) {
      $("#services-container").hide();
      $("#no-services").show();
      $("#svc-summary").attr("hidden", true);
      return;
    }
    render_services(tasks, servicePageJobs);
    if (serviceJobsLoaded) {
      render_service_summary(servicePageJobs);
    } else {
      $("#svc-summary").attr("hidden", true);
    }
    $("#services-container").show();
    $("#no-services").hide();
  }

  // 页面加载完成后，使用axios_post请求/data/service接口获取数据并填充页面
  $(document).ready(function() {
    $("#services-list").off("click.svc").on("click.svc", ".svc-row", function () {
      show_service_modal($(this).data("id"), $(this).data("name"));
    });

    axios_post('/data/service', {}, function(response) {
      if (response.code === 0 && response.data) {

        const data = response.data;

        // 填充过滤规则选项
        if (data.ruleGroups) {
          const ruleSelect = $('#test_rulegroup');
          ruleSelect.empty();
          if (data.ruleGroups.length > 0) {
            ruleSelect.append('<option value="0">请选择</option>');
            data.ruleGroups.forEach(rule => {
              ruleSelect.append(`<option value="${rule.id}">${rule.name}</option>`);
            });
          } else {
            ruleSelect.append('<option value="0">未配置</option>');
          }
        }

        // 填充同步路径选项
        if (data.syncPaths) {
          const syncPathsGroup = $('#sync-paths-group');
          syncPathsGroup.empty();
          Object.entries(data.syncPaths).forEach(([syncId, syncPath]) => {
            const pathItem = `
              <label class="form-selectgroup-item">
                <input type="checkbox" name="service_sync_dir" value="${syncId}" class="form-selectgroup-input">
                <span class="form-selectgroup-label">${syncPath.from}</span>
              </label>
            `;
            syncPathsGroup.append(pathItem);
          });
        }

        // 填充网络测试表格
        if (data.schedulerTasks && data.schedulerTasks.nettest && data.schedulerTasks.nettest.targets) {
          const nettestTableBody = $('#nettest-table-body');
          nettestTableBody.empty();
          for (const target of data.schedulerTasks.nettest.targets) {
            const [[name, url]] = Object.entries(target);
            const row = `
              <tr>
                <td class="w-1"><input class="form-check-input m-0 align-middle" name="nettest-item" value="${name}" type="checkbox"></td>
                <td>
                  <span>${url}</span>
                  <input id="nettest_item_url_${name}" value="${url}" type="hidden">
                </td>
                <td id="nettest_item_res_${name}"></td>
                <td id="nettest_item_res_time_${name}"></td>
              </tr>
            `;
            nettestTableBody.append(row);
          }
        }

        servicePageData = data;
        refresh_service_page();
      }
    });

    // 静默取一次定时任务状态，用于标题摘要与「运行中」标记
    axios_post_do("get_jobs", {}, function (ret) {
      if (!ret || String(ret.code) !== "0") {
        return;
      }
      servicePageJobs = ret.result || [];
      serviceJobsLoaded = true;
      refresh_service_page();
    }, false);
  });

</script>
