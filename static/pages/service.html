<style>
  /* 系统服务：现代列表页，表面与文字跟随全站主题 */
  .svc-card {
      overflow: hidden;
      background-color: var(--tblr-bg-surface);
      border: 1px solid var(--tblr-border-color);
      border-radius: var(--tblr-border-radius-lg);
  }
  .svc-card-head { min-height: 58px; }
  .svc-card-meta {
      font-size: 12px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
  }

  .svc-row {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      column-gap: 14px;
      align-items: center;
      padding: 11px 16px;
      color: inherit;
      transition: background-color .12s ease;
  }
  .svc-row .svc-status { justify-self: end; }
  .svc-row:hover { background-color: var(--tblr-bg-surface-secondary); }
  .svc-row:focus-visible,
  .svc-tool:focus-visible {
      outline: 2px solid var(--tblr-primary);
      outline-offset: -2px;
  }

  .svc-ico {
      display: inline-flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
  }
  .svc-ico svg { width: 20px; height: 20px; }

  .svc-copy { display: flex; min-width: 0; flex-direction: column; gap: 1px; }
  .svc-name { font-size: 13px; line-height: 1.45; }
  .svc-desc { font-size: 11px; line-height: 1.45; }

  .svc-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--tblr-secondary);
      font-size: 12px;
      line-height: 1.4;
  }
  .svc-status.is-running { color: var(--tblr-blue); }
  .svc-status.is-queued { color: var(--tblr-orange); }
  .svc-status.is-enabled .svc-dot,
  .svc-status.is-scheduled .svc-dot { background-color: var(--tblr-green); }
  .svc-status.is-off .svc-dot { background-color: var(--tblr-secondary); opacity: .45; }
  .svc-dot {
      width: 6px;
      height: 6px;
      flex: none;
      background-color: currentColor;
      border-radius: 50%;
  }

  .svc-tool {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      column-gap: 12px;
      align-items: center;
      padding: 10px 16px;
      color: inherit;
      transition: background-color .12s ease;
  }
  .svc-tool:hover { background-color: var(--tblr-bg-surface-secondary); }

  .svc-empty { padding: 22px 16px; font-size: 12px; }

  #modal-job-list {
      --job-line: color-mix(in srgb, var(--tblr-body-color) 9%, transparent);
      --job-line-strong: color-mix(in srgb, var(--tblr-body-color) 15%, transparent);
      --job-text-2: color-mix(in srgb, var(--tblr-body-color) 64%, transparent);
      --job-text-3: color-mix(in srgb, var(--tblr-body-color) 44%, transparent);
      --job-hover: color-mix(in srgb, var(--tblr-body-color) 3.5%, transparent);
      --job-accent: var(--tblr-primary);
      --job-mono: var(--tblr-font-monospace);
  }

  #modal-job-list .modal-content { border-radius: 14px; }

  #modal-job-list .modal-header {
      align-items: flex-start;
      padding: 20px 24px 16px;
  }

  #modal-job-list .modal-title {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
  }

  .job-sub {
      margin-top: 2px;
      color: var(--job-text-3);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
  }

  .job-rail {
      padding: 12px 24px 8px;
      border-bottom: 1px solid var(--job-line);
  }

  .job-rail-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--job-text-3);
      font-size: 12px;
  }

  .job-rail-now {
      font-family: var(--job-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
  }

  .job-rail-track {
      position: relative;
      height: 40px;
      margin-top: 6px;
  }

  .job-rail-base {
      position: absolute;
      right: 0;
      bottom: 16px;
      left: 0;
      height: 1px;
      background-color: var(--job-line-strong);
  }

  .job-rail-tick {
      position: absolute;
      bottom: 16px;
      width: 1px;
      height: 5px;
      background-color: var(--job-line);
  }

  .job-rail-tick-label {
      position: absolute;
      bottom: 0;
      color: var(--job-text-3);
      font-family: var(--job-mono);
      font-size: 10px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transform: translateX(-50%);
  }

  .job-rail-tick-label.is-start { transform: none; }
  .job-rail-tick-label.is-end { transform: translateX(-100%); }

  .job-rail-mark {
      position: absolute;
      bottom: 16px;
      width: 2px;
      height: 12px;
      background-color: color-mix(in srgb, var(--tblr-body-color) 34%, transparent);
      border-radius: 1px;
      transform: translateX(-1px);
  }

  .job-rail-mark.is-next {
      height: 18px;
      background-color: var(--job-accent);
  }

  .job-head,
  .job-row {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) 128px 92px 64px;
      align-items: center;
      column-gap: 12px;
      padding: 0 24px;
  }

  .job-head {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 32px;
      background-color: var(--tblr-bg-surface);
      border-bottom: 1px solid var(--job-line);
      color: var(--job-text-3);
      font-size: 11px;
  }

  .job-head .is-right { text-align: right; }

  .job-row {
      min-height: 52px;
      padding-top: 8px;
      padding-bottom: 8px;
      border-top: 1px solid var(--job-line);
  }

  .job-row:first-child { border-top: 0; }
  .job-row:hover { background-color: var(--job-hover); }

  .job-led {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      background-color: color-mix(in srgb, var(--tblr-body-color) 28%, transparent);
      border-radius: 2px;
  }

  .job-led.is-on {
      background-color: var(--job-accent);
      animation: job-led-breathe 2.6s ease-in-out infinite;
  }

  .job-led.is-off {
      background-color: transparent;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tblr-body-color) 30%, transparent);
  }

  @keyframes job-led-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .38; }
  }

  @media (prefers-reduced-motion: reduce) {
      .job-led.is-on { animation: none; }
  }

  .job-name {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
      color: var(--tblr-body-color);
      font-size: 14px;
      line-height: 1.35;
  }

  .job-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
  }

  .job-tag {
      flex: 0 0 auto;
      padding: 1px 6px;
      border: 1px solid var(--job-line-strong);
      border-radius: 4px;
      color: var(--job-text-3);
      font-size: 10px;
      line-height: 1.4;
  }

  .job-cadence {
      overflow: hidden;
      color: var(--job-text-3);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
  }

  .job-next {
      color: var(--job-text-2);
      font-family: var(--job-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
  }

  .job-status {
      color: var(--job-text-3);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
  }

  .job-status.is-running { color: var(--job-accent); }
  .job-status.is-queued { color: var(--job-text-2); }

  .job-empty {
      padding: 40px 24px;
      color: var(--job-text-3);
      font-size: 13px;
      text-align: center;
  }

  @media (max-width: 639.98px) {
      #modal-job-list .modal-header { padding: 16px 20px 12px; }

      .job-rail { padding: 12px 20px 8px; }

      .job-head { display: none; }

      .job-row {
          grid-template-columns: 8px minmax(0, 1fr) auto;
          grid-template-areas:
              "led name status"
              ". cadence next";
          row-gap: 2px;
          padding: 10px 20px;
      }

      .job-led {
          grid-area: led;
          align-self: start;
          margin-top: 6px;
      }

      .job-name { grid-area: name; }
      .job-cadence { grid-area: cadence; font-size: 11px; }
      .job-next { grid-area: next; font-size: 11px; }
      .job-status { grid-area: status; }
  }

  @media (max-width: 991.98px) {
      .svc-grid { --tblr-gutter-x: 1rem; --tblr-gutter-y: 1rem; }
  }

  @media (max-width: 767.98px) {
      .svc-grid { --tblr-gutter-x: .75rem; --tblr-gutter-y: .75rem; }
      .svc-row { padding: 12px 14px; }
  }
</style>

<script type="text/javascript">

  // 显示服务提示框
  function show_service_modal(id, name) {
    switch(id) {
      case "nametest":
        $('#modal-nametest').modal('show');
        break;
      case "ruletest":
        $('#modal-ruletest').modal('show');
        break;
      case "nettest":
        $('[id^="nettest_item_res"]').empty();
        $('#modal-nettest').modal('show');
        break;
      case "processes":
        $('#modal-system-processes').modal('show');
        setTimeout(refresh_system_process, 1000);
        break;
      case "blacklist":
        show_confirm_modal("清理文件整理缓存后，已转移过的文件允许重新转移（包括识别错误的文件），是否确认？", function () {
          axios_post_do("truncate_blacklist", {}, function (ret) {
            show_success_modal("清理文件整理缓存成功");
          });
        });
        break;
      case "rsshistory":
        show_confirm_modal("清理RSS缓存后，已经订阅下载过但没有入库的文件可能会重新下载，是否确认？", function () {
          axios_post_do("truncate_rss_history", {}, function (ret) {
            show_success_modal("清理RSS历史记录成功");
          });
        });
        break;
      case "backup":
        $('#modal-backup').modal('show');
        break;
      case "sync":
        $('#modal-service-sync').modal('show');
        break;
      case "cron_job_list":
        $('#modal-job-list').modal('show');
        draw_cron_job_list();
        start_job_list_refresh();
        break;
      case "checkupdate":
        update_system();
        break;
      default:
        show_ask_modal("是否立即运行 " + name + "？", function () {
          run_scheduler(id, name);
        });
    }
  }

  // 打开 Git 系统更新面板；开始更新必须先检查到新版本
  function update_system() {
    GitPanelHasUpdate = false;
    git_panel_sync_buttons();
    $("#modal-git-update").modal("show");
    git_panel_refresh_info();
  }

  // 运行服务
  function run_scheduler(id, name) {
    const data = {"item": id};
    axios_post_do("sch", data, function (ret) {
      show_success_modal(`${name} 服务启动成功，正在后台运行`);
    });
  }

  // 名称测试
  $("#nametest_btn").unbind("click").click(function () {
    name_test($(this));
  });

  // 规则测试
  $("#ruletest_btn").unbind("click").click(function () {
    rule_test($(this));
  });

  // 网络测试
  $("#nettest_btn").unbind("click").click(async function () {
    let url_checked = select_GetSelectedVAL("nettest-item");
    if (url_checked.length == 0) {
      return;
    }

    let nettest_count_total = url_checked.length;
    let nettest_count_finished = 0;

    let btn_obj = $(this);
    btn_obj.text("测试中...").attr("disabled", true);

    for (let url_index of url_checked){
      net_test_one(url_index, ret=>{
        if (ret) {
          nettest_count_finished++;
          if (nettest_count_finished >= nettest_count_total) {
            btn_obj.text("测试").attr("disabled", false);
          }
        }
      });
    }
  });

  // 备份
  $("#backup_btn").unbind("click").click(function () {
    $(this).text("备份中...").attr("disabled", true);
    ajax_backup(function () {
      $(this).attr("disabled", false).text("备份当前配置");
    });
  });

  // 恢复备份
  $("#restore_btn").unbind("click").click(function () {
    if (!backup_dropzone || !backup_dropzone.files || !backup_dropzone.files[0]) {
      return;
    }
    $(this).text("恢复中...").attr("disabled", true);
    axios_post("/sys/restory_backup", { file_name: backup_dropzone.files[backup_dropzone.files.length - 1].name }, function (ret) {
      $(this).attr("disabled", false).text("恢复配置");
      $("#modal-backup").modal('hide');
      if (ret.code === 0) {
        show_success_modal("备份恢复成功，请重启系统生效！");
      } else {
        show_fail_modal(`备份恢复失败：${ret.msg}`, function() {
          $("#modal-backup").modal('show');
        });
      }
    });
  });

  // 名称识别测试
  function name_test(btn_obj) {
    const name_obj = $('#test_name');
    const name = name_obj.val();
    if (!name) {
      name_obj.addClass("is-invalid");
      return;
    } else {
      name_obj.removeClass("is-invalid");
    }
    btn_obj.text("识别中...").attr("disabled", true);
    media_name_test(name, "test_result", function () {
      btn_obj.text("识别").attr("disabled", false);
    }, $('#test_subtitle_name').val());
  }

  // 过滤规则测试
  function rule_test(btn_obj) {
    const title_obj = $("#test_title");
    const title = title_obj.val();
    if (!title) {
      title_obj.addClass("is-invalid");
      return;
    } else {
      title_obj.removeClass("is-invalid");
    }
    const size_obj = $("#test_size");
    const size = size_obj.val();
    if (!size || isNaN(size)) {
      size_obj.addClass("is-invalid");
      return;
    } else {
      size_obj.removeClass("is-invalid");
    }
    const rulegroup_obj = $("#test_rulegroup");
    const rulegroup = rulegroup_obj.val();
    if (rulegroup === "0") {
      rulegroup_obj.addClass("is-invalid");
      return;
    } else {
      rulegroup_obj.removeClass("is-invalid");
    }

    const subtitle = $("#test_subtitle").val();
    btn_obj.text("测试中...").attr("disabled", true);
    const params = {
      "title": title,
      "size": size,
      "rulegroup": rulegroup,
      "subtitle": subtitle
    };
    axios_post_do("rule_test", params, function (ret) {
      btn_obj.text("测试").attr("disabled", false);
      if (ret.code === 0) {
        let content = "";
        if (ret.flag) {
          content += `<span class="badge bg-green me-1 mb-1">${ret.text}</span>
                      <span class="badge badge-outline text-blue me-1 mb-1" title="命中规则在规则组内的序号">优先级：${ret.order}</span>`;
        } else {
          content += `<span class="badge bg-red me-1 mb-1">${ret.text}</span>`;
        }
        $("#testrule_result").empty().append(content);
      }
    });
  }

  // 单个网络测试
  function net_test_one(url_name, callBack) {
    if (!url_name) {
      return;
    }
    let url = $(`#nettest_item_url_${url_name}`).val();
    axios_post_do("net_test", decodeURI(url), function (ret) {
      if (ret.res) {
        $(`#nettest_item_res_${url_name}`).html('<span class="badge bg-green me-1 mb-1">是</span>');
        $(`#nettest_item_res_time_${url_name}`).html(`<span class="text-green">${ret.time}</span>`);
      } else {
        $(`#nettest_item_res_${url_name}`).html('<span class="badge bg-red me-1 mb-1">否</span>');
        $(`#nettest_item_res_time_${url_name}`).html(`<span class="text-red">${ret.time}</span>`);
      }
      callBack(true)
    });
  }

  // 刷新系统进程
  function refresh_system_process() {
    axios_post_do("get_system_processes", {}, function (ret) {
      if (ret.code === 0) {
        let content = "";
        for (let i = 0; i < ret.data.length; i++) {
          content += `<tr>
                        <td>${ret.data[i].id}</td>
                        <td>${ret.data[i].name}</td>
                        <td>${ret.data[i].time}</td>
                        <td>${ret.data[i].memory} MB</td>
                      </tr>`;
        }
        $("#system_processes_content").empty().append(content);
        if ($('#modal-system-processes').is(':visible')) {
          setTimeout(refresh_system_process, 2000);
        }
      }
    }, false);
  }

  // 立即运行目录同步
  function run_sync_now() {
    let sids = select_GetSelectedVAL("service_sync_dir");
    axios_post_do("run_directory_sync", {sid: sids}, function (ret) {
      $("#modal-service-sync").modal('hide');
      if (ret.code === 0) {
        show_success_modal("目录同步已启动，正在后台运行");
      } else {
        show_fail_modal(ret.msg);
      }
    });
  }

  // 定时任务列表自动刷新
  // 页面为 SPA 动态载入，重复进入时先清理上一次的轮询
  if (window.jobListRefreshTimer) {
    clearInterval(window.jobListRefreshTimer);
    window.jobListRefreshTimer = null;
  }
  var jobListRefreshTimer = null;
  var jobListLastSignature = null;

  // 转义任务名称等字段，避免特殊字符破坏页面结构
  function escape_job_html(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);
  }

  var JOB_ICON_CLOCK = `<svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20"
    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
    stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 3"/>
  </svg>`;

  // 任务状态：执行中 / 排队中 / 待执行
  function get_job_status(info) {
    if (info.running) {
      return {key: "running", led: "is-on", cls: "is-running", text: "执行中"};
    }
    if (info.pending) {
      return {key: "queued", led: "", cls: "is-queued", text: "排队中"};
    }
    if (!info.next_run_time) {
      return {key: "paused", led: "is-off", cls: "", text: "已暂停"};
    }
    return {key: "scheduled", led: "", cls: "", text: "待执行"};
  }

  function format_job_clock(date) {
    return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
  }

  // 任务时间：当天只显示时分，跨天补上「明天 / 月-日」
  function format_job_time(value) {
    const date = parse_job_date(value);
    if (!date) {
      return "—";
    }
    const now = new Date();
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const clock = format_job_clock(date);
    if (date.toDateString() === now.toDateString()) {
      return clock;
    }
    if (date.toDateString() === tomorrow.toDateString()) {
      return `明天 ${clock}`;
    }
    return `${date.getMonth() + 1}-${date.getDate()} ${clock}`;
  }

  // 统一间隔描述里的空格（「每30分钟」→「每 30 分钟」）
  function format_job_frequency(value) {
    return String(value ?? "")
      .replace(/^每(?=\d)/, "每 ")
      .replace(/(\d)(分钟|小时|秒|天)/g, "$1 $2");
  }

  // 收集接下来 24 小时内的执行点，按时间排序
  function collect_job_marks(jobs, now) {
    const windowMs = 24 * 60 * 60 * 1000;
    const marks = [];
    jobs.forEach(info => {
      const date = parse_job_date(info.next_run_time);
      if (!date) {
        return;
      }
      const offset = date.getTime() - now.getTime();
      if (offset < -60000 || offset > windowMs) {
        return;
      }
      marks.push({offset: offset, name: info.name, time: format_job_clock(date)});
    });
    marks.sort((a, b) => a.offset - b.offset);
    return marks;
  }

  // 生成 24 小时排程轨道，每个任务只标出它的下一次执行点
  function build_job_rail_content(marks, now) {
    const windowMs = 24 * 60 * 60 * 1000;
    let content = '<div class="job-rail-base"></div>';
    for (let step = 0; step <= 4; step++) {
      const ratio = step / 4;
      const tickTime = new Date(now.getTime() + ratio * windowMs);
      const position = (ratio * 100).toFixed(3);
      const labelClass = step === 0 ? " is-start" : (step === 4 ? " is-end" : "");
      content += `<span class="job-rail-tick" style="left:${position}%"></span>`;
      content += `<span class="job-rail-tick-label${labelClass}" style="left:${position}%">${format_job_clock(tickTime)}</span>`;
    }
    marks.forEach(mark => {
      const position = Math.min(100, Math.max(0, mark.offset / windowMs * 100)).toFixed(3);
      const nextClass = mark === marks[0] ? " is-next" : "";
      const markTitle = escape_job_html(`${mark.name} ${mark.time}`);
      content += `<span class="job-rail-mark${nextClass}" style="left:${position}%" title="${markTitle}"></span>`;
    });
    return content;
  }

  function draw_job_rail(jobs) {
    const rail = $("#job-rail");
    const now = new Date();
    const marks = collect_job_marks(jobs, now);

    if (!marks.length) {
      rail.attr("hidden", true);
      return;
    }

    $("#job-rail-now").text(`现在 ${format_job_clock(now)}`);
    $("#job-rail-track").html(build_job_rail_content(marks, now));
    rail.removeAttr("hidden");
  }

  // 查询定时任务信息
  function draw_cron_job_list(silent = false) {

    axios_post_do("get_jobs", {}, function (ret) {
      if (ret.code != "0") {
        return;
      }

      // 与页面内排程一致，按下次执行时间排序
      const jobs = typeof sorted_service_jobs === "function"
        ? sorted_service_jobs(ret.result || [])
        : (ret.result || []);

      // 轮询时数据未变化则不重绘，避免闪烁及滚动位置丢失
      const signature = JSON.stringify(jobs);
      if (silent && signature === jobListLastSignature) {
        return;
      }
      jobListLastSignature = signature;

      const runningCount = jobs.filter(job => job.running).length;
      $("#job-list-summary").text(
        jobs.length
          ? `共 ${jobs.length} 个任务${runningCount ? `，${runningCount} 个执行中` : ""}`
          : "暂无定时任务"
      );

      draw_job_rail(jobs);

      const jobListBody = $("#job-list-body").empty();
      if (!jobs.length) {
        jobListBody.append('<div class="job-empty">暂无定时任务</div>');
        return;
      }

      jobs.forEach(info => {
        const status = get_job_status(info);
        const pluginTag = info.from_plugin ? '<span class="job-tag">插件</span>' : "";
        // 执行频率：优先使用后端转换的文字描述，未识别时回退到原始触发器信息
        const frequency = escape_job_html(format_job_frequency(info.trigger_text || info.trigger_details || ""));
        const nextRun = escape_job_html(format_job_time(info.next_run_time));
        jobListBody.append(`
          <div class="job-row" title="${escape_job_html(info.trigger_details || "")}">
            <span class="job-led ${status.led}"></span>
            <span class="job-name">
              <span class="job-name-text">${escape_job_html(info.name)}</span>
              ${pluginTag}
            </span>
            <span class="job-cadence">${frequency || "—"}</span>
            <span class="job-next">${nextRun}</span>
            <span class="job-status ${status.cls}">${status.text}</span>
          </div>`);
      });
    }, false);
  }

  // 打开面板期间轮询刷新执行状态
  function start_job_list_refresh() {
    stop_job_list_refresh();
    jobListRefreshTimer = setInterval(() => {
      // 页面已切换时停止轮询
      if (!$('#modal-job-list').length) {
        stop_job_list_refresh();
        return;
      }
      draw_cron_job_list(true);
    }, 3000);
  }

  function stop_job_list_refresh() {
    if (jobListRefreshTimer) {
      clearInterval(jobListRefreshTimer);
      jobListRefreshTimer = null;
    }
  }

  $("#modal-job-list").on("hidden.bs.modal", function () {
    stop_job_list_refresh();
    jobListLastSignature = null;
  });

  // 初始化DropZone
  backup_dropzone = new Dropzone("#back_file");
  backup_dropzone.options.acceptedFiles = ".zip";

</script>

<script type="text/javascript">

  var AUTO_IDS = ["rssdownload", "subscribe_search_all", "pttransfer", "sync"];
  var MAINT_IDS = ["blacklist", "rsshistory", "backup", "checkupdate"];
  var DIAG_IDS = ["nametest", "ruletest", "nettest", "cron_job_list", "processes"];
  var SERVICE_COLOR_CLASSES = ["blue", "green", "orange", "red", "purple", "lime", "yellow", "cyan", "azure", "teal", "muted"];

  var SERVICE_JOB_NAMES = {
    rssdownload: ["RSS订阅"],
    subscribe_search_all: ["订阅定时搜索"],
    pttransfer: ["下载文件转移"]
  };

  var SERVICE_DESCS = {
    rssdownload: "按间隔检查订阅并下载新种子",
    subscribe_search_all: "定期搜索还没有完成的订阅",
    pttransfer: "把下载完成的文件转移到媒体库",
    sync: "监控目录变化并同步文件",
    blacklist: "清理已转移文件的记录，允许重新转移",
    rsshistory: "清理已经下载过的 RSS 记录",
    nametest: "测试种子名与文件名的识别结果",
    ruletest: "用过滤规则组测试种子",
    cron_job_list: "查看全部定时任务与执行状态",
    nettest: "检查站点与 API 的连通性",
    backup: "备份或恢复配置文件",
    checkupdate: "检查并更新系统镜像",
    processes: "查看后台进程与内存占用"
  };

  var serviceTasks = {};
  var serviceJobs = [];

  function parse_job_date(value) {
    if (!value) return null;
    const date = new Date(String(value).replace(/-/g, "/"));
    return isNaN(date.getTime()) ? null : date;
  }

  function pad2(value) {
    return String(value).padStart(2, "0");
  }

  // 后端只写「30 分钟」时补上「每」
  function format_cadence(value) {
    const text = String(value ?? "").trim();
    if (!text) return "";
    return /^\d+\s*(分钟|小时)$/.test(text) ? `每 ${text}` : text;
  }

  function service_color(color) {
    return SERVICE_COLOR_CLASSES.includes(color) ? color : "secondary";
  }

  function find_service_job(id) {
    const names = SERVICE_JOB_NAMES[id] || [];
    return serviceJobs.find(job => names.includes(job.name));
  }

  function sorted_service_jobs(jobs) {
    return jobs.slice().sort((a, b) => {
      const da = parse_job_date(a.next_run_time);
      const db = parse_job_date(b.next_run_time);
      if (da && db) return da - db;
      if (da) return -1;
      if (db) return 1;
      return String(a.name).localeCompare(String(b.name), "zh-CN");
    });
  }

  function service_status(id, task) {
    if (task.state !== "ON") {
      return {key: "off", text: "已停用"};
    }
    const job = find_service_job(id);
    if (job && job.running) return {key: "running", text: "运行中"};
    if (job && job.pending) return {key: "queued", text: "排队中"};
    return {key: "enabled", text: "已启用"};
  }

  function service_icon(task) {
    return task.svg || (typeof JOB_ICON_CLOCK !== "undefined" ? JOB_ICON_CLOCK : "");
  }

  function auto_row_html(id, task) {
    const name = task.name || id;
    const state = service_status(id, task);
    const cadence = format_cadence(task.time);
    const color = service_color(task.color);
    return `
      <div class="svc-row cursor-pointer" role="button" tabindex="0"
           data-service-id="${escape_job_html(id)}"
           data-service-name="${escape_job_html(name)}"
           aria-label="${escape_job_html(name)}，${escape_job_html(cadence || "无固定计划")}，${state.text}">
        <span class="svc-ico bg-${color}-lt text-${color}">${service_icon(task)}</span>
        <span class="svc-copy">
          <span class="svc-name fw-medium text-truncate">${escape_job_html(name)}</span>
          ${SERVICE_DESCS[id] ? `<span class="svc-desc text-muted text-truncate">${escape_job_html(SERVICE_DESCS[id])}</span>` : ""}
        </span>
        <span class="svc-status text-nowrap is-${state.key}" data-service-state><span class="svc-dot"></span>${state.text}</span>
      </div>`;
  }

  function tool_row_html(id, task) {
    const name = task.name || id;
    const desc = SERVICE_DESCS[id] || "";
    const color = service_color(task.color);
    return `
      <div class="svc-tool cursor-pointer" role="button" tabindex="0"
           data-tool-id="${escape_job_html(id)}"
           data-tool-name="${escape_job_html(name)}"
           aria-label="${escape_job_html(name)}${desc ? "：" + escape_job_html(desc) : ""}">
        <span class="svc-ico bg-${color}-lt text-${color}">${service_icon(task)}</span>
        <span class="svc-copy">
          <span class="svc-name fw-medium text-truncate">${escape_job_html(name)}</span>
          ${desc ? `<span class="svc-desc text-muted text-truncate">${escape_job_html(desc)}</span>` : ""}
        </span>
      </div>`;
  }

  function render_services(tasks) {
    serviceTasks = tasks || {};
    const autoIds = AUTO_IDS.filter(id => serviceTasks[id]);
    const maintIds = MAINT_IDS.filter(id => serviceTasks[id]);
    const diagIds = DIAG_IDS.filter(id => serviceTasks[id]);
    const known = new Set([...AUTO_IDS, ...MAINT_IDS, ...DIAG_IDS]);
    Object.keys(serviceTasks).forEach(id => {
      if (!known.has(id)) diagIds.push(id);
    });

    $("#svc-auto-list").html(autoIds.length
      ? autoIds.map(id => auto_row_html(id, serviceTasks[id])).join("")
      : '<div class="svc-empty text-center text-muted">没有自动任务</div>');
    $("#svc-maint-list").html(maintIds.length
      ? maintIds.map(id => tool_row_html(id, serviceTasks[id])).join("")
      : '<div class="svc-empty text-center text-muted">暂无维护工具</div>');
    $("#svc-diag-list").html(diagIds.length
      ? diagIds.map(id => tool_row_html(id, serviceTasks[id])).join("")
      : '<div class="svc-empty text-center text-muted">暂无诊断工具</div>');

    const enabled = autoIds.filter(id => serviceTasks[id].state === "ON").length;
    $("#svc-auto-meta").text(`${enabled}/${autoIds.length} 已启用`);

    bind_service_actions();
    update_auto_rows();
  }

  function bind_service_actions() {
    const $lists = $("#svc-auto-list, #svc-maint-list, #svc-diag-list");
    $lists.off(".svc");
    $lists.on("click.svc", "[data-service-id], [data-tool-id]", function () {
      open_service_item($(this));
    }).on("keydown.svc", "[data-service-id], [data-tool-id]", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        open_service_item($(this));
      }
    });
  }

  function open_service_item($el) {
    const id = $el.attr("data-service-id") || $el.attr("data-tool-id");
    const name = $el.attr("data-service-name") || $el.attr("data-tool-name");
    if (id) {
      show_service_modal(id, name || id);
    }
  }

  function update_auto_rows() {
    $("#svc-auto-list [data-service-id]").each(function () {
      const row = $(this);
      const id = row.attr("data-service-id");
      const task = serviceTasks[id];
      if (!task) return;

      const state = service_status(id, task);
      const cadence = format_cadence(task.time);

      row.find("[data-service-state]")
        .attr("class", `svc-status text-nowrap is-${state.key}`)
        .html(`<span class="svc-dot"></span>${state.text}`);

      row.attr("aria-label", `${task.name || id}，${cadence || "无固定计划"}，${state.text}`);
    });
  }

  function load_service_jobs() {
    return new Promise(resolve => {
      axios_post_do("get_jobs", {}, function (ret) {
        if (ret && String(ret.code) === "0") {
          serviceJobs = ret.result || [];
          update_auto_rows();
        }
        resolve();
      }, false);
    });
  }

  $(document).ready(function() {
    axios_post('/data/service', {}, function(response) {
      if (response.code === 0 && response.data) {
        const data = response.data;

        if (data.ruleGroups) {
          const ruleSelect = $('#test_rulegroup');
          ruleSelect.empty();
          if (data.ruleGroups.length > 0) {
            ruleSelect.append('<option value="0">请选择</option>');
            data.ruleGroups.forEach(rule => {
              ruleSelect.append(`<option value="${rule.id}">${rule.name}</option>`);
            });
          } else {
            ruleSelect.append('<option value="0">未配置</option>');
          }
        }

        if (data.syncPaths) {
          const syncPathsGroup = $('#sync-paths-group');
          syncPathsGroup.empty();
          Object.entries(data.syncPaths).forEach(([syncId, syncPath]) => {
            const pathItem = `
              <label class="form-selectgroup-item">
                <input type="checkbox" name="service_sync_dir" value="${syncId}" class="form-selectgroup-input">
                <span class="form-selectgroup-label">${syncPath.from}</span>
              </label>
            `;
            syncPathsGroup.append(pathItem);
          });
        }

        if (data.schedulerTasks && Object.keys(data.schedulerTasks).length > 0) {
          render_services(data.schedulerTasks);
          $('#services-container').show();
          $('#no-services').hide();

          if (data.schedulerTasks.nettest && data.schedulerTasks.nettest.targets) {
            const nettestTableBody = $('#nettest-table-body');
            nettestTableBody.empty();
            for (const target of data.schedulerTasks.nettest.targets) {
              const [[name, url]] = Object.entries(target);
              const row = `
                <tr>
                  <td class="w-1"><input class="form-check-input m-0 align-middle" name="nettest-item" value="${name}" type="checkbox"></td>
                  <td>
                    <span>${url}</span>
                    <input id="nettest_item_url_${name}" value="${url}" type="hidden">
                  </td>
                  <td id="nettest_item_res_${name}"></td>
                  <td id="nettest_item_res_time_${name}"></td>
                </tr>
              `;
              nettestTableBody.append(row);
            }
          }

          if (typeof startPolling === "function") {
            startPolling("service_jobs", load_service_jobs, 10000);
          } else {
            load_service_jobs();
          }
        } else {
          $('#services-container').hide();
          $('#no-services').show();
        }
      }
    });
  });

</script>
