<script type="text/javascript">

  // 显示服务提示框
  function show_service_modal(id, name) {
    switch(id) {
      case "nametest":
        $('#modal-nametest').modal('show');
        break;
      case "ruletest":
        $('#modal-ruletest').modal('show');
        break;
      case "nettest":
        $('[id^="nettest_item_res"]').empty();
        $('#modal-nettest').modal('show');
        break;
      case "processes":
        $('#modal-system-processes').modal('show');
        setTimeout(refresh_system_process, 1000);
        break;
      case "blacklist":
        show_confirm_modal("清理文件整理缓存后，已转移过的文件允许重新转移（包括识别错误的文件），是否确认？", function () {
          axios_post_do("truncate_blacklist", {}, function (ret) {
            show_success_modal("清理文件整理缓存成功");
          });
        });
        break;
      case "rsshistory":
        show_confirm_modal("清理RSS缓存后，已经订阅下载过但没有入库的文件可能会重新下载，是否确认？", function () {
          axios_post_do("truncate_rss_history", {}, function (ret) {
            show_success_modal("清理RSS历史记录成功");
          });
        });
        break;
      case "backup":
        $('#modal-backup').modal('show');
        break;
      case "sync":
        $('#modal-service-sync').modal('show');
        break;
      case "cron_job_list":
        $('#modal-job-list').modal('show');
        draw_cron_job_list();
        start_job_list_refresh();
        break;
      case "checkupdate":
        update_system();
        break;
      default:
        show_ask_modal("是否立即运行 " + name + "？", function () {
          run_scheduler(id, name);
        });
    }
  }

  // 打开 Git 系统更新面板；开始更新必须先检查到新版本
  function update_system() {
    GitPanelHasUpdate = false;
    git_panel_sync_buttons();
    $("#modal-git-update").modal("show");
    git_panel_refresh_info();
  }

  // 运行服务
  function run_scheduler(id, name) {
    const data = {"item": id};
    axios_post_do("sch", data, function (ret) {
      show_success_modal(`${name} 服务启动成功，正在后台运行`);
    });
  }

  // 名称测试
  $("#nametest_btn").unbind("click").click(function () {
    name_test($(this));
  });

  // 规则测试
  $("#ruletest_btn").unbind("click").click(function () {
    rule_test($(this));
  });

  // 网络测试
  $("#nettest_btn").unbind("click").click(async function () {
    let url_checked = select_GetSelectedVAL("nettest-item");
    if (url_checked.length == 0) {
      return;
    }

    let nettest_count_total = url_checked.length;
    let nettest_count_finished = 0;

    let btn_obj = $(this);
    btn_obj.text("测试中...").attr("disabled", true);

    for (let url_index of url_checked){
      net_test_one(url_index, ret=>{
        if (ret) {
          nettest_count_finished++;
          if (nettest_count_finished >= nettest_count_total) {
            btn_obj.text("测试").attr("disabled", false);
          }
        }
      });
    }
  });

  // 备份
  $("#backup_btn").unbind("click").click(function () {
    $(this).text("备份中...").attr("disabled", true);
    ajax_backup(function () {
      $(this).attr("disabled", false).text("备份当前配置");
    });
  });

  // 恢复备份
  $("#restore_btn").unbind("click").click(function () {
    if (!backup_dropzone || !backup_dropzone.files || !backup_dropzone.files[0]) {
      return;
    }
    $(this).text("恢复中...").attr("disabled", true);
    axios_post_do("restory_backup", { file_name: backup_dropzone.files[backup_dropzone.files.length - 1].name }, function (ret) {
      $(this).attr("disabled", false).text("恢复配置");
      $("#modal-backup").modal('hide');
      if (ret.code === 0) {
        show_success_modal("备份恢复成功，请重启系统生效！");
      } else {
        show_fail_modal(`备份恢复失败：${ret.msg}`, function() {
          $("#modal-backup").modal('show');
        });
      }
    });
  });

  // 名称识别测试
  function name_test(btn_obj) {
    const name_obj = $('#test_name');
    const name = name_obj.val();
    if (!name) {
      name_obj.addClass("is-invalid");
      return;
    } else {
      name_obj.removeClass("is-invalid");
    }
    btn_obj.text("识别中...").attr("disabled", true);
    media_name_test(name, "test_result", function () {
      btn_obj.text("识别").attr("disabled", false);
    }, $('#test_subtitle_name').val());
  }

  // 过滤规则测试
  function rule_test(btn_obj) {
    const title_obj = $("#test_title");
    const title = title_obj.val();
    if (!title) {
      title_obj.addClass("is-invalid");
      return;
    } else {
      title_obj.removeClass("is-invalid");
    }
    const size_obj = $("#test_size");
    const size = size_obj.val();
    if (!size || isNaN(size)) {
      size_obj.addClass("is-invalid");
      return;
    } else {
      size_obj.removeClass("is-invalid");
    }
    const rulegroup_obj = $("#test_rulegroup");
    const rulegroup = rulegroup_obj.val();
    if (rulegroup === "0") {
      rulegroup_obj.addClass("is-invalid");
      return;
    } else {
      rulegroup_obj.removeClass("is-invalid");
    }

    const subtitle = $("#test_subtitle").val();
    btn_obj.text("测试中...").attr("disabled", true);
    const params = {
      "title": title,
      "size": size,
      "rulegroup": rulegroup,
      "subtitle": subtitle
    };
    axios_post_do("rule_test", params, function (ret) {
      btn_obj.text("测试").attr("disabled", false);
      if (ret.code === 0) {
        let content = "";
        if (ret.flag) {
          content += `<span class="badge bg-green me-1 mb-1">${ret.text}</span>
                      <span class="badge badge-outline text-blue me-1 mb-1" title="命中规则在规则组内的序号">优先级：${ret.order}</span>`;
        } else {
          content += `<span class="badge bg-red me-1 mb-1">${ret.text}</span>`;
        }
        $("#testrule_result").empty().append(content);
      }
    });
  }

  // 单个网络测试
  function net_test_one(url_name, callBack) {
    if (!url_name) {
      return;
    }
    let url = $(`#nettest_item_url_${url_name}`).val();
    axios_post_do("net_test", decodeURI(url), function (ret) {
      if (ret.res) {
        $(`#nettest_item_res_${url_name}`).html('<span class="badge bg-green me-1 mb-1">是</span>');
        $(`#nettest_item_res_time_${url_name}`).html(`<span class="text-green">${ret.time}</span>`);
      } else {
        $(`#nettest_item_res_${url_name}`).html('<span class="badge bg-red me-1 mb-1">否</span>');
        $(`#nettest_item_res_time_${url_name}`).html(`<span class="text-red">${ret.time}</span>`);
      }
      callBack(true)
    });
  }

  // 刷新系统进程
  function refresh_system_process() {
    axios_post_do("get_system_processes", {}, function (ret) {
      if (ret.code === 0) {
        let content = "";
        for (let i = 0; i < ret.data.length; i++) {
          content += `<tr>
                        <td>${ret.data[i].id}</td>
                        <td>${ret.data[i].name}</td>
                        <td>${ret.data[i].time}</td>
                        <td>${ret.data[i].memory} MB</td>
                      </tr>`;
        }
        $("#system_processes_content").empty().append(content);
        if ($('#modal-system-processes').is(':visible')) {
          setTimeout(refresh_system_process, 2000);
        }
      }
    }, false);
  }

  // 立即运行目录同步
  function run_sync_now() {
    let sids = select_GetSelectedVAL("service_sync_dir");
    axios_post_do("run_directory_sync", {sid: sids}, function (ret) {
      $("#modal-service-sync").modal('hide');
      if (ret.code === 0) {
        show_success_modal("目录同步已启动，正在后台运行");
      } else {
        show_fail_modal(ret.msg);
      }
    });
  }

  // 定时任务列表自动刷新
  // 页面为 SPA 动态载入，重复进入时先清理上一次的轮询
  if (window.jobListRefreshTimer) {
    clearInterval(window.jobListRefreshTimer);
    window.jobListRefreshTimer = null;
  }
  var jobListRefreshTimer = null;
  var jobListLastSignature = null;

  // 转义任务名称等字段，避免特殊字符破坏页面结构
  function escape_job_html(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);
  }

  var JOB_ICON_CLOCK = `<svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20"
    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
    stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 3"/>
  </svg>`;

  var JOB_ICON_PLUGIN = `<svg xmlns="http://www.w3.org/2000/svg" class="icon" width="20" height="20"
    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none"
    stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
    <path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0 -1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-1a2 2 0 0 0 -4 0v1a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 0 -1 -1h-1a2 2 0 0 1 0 -4h1a1 1 0 0 0 1 -1v-3a1 1 0 0 1 1 -1"/>
  </svg>`;

  // 任务状态：执行中 / 排队中 / 待执行
  function get_job_status(info) {
    if (info.running) {
      return {key: "running", cls: "bg-blue-lt", text: "执行中", dot: true};
    }
    if (info.pending) {
      return {key: "queued", cls: "bg-orange-lt", text: "排队中", dot: false};
    }
    return {key: "scheduled", cls: "bg-green-lt", text: "待执行", dot: false};
  }

  // 查询定时任务信息
  function draw_cron_job_list(silent = false) {

    axios_post_do("get_jobs", {}, function (ret) {
      if (ret.code != "0") {
        return;
      }

      const jobs = ret.result || [];

      // 轮询时数据未变化则不重绘，避免闪烁及滚动位置丢失
      const signature = JSON.stringify(jobs);
      if (silent && signature === jobListLastSignature) {
        return;
      }
      jobListLastSignature = signature;

      const runningCount = jobs.filter(job => job.running).length;
      $("#job-list-summary").text(
        jobs.length
          ? `共 ${jobs.length} 个任务${runningCount ? `，${runningCount} 个执行中` : ""}`
          : "暂无定时任务"
      );

      const jobListBody = $("#job-list-body").empty();
      if (!jobs.length) {
        jobListBody.append('<div class="list-group-item text-center text-muted py-5">暂无定时任务</div>');
        return;
      }

      jobs.forEach(info => {
        const status = get_job_status(info);
        const isPlugin = !!info.from_plugin;
        const pluginBadge = isPlugin ? '<span class="badge bg-purple-lt">插件</span>' : "";
        // 执行频率：优先使用后端转换的文字描述，未识别时回退到原始触发器信息
        const frequency = escape_job_html(info.trigger_text || info.trigger_details);
        const scheduleText = status.key === "scheduled"
          ? `下次执行：<span class="text-body">${escape_job_html(info.next_run_time || "未知")}</span>${frequency ? `(<span class="text-mute">${frequency}</span>)` : ""}`
          : (frequency ? `执行频率：<span class="text-body">${frequency}</span>` : "");
        const statusBadge = `
          <span class="badge ${status.cls}">
            ${status.dot ? '<span class="status-dot status-dot-animated bg-blue me-1"></span>' : ""}${status.text}
          </span>`;

        const row = `
          <div class="list-group-item px-3 px-md-4 py-3">
            <div class="d-flex align-items-start">
              <span class="avatar avatar-sm ${isPlugin ? "bg-purple-lt text-purple" : "bg-blue-lt text-blue"} me-3">
                ${isPlugin ? JOB_ICON_PLUGIN : JOB_ICON_CLOCK}
              </span>
              <div class="flex-fill" style="min-width: 0">
                <div class="d-flex align-items-center flex-wrap gap-2">
                  <span class="font-weight-medium text-truncate" style="min-width: 0" title="${escape_job_html(info.name)}">${escape_job_html(info.name)}</span>
                  ${pluginBadge}
                </div>
                ${scheduleText ? `<div class="text-muted small mt-1 text-truncate" title="${escape_job_html(info.trigger_details)}">${scheduleText}</div>` : ""}
              </div>
              <div class="ms-3 align-self-center">${statusBadge}</div>
            </div>
          </div>`;
        jobListBody.append(row);
      });
    }, false);
  }

  // 打开面板期间轮询刷新执行状态
  function start_job_list_refresh() {
    stop_job_list_refresh();
    jobListRefreshTimer = setInterval(() => {
      // 页面已切换时停止轮询
      if (!$('#modal-job-list').length) {
        stop_job_list_refresh();
        return;
      }
      draw_cron_job_list(true);
    }, 3000);
  }

  function stop_job_list_refresh() {
    if (jobListRefreshTimer) {
      clearInterval(jobListRefreshTimer);
      jobListRefreshTimer = null;
    }
  }

  $("#modal-job-list").on("hidden.bs.modal", function () {
    stop_job_list_refresh();
    jobListLastSignature = null;
  });

  // 初始化DropZone
  backup_dropzone = new Dropzone("#back_file");
  backup_dropzone.options.acceptedFiles = ".zip";

</script>

<script type="text/javascript">

  // 页面加载完成后，使用axios_post请求/data/service接口获取数据并填充页面
  $(document).ready(function() {
    axios_post('/data/service', {}, function(response) {
      if (response.code === 0 && response.data) {

        const data = response.data;

        // 填充过滤规则选项
        if (data.ruleGroups) {
          const ruleSelect = $('#test_rulegroup');
          ruleSelect.empty();
          if (data.ruleGroups.length > 0) {
            ruleSelect.append('<option value="0">请选择</option>');
            data.ruleGroups.forEach(rule => {
              ruleSelect.append(`<option value="${rule.id}">${rule.name}</option>`);
            });
          } else {
            ruleSelect.append('<option value="0">未配置</option>');
          }
        }

        // 填充同步路径选项
        if (data.syncPaths) {
          const syncPathsGroup = $('#sync-paths-group');
          syncPathsGroup.empty();
          Object.entries(data.syncPaths).forEach(([syncId, syncPath]) => {
            const pathItem = `
              <label class="form-selectgroup-item">
                <input type="checkbox" name="service_sync_dir" value="${syncId}" class="form-selectgroup-input">
                <span class="form-selectgroup-label">${syncPath.from}</span>
              </label>
            `;
            syncPathsGroup.append(pathItem);
          });
        }

        // 生成服务列表
        if (data.schedulerTasks && Object.keys(data.schedulerTasks).length > 0) {

          const servicesList = $('#services-list');
          const servicesContainer = $('#services-container');
          const noServices = $('#no-services');

          servicesList.empty();

          Object.entries(data.schedulerTasks).forEach(([id, scheduler]) => {
            const serviceCard = `
              <div class="card card-sm card-link-pop">
                <div class="card-body">
                  <div class="row align-items-center">
                    <div class="col-auto">
                      <span class="bg-${scheduler.color} text-white avatar">
                        ${scheduler.svg}
                      </span>
                    </div>
                    <div class="col">
                      <div class="font-weight-medium">
                        <a href="javascript:show_service_modal('${id}','${scheduler.name}')" id="service_btn">${scheduler.name}</a>
                      </div>
                      <div class="text-muted">
                        ${scheduler.time}
                      </div>
                    </div>
                    ${scheduler.state === 'ON' ? `
                      <div class="col-auto align-self-center">
                        <span class="badge bg-green"></span>
                      </div>
                    ` : ''}
                  </div>
                </div>
              </div>
            `;
            servicesList.append(serviceCard);
          });

          servicesContainer.show();
          noServices.hide();

          // 填充网络测试表格
          if (data.schedulerTasks.nettest && data.schedulerTasks.nettest.targets) {
            const nettestTableBody = $('#nettest-table-body');
            nettestTableBody.empty();
            for (const target of data.schedulerTasks.nettest.targets) {
              const [[name, url]] = Object.entries(target);
              const row = `
                <tr>
                  <td class="w-1"><input class="form-check-input m-0 align-middle" name="nettest-item" value="${name}" type="checkbox"></td>
                  <td>
                    <span>${url}</span>
                    <input id="nettest_item_url_${name}" value="${url}" type="hidden">
                  </td>
                  <td id="nettest_item_res_${name}"></td>
                  <td id="nettest_item_res_time_${name}"></td>
                </tr>
              `;
              nettestTableBody.append(row);
            }
          }

        } else {
          $('#services-container').hide();
          $('#no-services').show();
        }
      }
    });
  });

</script>
