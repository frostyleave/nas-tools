<div class="container-xl">
  <div class="page-header d-print-none mt-2">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title">订阅日历</h2>
      </div>
      <div class="col-auto ms-auto d-print-none">
      </div>
    </div>
  </div>
</div>

<div class="page-body">
  <div class="container-xl">
    <div id='calendar-box'></div>
  </div>
</div>

<link rel="stylesheet" href="/static/libs/fullcalendar/fullcalendar.min.css" />

<script src="/static/libs/fullcalendar/fullcalendar.min.js"></script>
<script src="/static/libs/fullcalendar/locales/zh-cn.js"></script>

<script type="text/javascript">
  
  calendar = new FullCalendar.Calendar(document.getElementById('calendar-box'), {
    themeSystem: 'bootstrap',
    bootstrapFontAwesome: false,
    stickyHeaderDates: false,
    fixedWeekCount: false,
    expandRows: true,
    height: 'auto',
    locale: 'zh-cn',
    headerToolbar: {
      left: 'prev,next',
      center: 'title',
      right: 'dayGridWeek,dayGridMonth,listMonth'
    },
    defaultView: 'dayGridWeek',
    initialDate: new Date(),
    navLinks: true,
    editable: false,
    dayMaxEvents: true,
    selectable: false,
    events: [],
    eventDisplay: 'list-item',
    eventClick: function (info) {
      const eventData = info.event.extendedProps;
      let type;
      if (eventData.type == "电影") {
        type = "MOV";
      } else {
        type = "TV";
      }
      show_mediainfo_modal(type, info.event.title, eventData.year, info.event.id, "rss_calendar", eventData.rssid);
    },
    eventContent: function (info) {
      const eventData = info.event.extendedProps;
      let border_color;
      if (eventData.type == '电影') {
        border_color = 'bg-green';
      } else {
        border_color = 'bg-primary';
      }
      const innerText = `
        <a class="card card-link" href="javascript:void(0)">
          <div class="card-status-start ${border_color}"></div>
          <div class="card-body" style="padding: 0.5rem 1rem; overflow: hidden;">
            <div class="row">
              <div class="col-auto rounded" style="width:40px; height:50px; background-image:url(${eventData.poster}); background-size:cover;"></div>
              <div class="col media_calendar_item_info d-none d-xl-block">
                <div class="font-weight-medium" style="white-space:pre-wrap;word-break:break-all;"><strong>${info.event.title}</strong></div>
                <div class="text-muted">${eventData.type} 评分: ${eventData.vote_average}</div>
              </div>
            </div>
          </div>
        </a>
      `;
      return {html: innerText};
    }
  });

  //查询订阅电影的上映日期
  RssMovieItems = [];

  function init_rss_movies_event() {
    for (let i = 0; i < RssMovieItems.length; i++) {
      axios_post_do("movie_calendar_data",
          {
            "id": RssMovieItems[i].id,
            "rssid": RssMovieItems[i].rssid
          }, function (ret) {
        if (ret.code === 0) {
          calendar.addEvent({
            id: ret.id,
            title: ret.title,
            start: ret.start,
            allDay: true,
            poster: ret.poster,
            vote_average: ret.vote_average,
            year: ret.year,
            type: ret.type,
            rssid: ret.rssid
          });
        }
      });
    }
  };
  //查询订阅电视剧各集的上映日期
  RssTvItems = [];

  function init_rss_tvs_event() {
    for (let i = 0; i < RssTvItems.length; i++) {
      axios_post_do("tv_calendar_data", {
        "id": RssTvItems[i].id,
        "season": RssTvItems[i].season,
        "name": RssTvItems[i].name,
        "rssid": RssTvItems[i].rssid
      }, function (ret) {
        if (ret.code === 0) {
          for (let i = 0; i < ret.events.length; i++) {
            calendar.addEvent({
              id: ret.events[i].id,
              title: ret.events[i].title,
              start: ret.events[i].start,
              allDay: true,
              poster: ret.events[i].poster,
              vote_average: ret.events[i].vote_average,
              year: ret.events[i].year,
              type: ret.events[i].type,
              rssid: ret.events[i].rssid
            });
          }
        }
      });
    }
  };

  //显示媒体详情弹窗
  function show_mediainfo_modal(rtype, name, year, mediaid, page, rssid) {
    if (!page) {
      page = "";
    }
    if (!rssid) {
      rssid = "";
    }
    axios_post_do("media_info", {
      "id": mediaid,
      "title": name,
      "year": year,
      "type": rtype,
      "page": page,
      "rssid": rssid
    }, function (ret) {
      if (ret.code === 0) {
        //显示信息
        $("#system_media_name").text(ret.title);
        $("#system_release_date").text(ret.release_date)
        if (ret.poster_path) {
          $("#system_media_poster").attr("img-src", ret.poster_path);
        } else {
          $("#system_media_poster").attr("img-src", "../static/img/no-image.svg");
        }
        if (ret.overview && ret.overview.length > 200) {
          $("#system_media_overview").text(ret.overview.substr(0, 200) + " ...");
        } else {
          $("#system_media_overview").text(ret.overview);
        }
        if (!ret.vote_average || ret.vote_average == "0") {
          $("#system_media_vote").hide();
        } else {
          $("#system_media_vote").text(ret.vote_average).show();
        }
        //订阅按钮、搜索按钮
        if ($("#system_media_rss_dropdown").hasClass("show")) {
          $("#system_media_rss_btn").dropdown("toggle");
        }
        //先隐藏所有按钮，有需要再显示
        $("#system_media_rss_btn").hide();
        $("#system_media_search_btn").hide();
        $("#system_media_refresh_btn").hide();
        $("#system_media_url_btn").hide();
        if (ret.rssid) {
          //取消订阅按钮
          $("#system_media_rss_btn").text("取消订阅")
            .removeAttr("data-bs-toggle")
            .removeClass("dropdown-toggle")
            .attr("href", 'javascript:remove_rss_media("' + ret.title + '","' + ret.year + '","' + ret.type + '","' + ret.rssid + '","' + ret.page + '")')
            .show();
          //搜索按钮
          $("#system_media_search_btn").text("搜索")
            .attr("href", 'javascript:search_mediainfo_media("' + ret.tmdbid + '", "' + ret.title + '", "' + ret.type_str + '")')
            .show();
          //刷新和编辑按钮
          if (ret.page.startsWith("movie_rss") || ret.page.startsWith("tv_rss")) {
            //编辑
            $("#system_media_url_btn").text("编辑")
              .attr("href", "javascript:show_edit_rss_media_modal('" + ret.rssid + "', '" + ret.type_str + "')")
              .show();
            //刷新
            $("#system_media_refresh_btn").text("刷新")
              .attr("href", 'javascript:refresh_rss_media("' + ret.type + '","' + ret.rssid + '","' + ret.page + '")')
              .show();
          } else {
            //详情按钮
            $("#system_media_url_btn").text("详情")
              .attr("href", 'javascript:navmenu("media_detail?type=' + ret.type + '&id=' + ret.tmdbid + '")')
              .show();
          }
        } else {
          //详情按钮
          $("#system_media_url_btn").text("详情")
            .attr("href", 'javascript:navmenu("media_detail?type=' + ret.type + '&id=' + ret.tmdbid + '")')
            .show();
          //订阅按钮
          $("#system_media_rss_btn").text("订阅");
          $("#system_media_rss_dropdown").empty();
          if (ret.seasons.length === 0) {
            $("#system_media_rss_btn").removeAttr("data-bs-toggle")
              .removeClass("dropdown-toggle")
              .attr("href", 'javascript:add_rss_media("' + ret.title + '","' + ret.year + '","' + ret.type + '","' + ret.tmdbid + '","' + ret.page + '","")')
          } else {
            $("#system_media_rss_btn").prop("data-bs-toggle", "dropdown")
              .addClass("dropdown-toggle")
              .attr("href", 'javascript:$("#system_media_rss_btn").dropdown("toggle")')
            //订阅季的下拉框
            for (let i = 0; i < ret.seasons.length; i++) {
              $("#system_media_rss_dropdown").append('<a class="dropdown-item" href=\'javascript:add_rss_media("' + ret.title + '","' + ret.year + '","' + ret.type + '","' + ret.tmdbid + '","' + ret.page + '","' + ret.seasons[i].num + '")\'>' + ret.seasons[i].text + '</a>');
            }
          }
          $("#system_media_rss_btn").show();
          //搜索按钮
          $("#system_media_search_btn").text("搜索")
            .attr("href", 'javascript:search_mediainfo_media("' + ret.tmdbid + '", "' + ret.title + '", "' + ret.type_str + '")')
            .show();
        }
        $("#system_media_name_link").attr("href", ret.link_url);
        //弹窗
        $("#system-media-modal").modal("show");
      } else if (ret.code === 1) {
        if (ret.rssid) {
          show_edit_rss_media_modal(ret.rssid, ret.type_str);
        } else {
          show_fail_modal(`${name} 未查询到TMDB媒体信息！`);
        }
      }
    });
  }

</script>

<script>
  $(document).ready(function () {
    // 使用axios_post请求/data/rss_calendar接口获取数据并填充页面
    axios_post('/data/rss_calendar', {}, function(response) {
      if (response.code === 0 && response.data) {
        const data = response.data;

        // 更新全局变量
        if (data.RssMovieItems) {
          RssMovieItems = data.RssMovieItems;
        }
        if (data.RssTvItems) {
          RssTvItems = data.RssTvItems;
        }

        // 日历渲染
        calendar.render();
        //拉取订阅电影
        init_rss_movies_event();
        //拉取订阅电视剧
        init_rss_tvs_event();
      } else {
        // 即使没有数据也要渲染日历
        calendar.render();
      }
    });
  });
</script>
