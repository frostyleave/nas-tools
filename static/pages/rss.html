<div class="container-xl">
  <div class="page-header d-print-none mt-2">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title" id="rss-page-title">订阅任务</h2>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          <a href="javascript:show_add_rss_type_select_modal()" class="btn btn-primary d-none d-sm-inline-flex">
            <i class="ti ti-plus fs-3"></i>
            新增订阅
          </a>
          <a href="javascript:show_add_rss_type_select_modal()" class="btn btn-primary d-sm-none mbtn-action">
            <i class="ti ti-plus fs-3"></i>
          </a>
          <a href="javascript:show_default_rss_setting_type_select_modal()" class="btn btn-twitter d-none d-sm-inline-flex">
            <i class="ti ti-server-2 fs-3"></i>
            默认设置
          </a>
          <a href="javascript:show_default_rss_setting_type_select_modal()" class="btn btn-twitter d-sm-none mbtn-action">
            <i class="ti ti-server-2 fs-3"></i>
          </a>
          <a href="javascript:navmenu('rss_history')" class="btn d-none d-sm-inline-flex">
            <i class="ti ti-history fs-3"></i>
            订阅历史
          </a>
          <a href="javascript:navmenu('rss_history')" class="btn d-sm-none mbtn-action" title="订阅历史">
            <i class="ti ti-history fs-3"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="page-body" id="rss-container">
  <div class="container-xl">
    <div class="d-grid gap-3 grid-info-card" id="rss-list">
      <!-- 动态生成的内容将在这里显示 -->
    </div>
  </div>
</div>

<script type="text/javascript">

  $(document).ready(function() {
    loadPageData();
  });

  function loadPageData() {

    const container = document.getElementById("page-content");
    const urlParams = $(container).data("params");
    var typeParam = urlParams.t || '';

    // 请求数据并生成页面
    axios_post("/data/rss?t=" + typeParam, {}, function(ret) {
      if (ret.code === 0) {
        generateRssPage(ret.data);
      } else {
        show_fail_modal("加载RSS订阅失败");
      }
    });

  }

  // 生成RSS订阅页面内容
  function generateRssPage(data) {
    
    const container = $("#rss-list");
    container.empty();

    const movies = data.Movies || {};
    const tvs = data.Tvs || {};

    if (Object.keys(movies).length === 0 && Object.keys(tvs).length === 0) {
      const noDataText = '当前没有正在订阅的电视剧/电影';
      container.parent().parent().html(`<nodata-found title="没有订阅" text="${noDataText}"></nodata-found>`);
      return;
    }

    // 电影在前，电视剧在后
    $.each(movies, function (id, item) {
      container.append(generateRssItemHtml(item, id, data, 'MOV'));
    });

    $.each(tvs, function (id, item) {
      container.append(generateRssItemHtml(item, id, data, 'TV'));
    });

  }

  // 生成单个RSS项目HTML
  function generateRssItemHtml(item, id, data, type) {

    const dataAttr = item;
    const typeName = type === 'TV' ? '电视剧' : '电影';
    // 评分角标：电影紫色、电视剧蓝色；评分统一保留一位小数
    const voteBg = type === 'TV' ? 'bg-blue' : 'bg-purple';
    const voteValue = parseFloat(dataAttr.vote);
    const voteText = isNaN(voteValue) ? '' : voteValue.toFixed(1);

    // 生成标题
    let title = '';
    if (type === 'MOV') {
      title = `${dataAttr.name}(${dataAttr.year})`;
    } else {
      title = dataAttr.name;
      if (dataAttr.season && dataAttr.season !== "S00") {
        title += ` - ${dataAttr.season}`;
      }
    }

    // 生成标签
    const badges = generateBadges(dataAttr, data);

    // 生成站点标签
    const siteBadges = generateSiteBadges(dataAttr);

    // 生成状态
    const statusInfo = generateStatusInfo(dataAttr);

    // 生成进度条（仅TV）
    const progressBar = type === 'TV' ? generateProgressBar(dataAttr) : '';

    // 暂停/恢复订阅按钮
    const pauseBtn = dataAttr.state === 'P'
      ? `<a href="javascript:toggle_rss_pause('${type}','${id}','R')" title="恢复订阅"
          class="text-white" id="pause_btn_${type}_${id}"><i class="ti ti-player-play fs-2"></i></a>`
      : `<a href="javascript:toggle_rss_pause('${type}','${id}','P')" title="暂停订阅"
          class="text-white" id="pause_btn_${type}_${id}"><i class="ti ti-player-pause fs-2"></i></a>`;

    return `
      <div class="card p-0 glass-card">
        <div class="card-body media-box" style="background-image: url(${dataAttr.image});">
          <div class="ribbon ribbon-top ribbon-left ribbon-bookmark ${voteBg}">${voteText}</div>
          <div class="right-top-box rss-card-actions">
            ${pauseBtn}
            <a href="javascript:remove_rss_click('${dataAttr.name}','${dataAttr.year}', '${type}','${id}', 'movie_rss')" title="取消订阅" class="text-danger"><i class="ti ti-x fs-2"></i></a>
          </div>
          <div class="row align-items-stretch media-content card-text rss-card-clickable"
            title="点击编辑订阅" onclick="show_edit_rss_media_modal('${id}', '${typeName}')">
            <div class="col-auto p-0 d-flex align-items-center">
              <img src="${dataAttr.poster}" class="rounded" alt="" style="max-width: 80px;">
            </div>
            <div class="col" style="display: flex; flex-direction: column; overflow: hidden;">
              <h3 class="card-title mb-1 border-bottom rss-card-title">
                <a href='javascript:navmenu("media_detail?type=${type}&id=${dataAttr.tmdbid}")'
                  class="text-reset card-text" title="${title}" onclick="event.stopPropagation();">
                  ${title}
                </a>
              </h3>
              <div class="card-body text-center border-bottom" style="padding: 0;flex-grow: 1;">
                <div class="${badges ? 'text-muted pt-1 mt-1' : 'text-muted'}">
                  <small>
                    ${badges}
                  </small>
                </div>
                <div class="text-muted site-badge-list">
                  <small>
                    ${siteBadges}
                  </small>
                </div>
              </div>
              <div class="space-between-box rss-card-toolbar" onclick="event.stopPropagation();">
                <div>
                  ${statusInfo}
                </div>
              </div>
            </div>
          </div>
          <div class="rss-card-actions rss-card-actions-bottom" onclick="event.stopPropagation();">
            <a href="javascript:search_mediainfo_media('${dataAttr.tmdbid}','${dataAttr.name}', '${typeName}')"
              title="搜索" class="text-azure" id="search_btn_${type}_${id}"><i class="ti ti-search fs-2"></i></a>
            <a href="javascript:refresh_rss_media('${type}', '${id}', 'movie_rss')" title="刷新"
              class="text-azure" id="refresh_btn_${type}_${id}"><i class="ti ti-refresh fs-2"></i></a>
          </div>
        </div>
        ${progressBar}
      </div>
    `;
  }

  // 生成标签
  function generateBadges(attr, data) {
    const badges = [];

    if (attr.over_edition) {
      badges.push('<span class="badge me-1 mb-1" title="已开启洗版">洗版</span>');
    }

    if (attr.download_setting && attr.download_setting !== -1 && data.DownloadSettings[attr.download_setting.toString()]) {
      badges.push(`<span class="badge me-1 mb-1" title="下载设置">${data.DownloadSettings[attr.download_setting.toString()].name}</span>`);
    }

    if (attr.filter_restype) {
      badges.push(`<span class="badge bg-yellow me-1 mb-1" title="质量">${attr.filter_restype}</span>`);
    }

    if (attr.filter_pix) {
      badges.push(`<span class="badge bg-yellow me-1 mb-1" title="分辨率">${attr.filter_pix}</span>`);
    }

    if (attr.filter_team) {
      badges.push(`<span class="badge bg-cyan me-1 mb-1 text-wrap text-start" title="制作组/字幕组">${attr.filter_team}</span>`);
    }

    if (attr.filter_rule && data.RuleGroups[attr.filter_rule.toString()]) {
      badges.push(`<span class="badge bg-orange me-1 mb-1" title="过滤规则">${data.RuleGroups[attr.filter_rule.toString()]}</span>`);
    }

    if (attr.filter_include) {
      badges.push(`<span class="badge bg-green me-1 mb-1 text-wrap text-start" title="包含">${attr.filter_include}</span>`);
    }

    if (attr.filter_exclude) {
      badges.push(`<span class="badge bg-red me-1 mb-1 text-wrap text-start text-decoration-line-through" title="排除">${attr.filter_exclude}</span>`);
    }

    return badges.join('');
  }

  // 生成站点标签
  function generateSiteBadges(attr) {
    const badges = [];

    if (attr.rss_sites && Array.isArray(attr.rss_sites)) {
      attr.rss_sites.forEach(site => {
        badges.push(`<span class="badge badge-outline text-azure me-1 mb-1" title="订阅站点">${site}</span>`);
      });
    }

    if (attr.search_sites && Array.isArray(attr.search_sites)) {
      attr.search_sites.forEach(site => {
        badges.push(`<span class="badge badge-outline text-teal me-1 mb-1" title="搜索站点">${site}</span>`);
      });
    }

    return badges.join('');
  }

  // 生成状态信息
  function generateStatusInfo(attr) {
    switch (attr.state) {
      case 'D':
        return '<span class="badge bg-gray"></span> 队列中';
      case 'S':
        return '<span class="badge bg-orange"></span> 正在搜索';
      case 'P':
        let paused = '<span class="badge bg-yellow"></span> 已暂停';
        if ((attr.total || -1) > 0) {
          const completed = (attr.total || -1) - (attr.lack || -1);
          paused += ` (${completed}/${attr.total || -1})`;
        }
        return paused;
      case 'R':
        let status = '<span class="badge bg-green"></span> 正在订阅';
        if ((attr.total || -1) > 0) {
          const completed = (attr.total || -1) - (attr.lack || -1);
          status += ` (${completed}/${attr.total || -1})`;
        }
        return status;
      default:
        return '<span class="badge bg-blue"></span> 完成';
    }
  }

  // 生成进度条（仅TV）
  function generateProgressBar(attr) {

    if ((attr.total || -1) <= 0) return '';

    const completed = (attr.total || -1) - (attr.lack || -1);
    const percentage = (completed * 100) / (attr.total || -1);

    return `
      <div class="card-progress" style="overflow: hidden">
        <div class="progress-bar bg-green"
          style="width:${percentage}%"
          role="progressbar"
          aria-valuenow="${percentage}"
          aria-valuemin="0" aria-valuemax="100">
        </div>
      </div>
    `;
  }

  // 询问取消订阅
  function remove_rss_click(title, year, media_type, rssid, page, tmdb_id, remove_func) {
    show_ask_modal("是否确定将 " + title + " 从订阅中移除？", function () {
      remove_rss_media(title, year, media_type, rssid, page, tmdb_id, remove_func);
    });
  }

  // 暂停/恢复订阅
  function toggle_rss_pause(type, rssid, state) {
    const is_pause = state === 'P';
    const tip = is_pause
      ? '是否暂停该订阅？暂停后不再主动搜索站点，但仍会处理RSS识别到的资源。'
      : '是否恢复该订阅的搜索？';
    show_ask_modal(tip, function () {
      axios_post_do("set_rss_state", { type: type, rssid: rssid, state: state }, function (ret) {
        if (ret.code === 0) {
          loadPageData();
        } else {
          show_fail_modal(ret.msg || "操作失败");
        }
      });
    });
  }

  // 弹出订阅类型选择框（电影/电视剧）
  function show_rss_type_select_modal(callback) {

    let $modal = $("#modal-rss-type-select");
    if ($modal.length === 0) {
      $("body").append(`
        <div class="modal modal-blur fade" id="modal-rss-type-select" tabindex="-1" role="dialog" aria-hidden="true">
          <div class="modal-dialog modal-sm modal-dialog-centered" role="document">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">选择订阅类型</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
              </div>
              <div class="modal-body">
                <div class="d-grid gap-2">
                  <a href="javascript:rss_type_selected('MOV')" class="btn btn-purple">电影</a>
                  <a href="javascript:rss_type_selected('TV')" class="btn btn-blue">电视剧</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `);
      $modal = $("#modal-rss-type-select");
    }

    $modal.data("callback", callback);
    raise_modal_above_others($modal);
    $modal.modal("show");
  }

  // 类型选择完成
  function rss_type_selected(mtype) {
    const $modal = $("#modal-rss-type-select");
    const callback = $modal.data("callback");
    $modal.removeData("callback");
    // 等当前弹窗完全关闭后再打开下一个，避免遮罩层冲突
    $modal.one("hidden.bs.modal", function () {
      callback && callback(mtype);
    });
    $modal.modal("hide");
  }

  // 新增订阅：先选择类型
  function show_add_rss_type_select_modal() {
    show_rss_type_select_modal(function (mtype) {
      show_add_rss_media_modal(mtype);
    });
  }

  // 默认设置：先选择类型
  function show_default_rss_setting_type_select_modal() {
    show_rss_type_select_modal(function (mtype) {
      show_default_rss_setting_modal(mtype);
    });
  }

  // 显示默认订阅设置页面
  function show_default_rss_setting_modal(mtype) {
    $("#default_rss_setting_title").text("默认设置-" + (mtype === "TV" ? "电视剧" : "电影"));
    // 站点列表渲染完成后才能回显已保存的配置
    const sites_ready = Promise.all([
      refresh_rsssites_select("default_rss_setting_rss_sites_group", "default_rss_sites", false),
      refresh_searchsites_select("default_rss_setting_search_sites_group", "default_search_sites", false)
    ]).catch(function () {
      // 站点列表加载失败时不影响弹窗使用
    });
    refresh_filter_select("default_rss_setting_rule", false);
    refresh_downloadsetting_select("default_rss_setting_download_setting", false)

    // 查询已保存配置
    axios_post_do("get_default_rss_setting", { mtype: mtype }, function (ret) {
      if (ret.code === 0 && ret.data) {
        $("#default_rss_setting_restype").val(ret.data.restype);
        $("#default_rss_setting_pix").val(ret.data.pix);
        $("#default_rss_setting_team").val(ret.data.team);
        $("#default_rss_setting_rule").val(ret.data.rule);
        $("#default_rss_setting_include").val(ret.data.include);
        $("#default_rss_setting_exclude").val(ret.data.exclude);
        $("#default_rss_setting_download_setting").val(ret.data.download_setting);
        $("#default_rss_setting_over_edition").val(ret.data.over_edition);
        // 空列表表示不启用该渠道
        sites_ready.then(function () {
          select_SelectPart(ret.data.rss_sites || [], 'default_rss_sites');
          select_SelectPart(ret.data.search_sites || [], 'default_search_sites');
        });
      } else {
        $("#default_rss_setting_restype").val('');
        $("#default_rss_setting_pix").val('');
        $("#default_rss_setting_team").val('');
        $("#default_rss_setting_rule").val('');
        $("#default_rss_setting_include").val('');
        $("#default_rss_setting_exclude").val('');
        $("#default_rss_setting_download_setting").val('');
        $("#default_rss_setting_over_edition").val('0');
        select_SelectALL(false, "default_rss_sites");
        select_SelectALL(false, "default_search_sites");
      }
      $("#default_rss_setting_mtype").val(mtype);
      $("#modal-default-rss-setting").modal('show');
    });
  }

  // 保存默认订阅设置
  function save_default_rss_setting() {
    const rss_sites = select_GetSelectedVAL("default_rss_sites");
    const search_sites = select_GetSelectedVAL("default_search_sites");
    // 订阅站点、搜索站点：允许任意一个为空，但不能同时为空
    if (rss_sites.length === 0 && search_sites.length === 0) {
      show_fail_modal("订阅站点和搜索站点不能同时为空，请至少选择一项！");
      return;
    }
    const sites = {
      rss_sites: rss_sites,
      search_sites: search_sites
    };
    const common = input_select_GetVal("modal-default-rss-setting", "default_rss_setting_");
    const key = common.mtype === "MOV" ? "DefaultRssSettingMOV" : "DefaultRssSettingTV";
    const value = { ...common, ...sites };
    $("#modal-default-rss-setting").modal("hide");
    axios_post_do("set_system_config", { key: key, value: value }, function (ret) {
      if (ret.code === 0) {
        show_success_modal("设置订阅默认配置成功！");
      } else {
        show_fail_modal(`设置订阅默认配置失败：${ret.msg}！`);
      }
    });
  }

</script>
