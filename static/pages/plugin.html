<div class="container-xl">
  <!-- Page title -->
  <div class="page-header d-print-none mt-2">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title">插件</h2>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          <a href="javascript:show_plugin_apps_modal()" class="btn btn-primary d-none d-sm-inline-flex">
            <i class="ti ti-apps fs-3"></i>
            插件市场
          </a>
          <a href="javascript:show_plugin_apps_modal()" class="btn btn-primary d-sm-none mbtn-action">
            <i class="ti ti-apps fs-3"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page-body" id="plugins-container" style="display: none;">
  <!-- 组件展示 -->
  <div class="container-xl">
    <div class="d-grid gap-3 grid-info-card plugin-grid" id="plugins-list">
    </div>
  </div>
</div>
<empty-content id="no-plugins" title="没有插件" text='没有安装任何插件，请前往插件市场选择安装。' style="display: none;"></empty-content>

<!-- 弹窗 -->

<div class="page-body">
  <!-- 插件部分 -->
  <div id="plugin-modals-container">
    <!-- 插件模态框将通过JavaScript动态生成 -->
  </div>
  <!-- 插件市场容器 -->
  <div class="modal modal-blur fade" id="modal-plugin-apps" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable" id="modal-plugin-apps-content" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">插件市场</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="min-height:800px;">
          <div class="d-grid gap-3 plugin-grid" id="plugin_apps_content" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- 插件运行历史 -->
  <div class="modal modal-blur fade" id="modal-plugin-history" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="plugin_history_title">运行历史</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="plugin_history_content"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- 插件详情页 -->
  <div class="modal modal-blur fade" id="modal-plugin-page" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="plugin_page_title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="plugin_page_content">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="modal_plugin_page_btn">确定</button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- 插件业务函数 -->
<script type="text/javascript">
  // 插件卡片文本清理
  function escape_plugin_text(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function strip_plugin_emoji(value) {
    return String(value == null ? '' : value)
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function escape_plugin_js_arg(value) {
    return String(value == null ? '' : value)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r?\n/g, ' ')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;');
  }

  // 插件主题色：十六进制直接使用，bg-* 映射为对应的 Tabler 颜色变量
  function get_plugin_color(color) {
    if (!color) return '';
    if (color.startsWith('#')) return color;
    if (color.startsWith('bg-')) return `var(--tblr-${color.slice(3)})`;
    return '';
  }

  // 插件图标背景样式（支持网络地址与内置图标名）
  function get_plugin_icon_style(icon) {
    if (!icon) return '';
    let url = icon.startsWith('http') ? icon : `../static/img/plugins/${icon.split('/').pop()}`;
    return `style="background-image: url('${escape_plugin_text(url)}')"`;
  }

  // 保存配置
  function save_config_plugin(id, prefix, func) {
    let params = input_select_GetVal(`modal-plugin-${id}`, prefix);
    let selectgroup_config = {};
    $(`#modal-plugin-${id} div[class^='form-selectgroup']`).each(function () {
      let name = $(this).attr("id");
      if ($(this).data('type') == 'radio') {
        selectgroup_config[name.replace(prefix, "")] = select_GetSelectedRadioVAL(name);
      } else {
        selectgroup_config[name.replace(prefix, "")] = select_GetSelectedVAL(name);
      }
    })
    params = { ...params, ...selectgroup_config }
    axios_post("/sys/update_plugin_config", { plugin: id, config: params }, func);
  }

  //保存配置、关闭和刷新页面
  function save_plugin_config(plugin, prefix) {
    $("#modal-plugin-" + plugin).modal('hide');
    save_config_plugin(plugin, prefix, function (ret) {
      window_history_refresh();
    });
  }

  // 显示插件市场页面
  function show_plugin_apps_modal() {
    $("#modal-plugin-apps").modal('show');
    load_plugin_apps_modal();
  }

  // 生成插件市场单个卡片
  function build_plugin_app_card(pid, plugin) {
    var pluginColor = get_plugin_color(plugin.color);
    var iconStyle = get_plugin_icon_style(plugin.icon);
    var pluginName = escape_plugin_text(plugin.name);
    var pluginDesc = escape_plugin_text(strip_plugin_emoji(plugin.desc));
    var pluginInitials = escape_plugin_text((plugin.name || '').substring(0, 2));
    var author = escape_plugin_text(plugin.author);
    var authorHtml = plugin.author_url
      ? `<a href="${escape_plugin_text(plugin.author_url)}" target="_blank" rel="noopener">${author}</a>`
      : `<span>${author}</span>`;
    var actionHtml = plugin.installed
      ? `<a href="javascript:uninstall_plugin('${pid}', '${escape_plugin_js_arg(plugin.name)}')" class="plugin-action is-danger" title="卸载">
           <i class="ti ti-trash"></i><span>卸载</span>
         </a>`
      : `<a href="javascript:install_plugin('${pid}', '${escape_plugin_js_arg(plugin.name)}')" class="plugin-action is-primary" title="安装">
           <i class="ti ti-cloud-download"></i><span>安装</span>
         </a>`;

    return `
      <div class="plugin-card" ${pluginColor ? `style="--plugin-color: ${pluginColor}"` : ''}>
        <div class="plugin-card-body">
          <span class="plugin-icon" ${iconStyle}>${!plugin.icon ? pluginInitials : ''}</span>
          <div class="plugin-copy">
            <div class="plugin-name">${pluginName}</div>
            <div class="plugin-desc">${pluginDesc}</div>
          </div>
        </div>
        <div class="plugin-card-footer">
          <span class="plugin-author">作者：${authorHtml}</span>
          ${actionHtml}
        </div>
      </div>
      `;
  }

  // 绘制插件市场列表（未安装在上、已安装在下，中间用分界线隔开）
  function draw_plugin_table(plugin_query_result, is_external) {

    if (!plugin_query_result.result) {
      return;
    }

    var uninstalledHtml = '';
    var installedHtml = '';
    for (let pid in plugin_query_result.result) {
      let plugin = plugin_query_result.result[pid];
      if (plugin.installed) {
        installedHtml += build_plugin_app_card(pid, plugin);
      } else {
        uninstalledHtml += build_plugin_app_card(pid, plugin);
      }
    }

    var content = uninstalledHtml;
    if (uninstalledHtml && installedHtml) {
      content += `<div class="plugin-divider" role="separator">已安装</div>`;
    }
    content += installedHtml;

    $("#plugin_apps_content").html(content).show();
  }

  // 加载官方插件
  function load_plugin_apps_modal() {
    $("#plugin_apps_content").empty();
    // 获取插件列表
    axios_post_do("get_plugin_apps", {}, function (ret) {
      draw_plugin_table(ret, false)
    });
  }

  // 显示插件页面
  function show_plugin_extra_page(id) {
    axios_post_do("get_plugin_page", { id: id }, function (ret) {
      if (ret.code === 0) {
        $("#modal-plugin-" + id).modal('hide');
        $("#plugin_page_title").text(ret.title);
        $("#plugin_page_content").html(ret.content);
        if (ret.func) {
          $("#modal_plugin_page_btn").unbind('click').click(function () {
            eval(ret.func);
          });
        } else {
          $("#modal_plugin_page_btn").unbind('click').click(function () {
            $('#modal-plugin-page').modal('hide');
          });
        }
        $("#modal-plugin-page").modal('show');
      }
    });
  }

  // 安装插件
  function install_plugin(id, name) {
    axios_post("/sys/install_plugin", { id: id }, function (ret) {
      $("#modal-plugin-apps").modal('hide');
      if (ret.code === 0) {
        show_success_modal(name + " 插件安装成功！", () => window_history_refresh());
      } else {
        show_fail_modal(ret.msg, function () {
          $("#modal-plugin-apps").modal('show');
        });
      }
    });
  }

  // 卸载插件
  function uninstall_plugin(id, name) {
    axios_post("/sys/uninstall_plugin", { id: id }, function (ret) {
      $("#modal-plugin-apps").modal('hide');
      if (ret.code === 0) {
        show_warning_modal(name + " 插件已卸载！", function () {
          window_history_refresh();
        });
      } else {
        show_fail_modal(ret.msg, function () {
          $("#modal-plugin-apps").modal('show');
        });
      }
    });
  }

  // 询问取消订阅
  function uninstall_plugin_click(pluginId, pluginName) {
    show_ask_modal("是否确定将 " + pluginName + " 插件卸载？", function () {
      uninstall_plugin(pluginId, pluginName);
    });
  }

  // 绘制插件运行历史
  function render_plugin_history(history, pageData, pluginId, pluginName) {
    if (!history.length) {
      $("#plugin_history_content").html(`
        <div class="empty">
          <p class="empty-title">暂无运行记录</p>
          <p class="empty-subtitle text-muted">该插件还没有写入过运行历史数据。</p>
        </div>`);
      return;
    }

    var html = '<div class="plugin-history-list">';
    history.forEach(function (item) {
      var key = escape_plugin_text(item.Key);
      var text = escape_plugin_text(item.Text || '');
      html += `
        <div class="plugin-history-item">
          <div class="plugin-history-head">
            <span class="plugin-history-date">${escape_plugin_text(item.Date)}</span>
            <span class="plugin-history-key" title="${key}">${key}</span>
          </div>
          <pre class="plugin-history-value">${text}</pre>
        </div>`;
    });
    html += '</div>';

    var totalCount = pageData.TotalCount || 0;
    var currentPage = pageData.CurrentPage || 1;
    var totalPage = pageData.TotalPage || 1;
    var jsPluginId = escape_plugin_js_arg(pluginId);
    var jsPluginName = escape_plugin_js_arg(pluginName);
    if (totalPage > 1) {
      html += `
        <div class="plugin-history-pager">
          <button type="button" class="btn btn-sm btn-outline-secondary"${currentPage <= 1 ? ' disabled' : ''}
                  onclick="load_plugin_history('${jsPluginId}', '${jsPluginName}', ${currentPage - 1})">上一页</button>
          <span>第 ${currentPage} / ${totalPage} 页 · 共 ${totalCount} 条</span>
          <button type="button" class="btn btn-sm btn-outline-secondary"${currentPage >= totalPage ? ' disabled' : ''}
                  onclick="load_plugin_history('${jsPluginId}', '${jsPluginName}', ${currentPage + 1})">下一页</button>
        </div>`;
    } else if (totalCount) {
      html += `<div class="plugin-history-pager"><span>共 ${totalCount} 条</span></div>`;
    }

    $("#plugin_history_content").html(html);
  }

  // 分页加载插件运行历史
  function load_plugin_history(pluginId, pluginName, page) {
    page = page || 1;
    $("#plugin_history_content").html('<div class="text-muted">加载中...</div>');
    axios_post('/data/plugin_history', { plugin_id: pluginId, page: page }, function (ret) {
      if (ret.code !== 0) {
        $("#plugin_history_content").html(
          `<div class="text-danger">${escape_plugin_text(ret.msg || '获取运行历史失败')}</div>`
        );
        return;
      }
      var history = (ret.data && ret.data.History) || [];
      render_plugin_history(history, ret.data || {}, pluginId, pluginName);
      $("#modal-plugin-history .modal-body").scrollTop(0);
    }, false);
  }

  // 显示插件运行历史
  function show_plugin_history(pluginId, pluginName) {
    $("#plugin_history_title").text((pluginName || '插件') + ' · 运行历史');
    $("#modal-plugin-history").modal('show');
    load_plugin_history(pluginId, pluginName, 1);
  }

  // 绘制已安装插件列表
  function drawPluginList(pluginList) {

    if (!pluginList || !Object.keys(pluginList).length) {
      $('#plugins-container').hide();
      $('#no-plugins').show();
      return;
    }

    $('#no-plugins').hide();
    $('#plugins-container').show();

    $("#plugin-modals-container").empty();

    $.each(pluginList, function (pluginId, pluginAttr) {

      var icon = get_plugin_icon_style(pluginAttr.icon);
      var pluginColor = get_plugin_color(pluginAttr.color);
      var isOn = !!pluginAttr.state;
      var pluginName = escape_plugin_text(pluginAttr.name);
      var pluginDesc = escape_plugin_text(strip_plugin_emoji(pluginAttr.desc));
      var pluginInitials = escape_plugin_text((pluginAttr.name || '').substring(0, 2));
      // card：图标 + 名称/简介，底部为状态与卸载操作
      var html = `
      <div class="plugin-card" ${pluginColor ? `style="--plugin-color: ${pluginColor}"` : ''}>
        <div class="plugin-card-body is-clickable" role="button" tabindex="0"
             data-bs-toggle="modal" data-bs-target="#modal-plugin-${pluginId}"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
          <span class="plugin-icon" ${icon}>${!pluginAttr.icon ? pluginInitials : ''}</span>
          <div class="plugin-copy">
            <div class="plugin-name">${pluginName}</div>
            <div class="plugin-desc">${pluginDesc}</div>
          </div>
        </div>
        <div class="plugin-card-footer">
          <span class="plugin-state${isOn ? '' : ' is-off'}"><span class="plugin-state-dot"></span>${isOn ? '运行中' : '已停用'}</span>
          <div class="plugin-actions">
            <a href="javascript:show_plugin_history('${pluginId}', '${escape_plugin_js_arg(pluginAttr.name)}')" class="plugin-action" title="运行历史">
              <i class="ti ti-history"></i>
            </a>
            <a href="javascript:uninstall_plugin_click('${pluginId}', '${escape_plugin_js_arg(pluginAttr.name)}')" class="plugin-action is-danger" title="卸载">
              <i class="ti ti-trash"></i>
            </a>
          </div>
        </div>
      </div>
      `;

      $('#plugins-list').append(html);
      
      // 模态框
      const pluginsModal = `
        <plugin-modal
          plugin-id="${pluginId}"
          plugin-name="${pluginAttr.name}"
          plugin-config='${JSON.stringify(pluginAttr.config)}'
          plugin-fields='${JSON.stringify(pluginAttr.fields)}'
          plugin-prefix="${pluginAttr.prefix}"
          plugin-page="${pluginAttr.page}">
        </plugin-modal>
      `;
      $("#plugin-modals-container").append(pluginsModal);

      // 插件函数
      if (pluginAttr.script) {
        try {
          var script = document.createElement('script');
          script.textContent = pluginAttr.script;
          $("#page-content").append(script)
        } catch (e) {
          console.error('插件脚本执行错误:', pid, e);
        }
      }

    });

  }

  // 页面加载完成后初始化
  $(document).ready(function () {

    axios_post('/data/plugin', {}, function (response) {
      if (response.code === 0 && response.data) {
        // 绘制插件表格
        drawPluginList(response.data.Plugins);
      }
    });

  });

</script>
