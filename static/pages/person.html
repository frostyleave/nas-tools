<div class="container-xl">
  <div class="page-header d-print-none">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title" id="person_title"></h2>
        <div class="text-muted mt-1" id="person_subtitle"></div>
      </div>
    </div>
  </div>
</div>

<div class="page-body">
  <div class="container-xl" id="person_list"></div>
</div>

<script type="text/javascript">
  $(document).ready(function () {

    const PLACEHOLDER_COUNT = 20;

    function fixedText(value) {
      return (!value || value === 'None' || value === 'null' || value === 'undefined')
        ? ''
        : value;
    }

    // 获取URL参数
    const [, queryString] = window.location.hash.split("?");
    const urlParams = new URLSearchParams(queryString || "");

    const title = fixedText(urlParams.get('title'));
    const subtitle = fixedText(urlParams.get('subtitle'));
    const tmdbId = fixedText(urlParams.get('tmdbid'));
    const mediaType = 'ALL';
    const keyword = fixedText(urlParams.get('keyword'));

    const titleEl = document.getElementById('person_title');
    const subtitleEl = document.getElementById('person_subtitle');
    const listEl = document.getElementById('person_list');

    titleEl.textContent = title;
    subtitleEl.textContent = subtitle;

    function setAttr(el, name, value) {
      if (value !== undefined && value !== null) {
        el.setAttribute(name, value);
      }
    }

    function renderPlaceholders() {
      const grid = document.createElement('div');
      grid.className = 'd-grid gap-3 grid-media-card';

      for (let i = 0; i < PLACEHOLDER_COUNT; i++) {
        const card = document.createElement('person-card');
        card.setAttribute('lazy', '1');
        grid.appendChild(card);
      }

      listEl.replaceChildren(grid);
    }

    function renderCards(items) {
      const grid = document.createElement('div');
      grid.className = 'd-grid gap-3 grid-media-card';

      items.forEach((item) => {
        const card = document.createElement('person-card');
        setAttr(card, 'person-id', item.id);
        setAttr(card, 'person-image', item.image);
        setAttr(card, 'person-name', item.name);
        setAttr(card, 'person-role', item.role);

        card.addEventListener('click', () => {
          navmenu('recommend?type=' + mediaType +
            '&subtype=person&personid=' + item.id +
            '&title=参演作品&subtitle=' + item.name);
        });

        grid.appendChild(card);
      });

      listEl.replaceChildren(grid);
    }

    function renderEmpty() {
      const empty = document.createElement('div');
      empty.className = 'container-xl d-flex flex-column justify-content-center';
      empty.innerHTML = `
        <div class="empty">
          <div class="empty-img">
            <img src="./static/img/posting_photo.svg" height="128" alt="">
          </div>
          <p class="empty-title">没有数据。</p>
        </div>`;
      listEl.replaceChildren(empty);
    }

    renderPlaceholders();

    const page = window.history.state && window.history.state.page;
    const cacheKey = 'media_person' + mediaType;

    axios_post_do('media_person', {
      tmdbid: tmdbId,
      type: mediaType,
      keyword: keyword
    }, (ret) => {
      // 页面已经切换，丢弃结果
      if (page !== (window.history.state && window.history.state.page)) {
        return;
      }

      // 保留原组件写入 history.state.extra 的缓存行为
      const extra = window.history.state && window.history.state.extra;
      if (extra) {
        extra[cacheKey] = ret;
      }

      if (ret.code === 0) {
        const items = Array.isArray(ret.data) ? ret.data : [];
        if (items.length) {
          renderCards(items);
        } else {
          renderEmpty();
        }
      }
    });
  });
</script>
