<script src="/static/libs/modules/dom-to-image.min.js"></script>
<script src="/static/libs/modules/echarts.min.js"></script>
<script src="/static/libs/modules/numeral.min.js"></script>
<script src="/static/libs/modules/moment.min.js"></script>
<script src="/static/libs/modules/FileSaver.min.js"></script>

<script type="text/javascript">

  var chart_history = null;
  var current_date = ""

  $('#site-activity').off('shown.bs.modal').on('shown.bs.modal', function (e) {
    
    let site_name = $('#site-activity-name').val();

    // 单站点历史数据图
    if (typeof (chart_site_activity) != 'undefined') {
      chart_site_activity.dispose();
    }
    chart_site_activity = echarts.init($('#site-activity-chart')[0], null, {
      height: 350
    });
    chart_site_activity.showLoading();

    axios_post_do("get_site_activity", { "name": site_name }, function (ret) {
      chart_site_activity.hideLoading();
      if (ret.code == 0) {
        const colors = ['#206bc4', '#d63939', '#2fb344', '#d6b344'];
        let options_site_activity = {
          animation: false,
          color: colors,
          dataset: {
            source: ret.dataset
          },
          dataZoom: [
            {
              type: 'inside'
            },
            {
              type: 'slider'
            }
          ],
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'cross'
            },
            formatter: function (params) {
              let html = params[0].axisValueLabel + '<br>';
              for (let i = 0; i < params.length; i++) {
                let value = params[i].data[params[i].encode.y[0]];
                if (params[i].seriesIndex == 3) {
                  html += params[i].marker + params[i].seriesName + ': ' + value + ' (' + numeral(value).format('0.0 a') + ')' + '<br>';
                } else {
                  html += params[i].marker + params[i].seriesName + ': ' + numeral(value).format('0.0 ib') + '<br>';
                }
              }
              return html;
            }
          },
          grid: {
            right: '30%'
          },
          toolbox: {
            feature: {
              restore: { show: true },
            }
          },
          legend: {
            data: ['总上传量', '总下载量', '做种体积', '积分']
          },
          xAxis: [
            {
              type: 'time',
              axisTick: {
                alignWithLabel: true
              },
            }
          ],
          yAxis: [
            {
              type: 'value',
              name: '总上传量',
              position: 'left',
              alignTicks: true,
              axisLine: {
                show: true,
                lineStyle: {
                  color: colors[0]
                }
              },
              axisLabel: {
                formatter: function (value, index) {
                  return numeral(value).format('0.0 ib');
                }
              },
              axisPointer: {
                label: {
                  formatter: function (params) {
                    return numeral(params.value).format('0.0 ib');
                  }
                }
              }
            },
            {
              type: 'value',
              name: '总下载量',
              position: 'right',
              alignTicks: true,
              offset: 70,
              axisLine: {
                show: true,
                lineStyle: {
                  color: colors[1]
                }
              },
              axisLabel: {
                formatter: function (value, index) {
                  return numeral(value).format('0.0 ib');
                }
              },
              axisPointer: {
                label: {
                  formatter: function (params) {
                    return numeral(params.value).format('0.0 ib');
                  }
                }
              }
            },
            {
              type: 'value',
              name: '做种体积',
              position: 'right',
              alignTicks: true,
              axisLine: {
                show: true,
                lineStyle: {
                  color: colors[2]
                }
              },
              axisLabel: {
                formatter: function (value, index) {
                  return numeral(value).format('0.0 ib');
                }
              },
              axisPointer: {
                label: {
                  formatter: function (params) {
                    return numeral(params.value).format('0.0 ib');
                  }
                }
              }
            },
            {
              type: 'value',
              name: '积分',
              position: 'right',
              alignTicks: true,
              offset: 140,
              axisLine: {
                show: true,
                lineStyle: {
                  color: colors[3]
                }
              },
              axisLabel: {
                formatter: function (value, index) {
                  return numeral(value).format('0.0 a')
                }
              },
              axisPointer: {
                label: {
                  formatter: function (params) {
                    return numeral(params.value).format('0.0 a');
                  }
                }
              }
            },
          ],
          series: [
            {
              name: '总上传量',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              yAxisIndex: '0',
              encode: {
                x: "time",
                y: "upload"
              }
            },
            {
              name: '总下载量',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              yAxisIndex: '1',
              encode: {
                x: "time",
                y: "download"
              }
            },
            {
              name: '做种体积',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              yAxisIndex: '2',
              encode: {
                x: "time",
                y: "seeding_size"
              }
            },
            {
              name: '积分',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              yAxisIndex: '3',
              encode: {
                x: "time",
                y: "bonus"
              }
            }
          ]
        };
        chart_site_activity.setOption(options_site_activity);
      } else {
        show_fail_modal(`${site_name} 查询失败：${ret.msg}！`);
      }
    }
    );
  });

  function show_site_activity(site_name) {
    $('#site-activity-title').text(site_name + " 历史数据");
    $('#site-activity-name').val(site_name);
    $('#site-activity').modal("show");
  }

  // 今日上传饼图
  if (typeof (pie_ul) != 'undefined') {
    pie_ul.dispose();
  }

  pie_ul = echarts.init($('#chart-recent-upload')[0], null, {
    height: 300
  });

  // 今日下载饼图
  if (typeof (pie_dl) != 'undefined') {
    pie_dl.dispose();
  }
    
  pie_dl = echarts.init($('#chart-recent-download')[0], null, {
    height: 300
  });

  // 响应大小调整
  window.onresize = function () {
    if (pie_ul) {
      pie_ul.resize();
    }
    if (pie_dl) {
      pie_dl.resize();
    }
  };

  function switch_date(date_offset) {
    const current = moment(current_date)
    const next = current.add(date_offset, 'days')
    if (next.isAfter(moment(), 'day')) {
      return; // 如果加完日期大于今天，返回
    }
    show_site_history_day(next.format('YYYY-MM-DD'), 1);
  }

  // 饼图配置：数据不足两项时不绘制图形，只显示提示文字
  function statistics_pie_option(source, value_field, empty_text) {
    if (source.length <= 1) {
      return {
        title: {
          text: empty_text,
          left: 'center',
          top: 'middle',
          textStyle: { color: '#9e9e9e', fontSize: 14, fontWeight: 'normal' }
        }
      };
    }
    return {
      tooltip: {
        trigger: 'item', valueFormatter: value => numeral(value).format('0.0 ib')
      },
      legend: {
        type: 'scroll',
        orient: 'vertical',
        right: 0,
        top: 'middle',
        itemWidth: 12,
        itemHeight: 12,
        itemGap: 6,
        pageIconSize: 10,
        textStyle: { fontSize: 12 }
      },
      dataset: {
        source: source
      },
      series: [
        {
          type: 'pie',
          radius: '58%',
          center: ['32%', '50%'],
          encode: {
            itemName: 'site',
            value: value_field
          },
          label: { show: false }
        }
      ]
    };
  }

  // 获取某一日的数据
  function show_site_history_day(end_day, days) {

    current_date = end_day;
    axios_post_do("get_site_history", { "days": days, "end_day": end_day }, function (ret) {

      if (ret.code == 0) {
        const upload_source = ret.dataset.filter(item => item[1] > 0 || item[1] === 'upload');
        pie_ul.clear();
        pie_ul.setOption(statistics_pie_option(upload_source, 'upload', '无上传量'));
        pie_ul.resize();

        const download_source = ret.dataset.filter(item => item[2] > 0 || item[2] === 'download');
        pie_dl.clear();
        pie_dl.setOption(statistics_pie_option(download_source, 'download', '无下载量'));
        pie_dl.resize();

        let up_all = 0;
        let dl_all = 0;
        let len = ret.dataset.length;
        for (let i = 1; i < len; i++) {
          up_all += ret.dataset[i][1];
        }
        for (let i = 1; i < len; i++) {
          dl_all += ret.dataset[i][2];
        }
        up_all = numeral(up_all).format('0.0 ib')
        dl_all = numeral(dl_all).format('0.0 ib')

        let dateStr = end_day;
        if (moment().isSame(moment(end_day, 'YYYY-MM-DD'), 'd')) {
          dateStr = "今日"
        }
        $('#chart-recent-upload-title').text(dateStr + "上传量 共" + up_all)
        $('#chart-recent-download-title').text(dateStr + "下载量 共" + dl_all)
      } else {
        show_fail_modal(`历史数据 查询失败：${ret.msg}！`);
      }
    }
    );
  }

  function show_history() {
            
    // 展示面板
    $('#modal-indexer-history').modal("show");

    // 在 modal 完全显示后再初始化图表
    $('#modal-indexer-history').one('shown.bs.modal', function () {
      if (chart_history) {
        chart_history.dispose();
      }

      chart_history = echarts.init(document.getElementById("chart-site-history"), null, {
        height: 350
      });

      // 当前一周数据
      $('#btn-history-one-week').trigger('click');
    });

  }
  
  function show_site_history(obj, days) {

    $('.btn-site-history').removeClass('active');
    $(obj).addClass('active');

    // 请求数据
    axios_post_do("get_site_history", { "days": days }, function (ret) {

      if (ret.code == 0) {

        let rotate = ret.dataset.length > 15 ? 40 : 0;
        let option_history = {
          animation: false,
          grid: {
            left: 0,
            top: 50,
            right: 20,
            bottom: "0%",
            containLabel: true
          },
          color: ['#206bc4', '#d63939'],
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'shadow'
            }, valueFormatter: value => numeral(value).format('0.0 ib')
          },
          dataset: {
            source: ret.dataset
          },
          toolbox: {
            show: true,
            orient: 'vertical',
            left: 'right',
            top: 'center'
          },
          xAxis: [
            {
              type: 'category',
              axisTick: { show: false },
              axisLabel: {
                rotate: rotate,
              },
            }
          ],
          yAxis: [
            {
              type: 'value',
              axisLabel: {
                formatter: function (value, index) {
                  return numeral(value).format('0.0 ib');
                }
              }
            }
          ],
          series: [
            { name: "上传量", type: 'bar' }, { name: "下载量", type: 'bar' }
          ]
        };

        chart_history.setOption(option_history);
        chart_history.resize()

        // 总量计算
        let up_all = 0;
        let dl_all = 0;
        let len = ret.dataset.length;
        for (let i = 1; i < len; i++) {
          up_all += ret.dataset[i][1];
        }
        for (let i = 1; i < len; i++) {
          dl_all += ret.dataset[i][2];
        }
        up_all = numeral(up_all).format('0.0 ib')
        dl_all = numeral(dl_all).format('0.0 ib')
        $('#site-history-title').text("历史数据 (上传量 " + up_all + " / 下载量 " + dl_all + ")")
      } else {
        show_fail_modal(`历史数据 查询失败：${ret.msg}！`);
      }
    }
    );
  }

  // 图片数值格式化
  function statistics_pic_file_size(value) {
    return numeral(Number(value || 0)).format('0.00 ib');
  }

  function statistics_pic_bonus(value) {
    const num = Number(value || 0);
    if (num >= 1000000) {
      return `${(num / 1000000).toFixed(2)} M`;
    }
    if (num >= 1000) {
      return `${(num / 1000).toFixed(2)} K`;
    }
    return num.toFixed(2);
  }

  function statistics_pic_ratio(value) {
    const num = Number(value || 0);
    return (num === 0 || num > 10000) ? '∞' : num.toFixed(2);
  }

  // 站点之最排序取值：分享率显示为 ∞ 的数据不参与排名
  function statistics_pic_record_value(key, value) {
    const num = Number(value || 0);
    if (key === 'ratio' && (num === 0 || num > 10000)) {
      return Infinity;
    }
    return num;
  }

  // 缺少用户名/加入时间的站点信息不完整，不绘制到分享图中
  function statistics_pic_site_available(item) {
    return Boolean(item && item.username && item.join_at);
  }

  // 可绘制到分享图的站点
  function statistics_pic_drawable_sites() {
    return (site_statistics_data || []).filter(item => statistics_pic_site_available(item));
  }

  // 分享图设置的默认值：Favicon 模糊度 37.5%（对应 PT-depiler 的 3px），默认展示站点时间线
  const STATISTICS_PIC_DEFAULT_SETTING = { favicon_blur: 37.5, show_timeline: true };

  // 读取本地保存的分享图设置
  function statistics_pic_get_setting() {
    const setting = { ...STATISTICS_PIC_DEFAULT_SETTING };
    try {
      const saved = JSON.parse(localStorage.getItem("StatisticsPicSetting") || "{}");
      if (Array.isArray(saved.sites)) {
        setting.sites = saved.sites;
      }
      if (saved.favicon_blur !== undefined && saved.favicon_blur !== null && isFinite(Number(saved.favicon_blur))) {
        setting.favicon_blur = Math.min(100, Math.max(0, Number(saved.favicon_blur)));
      }
      if (typeof saved.show_timeline === 'boolean') {
        setting.show_timeline = saved.show_timeline;
      }
    } catch (e) {
      // 本地存储损坏时按默认值处理
    }
    return setting;
  }

  // 进度条取值（百分比），面板未打开时回落到本地保存的设置
  function statistics_pic_favicon_blur_percent() {
    const input = document.getElementById('statistics-pic-favicon-blur');
    if (input && isFinite(Number(input.value))) {
      return Math.min(100, Math.max(0, Number(input.value)));
    }
    return statistics_pic_get_setting().favicon_blur;
  }

  function statistics_pic_show_timeline() {
    const input = document.getElementById('statistics-pic-show-timeline');
    if (input) {
      return input.checked;
    }
    return statistics_pic_get_setting().show_timeline;
  }

  // 百分比换算成模糊半径，100% 对应 PT-depiler 滑块的最大值 8px
  function statistics_pic_favicon_blur_px() {
    return statistics_pic_favicon_blur_percent() / 100 * 8;
  }

  function statistics_pic_format_blur(percent) {
    return `${Number(percent).toFixed(1).replace(/\.0$/, '')}%`;
  }

  // 拖动进度条：更新数值并重绘预览
  let statistics_pic_blur_timer = null;
  function statistics_pic_favicon_blur_input(input) {
    $('#statistics-pic-favicon-blur-value').text(statistics_pic_format_blur(input.value));
    clearTimeout(statistics_pic_blur_timer);
    statistics_pic_blur_timer = setTimeout(render_statistics_picture, 80);
  }

  // 显示分享图片面板
  function show_statistics_picture_modal() {
    const sites = statistics_pic_drawable_sites();
    if (!sites.length) {
      show_fail_modal('没有可生成分享图的站点数据');
      return;
    }

    // 恢复上次保存的设置，未保存过则默认全选站点
    const setting = statistics_pic_get_setting();
    const saved_sites = setting.sites || [];
    const select_all = !saved_sites.length;

    $('#statistics-pic-favicon-blur').val(setting.favicon_blur);
    $('#statistics-pic-favicon-blur-value').text(statistics_pic_format_blur(setting.favicon_blur));
    $('#statistics-pic-show-timeline').prop('checked', setting.show_timeline);

    $('#statistics-pic-sites').html(sites.map(item => `
      <label class="form-selectgroup-item">
        <input type="checkbox" name="statistics_pic_sites" value="${item.site}"
          class="form-selectgroup-input" onchange="render_statistics_picture()"
          ${(select_all || saved_sites.includes(item.site)) ? 'checked' : ''}>
        <span class="form-selectgroup-label">${item.site}</span>
      </label>
    `).join(''));

    $('#modal-statistics-pic-setting').modal('show');
    render_statistics_picture();
  }

  // 根据选中的站点重新生成预览图
  function render_statistics_picture() {
    const drawable_sites = statistics_pic_drawable_sites();
    const selected = select_GetSelectedVAL("statistics_pic_sites");
    const sites = drawable_sites.filter(item => selected.includes(item.site));
    $('#statistics-pic-poster').html(build_statistics_picture_html(sites));
    setTimeout(fit_statistics_picture_preview, 0);
  }

  // 预览图按面板宽度等比缩放
  function fit_statistics_picture_preview() {
    const preview = document.getElementById('statistics-pic-preview');
    const holder = document.getElementById('statistics-pic-scale');
    const poster = document.getElementById('statistics-pic-poster');
    if (!preview || !holder || !poster) {
      return;
    }

    const poster_width = poster.offsetWidth;
    const poster_height = poster.offsetHeight;
    if (!poster_width || !poster_height) {
      return;
    }

    const scale = Math.min(1, Math.max((preview.clientWidth - 24) / poster_width, 0));
    poster.style.transform = `scale(${scale})`;
    holder.style.width = `${Math.round(poster_width * scale)}px`;
    holder.style.height = `${Math.round(poster_height * scale)}px`;
  }

  // MDI 图标路径（与 PT-depiler 同款字体取出，内联 SVG 保证导出时不依赖字体）
  const STATISTICS_PIC_ICON_PATH = {

  };

  // 生成 MDI 图标 SVG：字形坐标 512 单位、y 轴向上，这里统一转成 426×426 的正向坐标
  function statistics_pic_icon(name, size, fill) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 426 426" style="display: block;"><g transform="translate(-43,405) scale(1,-1)"><path fill="${fill}" d="${STATISTICS_PIC_ICON_PATH[name]}"/></g></svg>`;
  }

  // 站点未收录图标时显示的问号（MDI help，内联 SVG，导出时不依赖图标字体）
  const STATISTICS_PIC_HELP_PATH = "M10,19H13V22H10V19M12,2C17.35,2.22 19.68,7.62 16.5,11.67C15.67,12.67 14.33,13.33 13.67,14.17C13,15 13,16 13,17H10C10,15.33 10,13.92 10.67,12.92C11.33,11.92 12.67,11.33 13.5,10.67C15.92,8.43 15.32,5.26 12,5A3,3 0 0,0 9,8H6A6,6 0 0,1 12,2Z";

  function statistics_pic_help_icon(size, color) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="display: block;"><path fill="${color}" d="${STATISTICS_PIC_HELP_PATH}"/></svg>`;
  }

  // 生成分享图片主体 HTML
  function build_statistics_picture_html(sites) {
    // 缺少用户名/加入时间的站点信息不完整，不绘制到分享图中
    sites = sites.filter(item => statistics_pic_site_available(item));
    if (!sites.length) {
      return `<div style="width: 1300px; height: 300px; box-sizing: border-box; background: #455a64; display: flex; align-items: center; justify-content: center; color: #9fb0ba; font-size: 32px;">请选择要展示的站点</div>`;
    }

    const ordered_sites = [...sites].sort((a, b) => String(a.join_at || '').localeCompare(String(b.join_at || '')));
    const total_upload = sites.reduce((sum, item) => sum + Number(item.upload || 0), 0);
    const total_download = sites.reduce((sum, item) => sum + Number(item.download || 0), 0);
    const total_seeding = sites.reduce((sum, item) => sum + Number(item.seeding || 0), 0);
    const total_seeding_size = sites.reduce((sum, item) => sum + Number(item.seeding_size || 0), 0);
    const total_bonus = sites.reduce((sum, item) => sum + Number(item.bonus || 0), 0);
    const total_ratio = total_download > 0 ? total_upload / total_download : 0;
    const join_times = sites
      .map(item => item.join_at ? new Date(String(item.join_at).replace(/-/g, '/')).getTime() : NaN)
      .filter(time => !isNaN(time));
    // 与 PT-depiler 一致：P龄按 365 天折合一年
    const age_years = join_times.length
      ? (Date.now() - Math.min(...join_times)) / (365 * 24 * 60 * 60 * 1000)
      : null;
    const username = (sites.find(item => item.username) || {}).username || 'NAStool';
    const timestamp = moment().format('YYYY-MM-DD HH:mm:ss');
    // 与 PT-depiler 一致：拉丁字符使用 Arial（Konva 默认字体），中文回退到系统字体
    const font_family = "Arial, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif";
    const line_color = '#3d4f58';
    // 站点图标模糊度与时间线开关
    const favicon_blur = statistics_pic_favicon_blur_px();
    const favicon_filter = favicon_blur > 0 ? `filter: blur(${favicon_blur.toFixed(2)}px);` : '';
    const show_timeline = statistics_pic_show_timeline();

    // 站点明细字段：PT-depiler 为 uploaded/downloaded/seeding/seedingSize/bonus/bonusPerHour/ratio，
    // NAStool 没有时魔值（bonusPerHour）数据
    const site_fields = [
      { label: '上传量', format: site => statistics_pic_file_size(site.upload) },
      { label: '下载量', format: site => statistics_pic_file_size(site.download) },
      { label: '做种数', format: site => String(Number(site.seeding || 0)) },
      { label: '做种量', format: site => statistics_pic_file_size(site.seeding_size) },
      { label: '积分值', format: site => statistics_pic_bonus(site.bonus) },
      { label: '分享率', format: site => statistics_pic_ratio(site.ratio) }
    ];
    // 行高 408，站点块/日期块的垂直位置与 PT-depiler 的公式一致
    const per_site_height = 408;
    const stats_top = per_site_height / 2 - 20 - 20 * site_fields.length;
    const date_top = per_site_height / 2 - 40;

    const summary = [
      ['总站点数', String(sites.length)],
      ['总上传量', statistics_pic_file_size(total_upload)],
      ['总下载量', statistics_pic_file_size(total_download)],
      ['总做种数', String(total_seeding)],
      ['总做种量', statistics_pic_file_size(total_seeding_size)],
      ['总积分值', statistics_pic_bonus(total_bonus)],
      ['总分享率', statistics_pic_ratio(total_ratio)],
      ['P龄', age_years === null ? '-' : `≈ ${age_years.toFixed(2)} 年`]
    ].map(([label, value]) => `
      <div style="height: 60px; line-height: 60px; font-size: 48px; color: #ffffff; white-space: nowrap;">${label}: ${value}</div>`).join('');

    const record_metrics = [
      { key: 'upload', format: statistics_pic_file_size },
      { key: 'download', format: statistics_pic_file_size },
      { key: 'seeding', format: value => String(Number(value || 0)) },
      { key: 'seeding_size', format: statistics_pic_file_size },
      { key: 'bonus', format: statistics_pic_bonus },
      { key: 'ratio', format: statistics_pic_ratio }
    ];
    const trophy_cell = gray => `
      <div style="height: 60px; display: flex; align-items: center;">
        <div style="width: 40px; height: 40px; margin-left: 4px; margin-top: 4px; display: flex;">${statistics_pic_icon('trophy', 40, gray ? '#B4B4B4' : '#C9B037')}</div>
      </div>`;
    const empty_cell = '<div style="height: 60px;"></div>';
    const record_cell = (site, format, metric_key) => {
      const icon = site.favicon
        ? `<img src="${site.favicon}" style="width: 40px; height: 40px; object-fit: contain; display: block; ${favicon_filter}">`
        : statistics_pic_help_icon(40, '#9e9e9e');
      return `
        <div style="height: 60px; display: flex; align-items: center;">
          <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">${icon}</div>
          <div style="margin-left: 20px; font-size: 48px; color: #ffffff; white-space: nowrap;">${format(site[metric_key])}</div>
        </div>`;
    };
    const records = trophy_cell(false) + trophy_cell(true) + record_metrics.map(metric => {
      const ranked = [...sites]
        // 与 PT-depiler 一致：只有信息完整、分享率非 ∞ 且数值大于 0 的站点参与排名
        .filter(item => item.join_at && item.username)
        .map(item => ({ item, value: statistics_pic_record_value(metric.key, item[metric.key]) }))
        .filter(({ value }) => Number.isFinite(value) && value > 0)
        .sort((a, b) => b.value - a.value);
      return (ranked[0] ? record_cell(ranked[0].item, metric.format, metric.key) : empty_cell) +
        (ranked[1] ? record_cell(ranked[1].item, metric.format, metric.key) : empty_cell);
    }).join('');

    const timeline = ordered_sites.map((site, index) => {
      const stats_on_left = index % 2 === 0;
      // 与 PT-depiler 一致：最后一个站点行不画分隔线
      const is_last_site = index === ordered_sites.length - 1;
      const favicon = site.favicon
        ? `<img src="${site.favicon}" style="width: 76px; height: 76px; object-fit: contain; display: block; ${favicon_filter}">`
        : statistics_pic_help_icon(60, '#9e9e9e');
      const stats_block = `
        <div style="width: 100%;">
          <div style="font-size: 48px; font-weight: 700; line-height: 1; color: #ffffff;">${site.site}</div>
          <div style="margin-top: 8px; font-size: 32px; line-height: 40px; color: #ffffff; white-space: nowrap;">
            ${site_fields.map(field => `${field.label}: ${field.format(site)}`).join('<br>')}
          </div>
        </div>`;
      const date_block = `
        <div style="width: 100%;">
          <div style="font-size: 48px; font-weight: 700; line-height: 1; color: #ffffff; white-space: nowrap;">${(site.join_at || '').substring(0, 10) || '-'}</div>
          <div style="margin-top: 8px; width: 490px; font-size: 32px; line-height: 1.25; color: #ffffff; word-break: break-all;">${site.username || '-'} &lt;${site.user_level || '-'}&gt;</div>
        </div>`;
      const underline = `<div style="position: absolute; left: 20px; right: 53px; bottom: 2px; height: 4px; background: ${line_color};"></div>`;
      const right_underline = `<div style="position: absolute; left: 72px; right: 0; bottom: 2px; height: 4px; background: ${line_color};"></div>`;

      return `
        <div style="display: grid; grid-template-columns: 562px 96px 1fr; height: ${per_site_height}px;">
          <div style="position: relative; display: flex; align-items: flex-start; padding-top: ${stats_on_left ? stats_top : date_top}px; padding-left: 20px; padding-right: 53px;">
            ${stats_on_left ? stats_block : date_block}
            ${stats_on_left && !is_last_site ? underline : ''}
          </div>
          <div style="display: flex; align-items: center; justify-content: center;">
            <div style="position: relative; z-index: 1; width: 96px; height: 96px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden;">${favicon}</div>
          </div>
          <div style="position: relative; display: flex; align-items: flex-start; padding-top: ${stats_on_left ? date_top : stats_top}px; padding-left: 72px;">
            ${stats_on_left ? date_block : stats_block}
            ${!stats_on_left && !is_last_site ? right_underline : ''}
          </div>
        </div>`;
    }).join('');

    return `
      <div style="width: 1300px; box-sizing: border-box; background: #455a64; padding: 45px 40px 26px; color: #ffffff; font-family: ${font_family};">
        <div style="position: relative; display: flex; align-items: flex-start; height: 54px; padding-left: 5px;">
          <div style="flex-shrink: 0;">${statistics_pic_icon('account', 54, '#ffffff')}</div>
          <div style="margin-left: 31px; margin-top: 3px; font-size: 52px; font-weight: 400; color: #ffffff;">${username}</div>
          <div style="position: absolute; top: -7px; right: 0; font-size: 24px; line-height: 1; color: #9e9e9e;">${timestamp}</div>
        </div>
        <div style="position: relative; margin-top: 35px;">
          <div style="display: flex;">
            <div style="width: 558px; flex-shrink: 0;">${summary}</div>
            <div style="flex: 1; margin-left: 42px;">
              <div style="display: grid; grid-template-columns: 340px 1fr;">${records}</div>
            </div>
          </div>
          <div style="position: absolute; left: 558px; top: 16px; bottom: 3px; width: 4px; background: ${line_color};"></div>
          ${show_timeline ? `<div style="height: 4px; background: ${line_color}; margin-top: 26px;"></div>` : ''}
        </div>
        ${show_timeline ? `
        <div style="margin-top: 20px; font-size: 48px; font-weight: 700; line-height: 1.2; text-align: center;"><span style="position: relative; top: 4px;">... 这些年走过的路 ...</span></div>
        <div style="position: relative;">
          <div style="position: absolute; left: 608px; top: 20px; bottom: -20px; width: 4px; background: ${line_color};"></div>
          ${timeline}
        </div>` : ''}
        <div style="height: 4px; background: ${line_color}; margin-top: ${show_timeline ? 88 : 12}px;"></div>
        <div style="margin-top: 16px; text-align: right; font-size: 24px; color: #b5b5b5;">Created By NAStool at ${timestamp}</div>
      </div>`;
  }

  // 图标加载失败时的占位图：与缺失图标的问号保持一致
  // 注意必须是 base64：dom-to-image 取占位图逗号后的内容直接拼成 "data:<mime>;base64,"
  const STATISTICS_PIC_IMAGE_PLACEHOLDER = 'data:image/svg+xml;base64,' + btoa(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#9e9e9e" d="${STATISTICS_PIC_HELP_PATH}"/></svg>`
  );

  // 保存当前预览为图片
  function save_statistics_picture() {
    const poster = document.getElementById('statistics-pic-poster');
    if (!poster) {
      return;
    }
    const selected = select_GetSelectedVAL("statistics_pic_sites");
    if (!selected.length) {
      show_fail_modal('请先选择要展示的站点');
      return;
    }
    localStorage.setItem("StatisticsPicSetting", JSON.stringify({
      sites: selected,
      favicon_blur: statistics_pic_favicon_blur_percent(),
      show_timeline: statistics_pic_show_timeline()
    }));

    const width = poster.offsetWidth;
    const height = poster.offsetHeight;

    domtoimage.toBlob(poster, {
      bgcolor: '#455a64',
      width: width,
      height: height,
      style: { transform: 'none', position: 'static', top: 'auto', left: 'auto' },
      // 图标地址取不到时用占位图代替，避免整张图片生成失败或留下空洞
      imagePlaceholder: STATISTICS_PIC_IMAGE_PLACEHOLDER
    }).then(function (blob) {
      saveAs(blob, `nastool_statistics_${moment().format('YYYYMMDDHHmmss')}.png`);
    }).catch(function () {
      show_fail_modal('生成图片失败');
    });
  }

  function ask_refresh_statistics(site_name) {

    var target = site_name ? '是否立即刷新【'+ site_name +'】站点数据?' : "是否立即刷新所有站点的数据?"

    show_ask_modal(target, function () {
      axios_post_do("refresh_pt_statistics", {'site':site_name}, function (ret) {
        if (ret.code === 0) {
          show_success_modal(ret.msg);
        } else {
          show_fail_modal(`任务提交失败：${ret.msg}!`);
        }
      });

    });

  }

</script>



<script type="text/javascript">

  // 分站点信息是否已加载（切换视图时按需加载）
  var sites_statistics_loaded = false;
  // 分站点原始数据与排序状态
  var site_statistics_data = [];
  var site_statistics_sort_by = 'upload';
  var site_statistics_sort_order = 'desc';

  // 加载总量信息
  function load_total_statistics() {
    axios_post('/data/statistics', {}, function (response) {
      if (response.code !== 0 || !response.data || !response.data.SiteCount) {
        $('#total-statistics-content').hide();
        $('#no-statistics').show();
        return;
      }

      const data = response.data;
      $('#no-statistics').hide();
      $('#total-statistics-content').show();

      $('#total-upload').text(formatFileSize(data.TotalUpload || 0));
      $('#total-download').text(formatFileSize(data.TotalDownload || 0));
      $('#total-seeding').text(data.TotalSeeding || 0);
      $('#total-seeding-size').text(formatFileSize(data.TotalSeedingSize || 0));
    });
  }

  // 加载分站点信息
  function load_site_statistics(force) {
    if (sites_statistics_loaded && !force) {
      return;
    }

    const list = $('#site-statistics-list');
    list.html('<div class="text-center text-muted py-4">加载中...</div>');

    axios_post('/data/site_statistics', {}, function (response) {
      if (response.code !== 0 || !response.data) {
        list.html('<div class="text-center text-danger py-4">加载失败</div>');
        return;
      }

      site_statistics_data = response.data.SiteUserStatistics || [];
      sites_statistics_loaded = true;
      $('#site-count').text(site_statistics_data.length);
      render_site_statistics();
    });
  }

  // 排序取值：分享率显示为 ∞ 的情况（0 或大于 10000）按无穷大参与排序，与展示保持一致
  function site_statistics_sort_value(item) {
    if (site_statistics_sort_by === 'ratio') {
      return (item.ratio == 0.0 || item.ratio > 10000) ? Infinity : Number(item.ratio || 0);
    }
    return Number(item[site_statistics_sort_by] || 0);
  }

  // 按当前排序条件渲染分站点信息
  function render_site_statistics() {
    const list = $('#site-statistics-list');

    if (!site_statistics_data.length) {
      list.html('<div class="text-center text-muted py-4">没有站点数据</div>');
      $('#share-btn-container').hide();
      return;
    }

    update_site_statistics_sort_header();

    const desc = site_statistics_sort_order === 'desc';
    const statistics = [...site_statistics_data].sort((a, b) => {
      let result;
      if (site_statistics_sort_by === 'site' || site_statistics_sort_by === 'join_at') {
        // 站点名称、加入时间为字符串，日期为 YYYY-MM-DD HH:MM:SS，可直接比较
        result = String(a[site_statistics_sort_by] || '').localeCompare(String(b[site_statistics_sort_by] || ''));
      } else {
        // 用比较而非相减，避免两个 ∞ 相减得到 NaN
        const av = site_statistics_sort_value(a);
        const bv = site_statistics_sort_value(b);
        result = av === bv ? 0 : (av > bv ? 1 : -1);
      }
      return desc ? -result : result;
    });

    $('#share-btn-container').show();
    list.html(statistics.map(render_site_statistics_row).join(''));
  }

  // 更新表头排序状态
  function update_site_statistics_sort_header() {
    $('.site-statistics-sort').each(function () {
      const active = $(this).data('sort') === site_statistics_sort_by;
      $(this).toggleClass('text-body', active).toggleClass('text-muted', !active).toggleClass('fw-semibold', active);
      const icon = $(this).find('i');
      icon.toggleClass('d-none', !active);
      if (active) {
        icon.attr('class', site_statistics_sort_order === 'desc' ? 'ti ti-arrow-down ms-1' : 'ti ti-arrow-up ms-1');
      }
    });
  }

  // 点击表头排序：同字段切换升降序，新字段默认降序（站点名称升序，加入时间最新在前）
  function sort_site_statistics(field) {
    if (site_statistics_sort_by === field) {
      site_statistics_sort_order = site_statistics_sort_order === 'desc' ? 'asc' : 'desc';
    } else {
      site_statistics_sort_by = field;
      site_statistics_sort_order = field === 'site' ? 'asc' : 'desc';
    }
    render_site_statistics();
  }

  // 站点图标：有图标显示图片，否则显示问号占位
  function site_favicon_html(item) {
    if (item.favicon) {
      return `<img src="${item.favicon}" class="site-favicon me-2" alt="" loading="lazy" onerror="this.style.display='none'">`;
    }
    return `<span class="site-favicon-placeholder me-2">${statistics_pic_help_icon(24, 'currentColor')}</span>`;
  }

  // 渲染单个站点（桌面端与表头对齐，移动端为独立信息块）
  function render_site_statistics_row(item) {
    const ratio = (item.ratio == 0.0 || item.ratio > 10000) ? '∞' : Number(item.ratio || 0).toFixed(2);
    const messageIcon = item.msg_unread > 0 ? '<i class="ti ti-message fs-2 text-muted ms-1" title="有未读消息"></i>' : '';
    const levelBadge = item.user_level ? `<span class="badge bg-primary-lt text-blue ms-1">${item.user_level}</span>` : '';
    const joinAt = item.join_at ? item.join_at.substring(0, 10) : '';
    const updateAt = item.update_at || '';
    const meta = [
      item.username || '-',
      joinAt ? `加入 ${joinAt}` : '',
      updateAt ? `更新 ${updateAt}` : ''
    ].filter(Boolean).join(' · ');
    const mobileMeta = [
      item.username || '-',
      updateAt ? `更新 ${updateAt}` : ''
    ].filter(Boolean).join(' · ');

    return `
      <!-- 桌面端 -->
      <div class="d-none d-lg-block list-group-item px-3 py-2">
        <div class="row g-2 align-items-center">
          <div class="col-lg-3">
            <div class="d-flex align-items-center">
              ${site_favicon_html(item)}
              <div class="flex-fill text-truncate">
                <div class="font-weight-medium text-truncate">
                  <a href="javascript:show_site_activity('${item.site}')" class="text-reset" title="查看历史数据">${item.site}</a>${levelBadge}${messageIcon}
                </div>
                <div class="text-muted small text-truncate">${meta}</div>
              </div>
              <a href="javascript:ask_refresh_statistics('${item.site}')" class="btn-icon ms-2" title="刷新站点数据">
                <i class="ti ti-refresh fs-2"></i>
              </a>
            </div>
          </div>
          <div class="col-lg-2">
            <div class="text-green font-weight-medium text-nowrap"><i class="ti ti-arrow-narrow-up"></i>${formatFileSize(item.upload || 0)}</div>
          </div>
          <div class="col-lg-2">
            <div class="text-red font-weight-medium text-nowrap"><i class="ti ti-arrow-narrow-down"></i>${formatFileSize(item.download || 0)}</div>
          </div>
          <div class="col-lg-1">
            <div class="font-weight-medium text-nowrap">${ratio}</div>
          </div>
          <div class="col-lg-1">
            <div class="font-weight-medium text-nowrap">${item.seeding || 0}</div>
          </div>
          <div class="col-lg-2">
            <div class="font-weight-medium text-nowrap">${formatFileSize(item.seeding_size || 0)}</div>
          </div>
          <div class="col-lg-1">
            <div class="font-weight-medium text-nowrap">${item.bonus || 0}</div>
          </div>
        </div>
      </div>
      <!-- 移动端 -->
      <div class="d-lg-none list-group-item px-3 py-3">
        <div class="d-flex align-items-center">
          ${site_favicon_html(item)}
          <div class="flex-fill text-truncate">
            <div class="font-weight-medium text-truncate">
              <a href="javascript:show_site_activity('${item.site}')" class="text-reset" title="查看历史数据">${item.site}</a>${levelBadge}${messageIcon}
            </div>
            <div class="text-muted small text-truncate">${mobileMeta}</div>
          </div>
          <a href="javascript:ask_refresh_statistics('${item.site}')" class="btn-icon ms-2" title="刷新站点数据">
            <i class="ti ti-refresh fs-2"></i>
          </a>
        </div>
        <div class="row g-2 mt-2">
          <div class="col-4">
            <div class="text-muted small">上传量</div>
            <div class="text-green font-weight-medium text-truncate">${formatFileSize(item.upload || 0)}</div>
          </div>
          <div class="col-4">
            <div class="text-muted small">下载量</div>
            <div class="text-red font-weight-medium text-truncate">${formatFileSize(item.download || 0)}</div>
          </div>
          <div class="col-4">
            <div class="text-muted small">分享率</div>
            <div class="font-weight-medium">${ratio}</div>
          </div>
          <div class="col-4">
            <div class="text-muted small">做种数</div>
            <div class="font-weight-medium">${item.seeding || 0}</div>
          </div>
          <div class="col-4">
            <div class="text-muted small">做种体积</div>
            <div class="font-weight-medium text-truncate">${formatFileSize(item.seeding_size || 0)}</div>
          </div>
          <div class="col-4">
            <div class="text-muted small">魔力值</div>
            <div class="font-weight-medium text-truncate">${item.bonus || 0}</div>
          </div>
        </div>
      </div>
    `;
  }

  // 显示站点统计设置（平铺站点名称，点击切换选中）
  function show_statistic_sites_modal() {
    const list = $('#statistic-sites-setting-list');
    list.html('<div class="text-muted py-3">加载中...</div>');
    $('#modal-statistic-sites').modal('show');

    axios_post_do('get_site_statistic_sites', {}, function (ret) {
      if (ret.code !== 0) {
        list.html(`<div class="text-danger py-3">${ret.msg || '加载失败'}</div>`);
        return;
      }

      const sites = ret.sites || [];
      if (!sites.length) {
        list.html('<div class="text-muted py-3">没有可配置的站点</div>');
        return;
      }

      list.html(sites.map(site => `
        <label class="form-selectgroup-item">
          <input type="checkbox" name="statistic_sites_setting" value="${site.id}"
            class="form-selectgroup-input" ${site.statistic ? 'checked' : ''}>
          <span class="form-selectgroup-label">${site.name}</span>
        </label>
      `).join(''));
    });
  }

  // 保存站点统计设置
  function save_statistic_sites_setting() {
    const settings = {};
    $('#statistic-sites-setting-list input[name="statistic_sites_setting"]').each(function () {
      settings[$(this).val()] = $(this).prop('checked');
    });

    axios_post_do('save_site_statistic_sites', { sites: settings }, function (ret) {
      if (ret.code !== 0) {
        show_fail_modal(ret.msg || '保存失败');
        return;
      }

      $('#modal-statistic-sites').modal('hide');
      show_success_modal(ret.msg || '保存成功');

      // 站点范围变化后重新加载统计数据
      sites_statistics_loaded = false;
      load_total_statistics();
      if ($('#statistics-sites-tab').prop('checked')) {
        load_site_statistics(true);
      }
    });
  }

  // 页面加载完成后，加载总量信息与今日饼图；分站点信息在切换视图时按需加载
  $(document).ready(function () {

    load_total_statistics();

    // 今日上传/下载饼图
    show_site_history_day(moment().format('YYYY-MM-DD'), 1);

    // 视图切换
    $('input[name="statistics-view"]').on('change', function () {
      const sites_view = $(this).val() === 'sites';

      $('#tab-statistics-total').toggle(!sites_view);
      $('#tab-statistics-sites').toggle(sites_view);
      $('#statistics-total-toolbar').toggleClass('d-none', sites_view);
      $('#statistics-sites-toolbar').toggleClass('d-none', !sites_view);

      if (sites_view) {
        load_site_statistics();
      } else {
        if (pie_ul) {
          pie_ul.resize();
        }
        if (pie_dl) {
          pie_dl.resize();
        }
      }
    });

    // 分享图片：弹窗显示完成后按面板宽度重新缩放预览
    $('#modal-statistics-pic-setting').on('shown.bs.modal', function () {
      fit_statistics_picture_preview();
    });
    $(window).on('resize', function () {
      if ($('#modal-statistics-pic-setting').hasClass('show')) {
        fit_statistics_picture_preview();
      }
    });
  });

</script>
