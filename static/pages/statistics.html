<script src="/static/libs/modules/dom-to-image.min.js"></script>
<script src="/static/libs/modules/echarts.min.js"></script>
<script src="/static/libs/modules/numeral.min.js"></script>
<script src="/static/libs/modules/moment.min.js"></script>
<script src="/static/libs/modules/FileSaver.min.js"></script>

<script type="text/javascript">

  var chart_history = null;
  var chart_site_activity = null;
  var current_date = "";
  var site_statistics_data = [];
  var site_statistics_sort_by = "upload";
  var site_statistics_sort_order = "desc";
  var site_statistics_columns = 0;
  var expanded_sites = new Set();

  // 图表配色跟随页面主题，强调色只用于上传与主指标
  function statistics_chart_palette() {
    const styles = getComputedStyle(document.body);
    const read = (name, fallback) => {
      const value = (styles.getPropertyValue(name) || '').trim();
      return value || fallback;
    };
    const dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    return {
      accent: read('--tblr-primary', '#696cff'),
      secondary: read('--tblr-secondary', '#616876'),
      muted: read('--tblr-secondary-color', '#9aa4b2'),
      axis: read(dark ? '--tblr-secondary' : '--tblr-body-color', '#475569'),
      hairline: read('--tblr-border-color', dark ? '#313c52' : '#e6e7e9'),
      grid: dark ? 'rgba(148, 163, 184, .14)' : 'rgba(148, 163, 184, .22)'
    };
  }

  function statistics_escape(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 文件大小统一保留两位小数，避免同一列里 5 TB 与 1.49 TB 混排
  function statistics_size_text(bytes) {
    const text = formatFileSize(bytes || 0);
    if (text === '0 B') {
      return text;
    }
    const parts = text.split(' ');
    return Number(parts[0]).toFixed(2) + ' ' + parts[1];
  }

  function statistics_count_text(value) {
    return Number(value || 0).toLocaleString('en-US');
  }

  function statistics_bonus_text(value) {
    const num = Number(value || 0);
    if (num >= 1000000) {
      return (num / 1000000).toFixed(2) + ' M';
    }
    if (num >= 1000) {
      return (num / 1000).toFixed(2) + ' K';
    }
    return String(Math.round(num));
  }

  function statistics_ratio_text(value) {
    const num = Number(value || 0);
    return num > 10000 ? '∞' : num.toFixed(2);
  }

  // 把更新时间写成“3 分钟前”，比一串完整时间更好扫读
  function statistics_relative_time(value) {
    if (!value) {
      return '';
    }
    const time = moment(String(value).replace(/-/g, '/'), 'YYYY/MM/DD HH:mm:ss');
    if (!time.isValid()) {
      return String(value);
    }
    const minutes = moment().diff(time, 'minutes');
    if (minutes < 1) {
      return '刚刚';
    }
    if (minutes < 60) {
      return minutes + ' 分钟前';
    }
    const hours = Math.floor(minutes / 60);
    if (hours < 24) {
      return hours + ' 小时前';
    }
    const days = Math.floor(hours / 24);
    if (days < 30) {
      return days + ' 天前';
    }
    return time.format('YYYY-MM-DD');
  }

  function statistics_ratio_value(upload, download) {
    if (Number(upload) + Number(download) === 0) {
      return '—';
    }
    return Number(download) > 0 ? (Number(upload) / Number(download)).toFixed(2) : '∞';
  }

  $('#site-activity').off('shown.bs.modal').on('shown.bs.modal', function () {
    let site_name = $('#site-activity-name').val();

    if (typeof (chart_site_activity) != 'undefined' && chart_site_activity) {
      chart_site_activity.dispose();
    }
    chart_site_activity = echarts.init($('#site-activity-chart')[0], null, {
      height: 350
    });
    chart_site_activity.showLoading();

    axios_post_do("get_site_activity", { "name": site_name }, function (ret) {
      chart_site_activity.hideLoading();
      if (ret.code == 0) {
        const palette = statistics_chart_palette();
        let options_site_activity = {
          animation: false,
          color: [palette.accent, palette.secondary, palette.muted, palette.axis],
          dataset: {
            source: ret.dataset
          },
          dataZoom: [
            { type: 'inside' },
            {
              type: 'slider',
              height: 18,
              bottom: 8,
              borderColor: palette.hairline,
              fillerColor: palette.grid,
              handleStyle: { color: palette.secondary },
              textStyle: { color: palette.secondary, fontSize: 10 },
              dataBackground: {
                lineStyle: { color: palette.grid },
                areaStyle: { color: palette.grid }
              }
            }
          ],
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'line',
              lineStyle: { color: palette.axis, width: 1 }
            },
            formatter: function (params) {
              let html = params[0].axisValueLabel + '<br>';
              for (let i = 0; i < params.length; i++) {
                let value = params[i].data[params[i].encode.y[0]];
                if (params[i].seriesIndex == 3) {
                  html += params[i].marker + params[i].seriesName + ': ' + value + ' (' + numeral(value).format('0.0 a') + ')' + '<br>';
                } else {
                  html += params[i].marker + params[i].seriesName + ': ' + numeral(value).format('0.0 ib') + '<br>';
                }
              }
              return html;
            }
          },
          grid: { left: 8, right: 8, top: 48, bottom: 44, containLabel: true },
          toolbox: {
            feature: { restore: { show: true } },
            iconStyle: { borderColor: palette.secondary }
          },
          legend: {
            data: ['总上传量', '总下载量', '做种体积', '积分'],
            top: 0,
            left: 0,
            itemWidth: 12,
            itemHeight: 8,
            itemGap: 16,
            textStyle: { color: palette.secondary, fontSize: 12 }
          },
          xAxis: [{
            type: 'time',
            axisTick: { show: false },
            axisLine: { lineStyle: { color: palette.hairline } },
            axisLabel: { color: palette.secondary, fontSize: 11 },
            splitLine: { show: false }
          }],
          yAxis: [
            {
              type: 'value',
              axisLine: { show: false },
              axisTick: { show: false },
              axisLabel: {
                color: palette.secondary,
                fontSize: 11,
                formatter: function (value) {
                  return numeral(value).format('0.0 ib');
                }
              },
              splitLine: { lineStyle: { color: palette.grid } },
              axisPointer: {
                label: {
                  formatter: function (params) {
                    return numeral(params.value).format('0.0 ib');
                  }
                }
              }
            },
            {
              type: 'value',
              position: 'right',
              axisLine: { show: false },
              axisTick: { show: false },
              axisLabel: {
                color: palette.secondary,
                fontSize: 11,
                formatter: function (value) {
                  return numeral(value).format('0.0 a');
                }
              },
              splitLine: { show: false },
              axisPointer: {
                label: {
                  formatter: function (params) {
                    return numeral(params.value).format('0.0 a');
                  }
                }
              }
            }
          ],
          series: [
            {
              name: '总上传量',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              lineStyle: { width: 2 },
              yAxisIndex: 0,
              encode: { x: "time", y: "upload" }
            },
            {
              name: '总下载量',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              lineStyle: { width: 1.5 },
              yAxisIndex: 0,
              encode: { x: "time", y: "download" }
            },
            {
              name: '做种体积',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              lineStyle: { width: 1.5, type: 'dashed' },
              yAxisIndex: 0,
              encode: { x: "time", y: "seeding_size" }
            },
            {
              name: '积分',
              type: 'line',
              large: true, smooth: true, symbol: 'none',
              lineStyle: { width: 1.5, type: 'dashed' },
              yAxisIndex: 1,
              encode: { x: "time", y: "bonus" }
            }
          ]
        };
        chart_site_activity.setOption(options_site_activity);
      } else {
        show_fail_modal(`${site_name} 查询失败：${ret.msg}`);
      }
    });
  });

  function show_site_activity(site_name) {
    $('#site-activity-title').text(site_name + " · 历史数据");
    $('#site-activity-name').val(site_name);
    $('#site-activity').modal("show");
  }

  // 窗口尺寸变化时重排图表（切换页面后自动解绑）
  $(window).off('resize.statistics_page').on('resize.statistics_page', function () {
    // 已切到其它页面时自动解绑，避免继续操作已移除的图表
    if (!document.getElementById('statistics-container')) {
      $(window).off('resize.statistics_page');
      return;
    }
    if (chart_history) {
      chart_history.resize();
    }
    if (typeof (chart_site_activity) != 'undefined' && chart_site_activity) {
      chart_site_activity.resize();
    }
    update_site_statistics_layout();
  });

  // 站点卡片按列独立排布：展开一张卡片只会挤开同列的下一张
  // 列数不写死断点，按实际可用宽度和卡片最小宽度计算
  function site_statistics_column_count() {
    const list = document.getElementById('site-statistics-list');
    if (!list) {
      return 1;
    }
    const gap = 14;
    const minCardWidth = 300;

    // 站点明细在「总量信息」TAB 下是隐藏的，此时取外层容器的实际内容宽度
    let width = list.clientWidth;
    if (!width) {
      const container = list.closest('.container-xl');
      if (container) {
        const style = window.getComputedStyle(container);
        width = container.clientWidth
          - parseFloat(style.paddingLeft)
          - parseFloat(style.paddingRight);
      }
    }
    if (!width) {
      width = window.innerWidth;
    }

    const per_row = Math.floor((width + gap) / (minCardWidth + gap));
    return Math.max(1, Math.min(4, per_row));
  }

  function update_site_statistics_layout() {
    const columns = site_statistics_column_count();
    if (columns === site_statistics_columns) {
      return;
    }
    site_statistics_columns = columns;
    if (site_statistics_data.length) {
      render_site_statistics();
    }
  }

  // 顶部视图切换：总量信息 / 站点明细
  function switch_statistics_view(view) {
    const show_sites = view === 'sites';
    document.querySelectorAll('#st-view-switch .lit-segment-option').forEach(function (tab) {
      const active = tab.dataset.view === view;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    document.getElementById('st-view-total').hidden = show_sites;
    document.getElementById('st-view-sites').hidden = !show_sites;
    // 两个 Tab 各自显示自己的工具按钮
    document.getElementById('st-total-actions').style.display = show_sites ? 'none' : '';
    document.getElementById('st-sites-actions').style.display = show_sites ? '' : 'none';
    if (show_sites) {
      load_site_statistics();
    }
  }

  function switch_date(date_offset) {
    const current = moment(current_date);
    const next = current.add(date_offset, 'days');
    if (next.isAfter(moment(), 'day')) {
      return;
    }
    show_site_history_day(next.format('YYYY-MM-DD'), 1);
  }

  function show_site_history_day(end_day, days) {
    current_date = end_day;
    axios_post_do("get_site_history", { "days": days, "end_day": end_day }, function (ret) {

      if (ret.code !== 0) {
        show_fail_modal(`历史数据 查询失败：${ret.msg}`);
        return;
      }

      const rows = ret.dataset.slice(1)
        .map(item => ({
          site: item[0],
          upload: Number(item[1]) || 0,
          download: Number(item[2]) || 0
        }))
        .filter(item => item.upload > 0 || item.download > 0)
        .sort((a, b) => b.upload - a.upload);

      const upload_total = rows.reduce((sum, item) => sum + item.upload, 0);
      const download_total = rows.reduce((sum, item) => sum + item.download, 0);
      const scale = Math.max(...rows.map(item => Math.max(item.upload, item.download)), 1);

      const is_today = moment().isSame(moment(end_day, 'YYYY-MM-DD'), 'day');
      $('#day-traffic-date').text(moment(end_day, 'YYYY-MM-DD').format('M月D日'));
      $('#day-next').prop('disabled', is_today);
      $('#day-upload-total').text(statistics_size_text(upload_total));
      $('#day-download-total').text(statistics_size_text(download_total));

      const list = document.getElementById('day-traffic-list');
      if (!rows.length) {
        list.innerHTML = '<div class="text-center text-secondary py-4">当日没有流量记录</div>';
        return;
      }

      list.innerHTML = rows.map(item => {
        const upload_width = (item.upload / scale * 100).toFixed(2);
        const download_width = (item.download / scale * 100).toFixed(2);
        return `
          <div class="d-flex align-items-center gap-3 px-3 py-2">
            <div class="col-3 text-truncate" title="${statistics_escape(item.site)}">${statistics_escape(item.site)}</div>
            <div class="col d-flex flex-column gap-1">
              <div class="progress progress-sm"><div class="progress-bar" data-target-width="${upload_width}%" style="width: 0"></div></div>
              <div class="progress progress-sm"><div class="progress-bar bg-secondary" data-target-width="${download_width}%" style="width: 0"></div></div>
            </div>
            <div class="col-auto text-end fs-5">
              <div>${statistics_size_text(item.upload)}</div>
              <div class="text-secondary">${statistics_size_text(item.download)}</div>
            </div>
          </div>`;
      }).join('');

      void list.offsetWidth;
      requestAnimationFrame(() => {
        list.querySelectorAll('.progress-bar[data-target-width]').forEach(bar => {
          bar.style.width = bar.getAttribute('data-target-width');
        });
      });
    });
  }

  function show_empty_state(kind) {
    $('#statistics-content').hide();
    $('#st-view-switch').hide();
    $('#st-sites-actions').hide();
    $('#statistics-empty').show();
    const title = document.getElementById('statistics-empty-title');
    const text = document.getElementById('statistics-empty-text');
    const primary = document.getElementById('statistics-empty-primary');
    if (kind === 'error') {
      title.textContent = '读取失败';
      text.textContent = '没能读到统计数据，请确认服务正常后重试。';
      primary.textContent = '重试';
      primary.setAttribute('onclick', 'reload_page_data()');
    } else {
      title.textContent = '还没有统计数据';
      text.textContent = '先在「统计站点」里勾选要统计的站点，再点「刷新数据」。';
      primary.textContent = '刷新数据';
      primary.setAttribute('onclick', 'ask_refresh_statistics()');
    }
  }

  function load_total_statistics() {
    axios_post('/data/statistics', {}, function (response) {
      if (!response || response.code !== 0 || !response.data) {
        show_empty_state('error');
        return;
      }

      const data = response.data;
      const total_statistics = {
        upload: Number(data.TotalUpload || 0),
        download: Number(data.TotalDownload || 0),
        seeding: Number(data.TotalSeeding || 0),
        seeding_size: Number(data.TotalSeedingSize || 0),
        site_count: Number(data.SiteCount || 0)
      };

      if (!total_statistics.site_count) {
        show_empty_state('empty');
        return;
      }

      const upload = total_statistics.upload;
      const download = total_statistics.download;
      const traffic_total = upload + download;

      $('#statistics-empty').hide();
      $('#st-view-switch').show();
      $('#statistics-content').show();
      $('#total-upload').text(statistics_size_text(upload));
      $('#total-download').text(statistics_size_text(download));
      const ratio_text = statistics_ratio_value(upload, download);
      $('#total-ratio').text(ratio_text);
      $('#total-ratio-mobile').text(ratio_text);
      $('#total-seeding').text(statistics_count_text(total_statistics.seeding));
      $('#total-seeding-size').text(statistics_size_text(total_statistics.seeding_size));
      $('#total-upload-bar').css('width', traffic_total > 0 ? (upload / traffic_total * 100).toFixed(2) + '%' : '0%');
      $('#total-download-bar').css('width', traffic_total > 0 ? (download / traffic_total * 100).toFixed(2) + '%' : '0%');
    });
  }

  function load_site_statistics() {
    const list = $('#site-statistics-list');
    list.html(`
      <div class="col-12 d-flex align-items-center gap-2 text-secondary py-4">
        <span class="spinner-border spinner-border-sm"></span>加载中…
      </div>`);

    axios_post('/data/site_statistics', {}, function (response) {
      if (!response || response.code !== 0 || !response.data) {
        list.html(`
          <div class="col-12 d-flex align-items-center gap-2 text-secondary py-4">
            <span>站点数据读取失败。</span>
            <button type="button" class="btn st-btn" onclick="load_site_statistics()">重试</button>
          </div>`);
        return;
      }

      site_statistics_data = response.data.SiteUserStatistics || [];
      render_site_statistics();
    });
  }

  function site_statistics_sort_value(item) {
    if (site_statistics_sort_by === 'ratio') {
      return item.ratio > 10000 ? Infinity : Number(item.ratio || 0);
    }
    return Number(item[site_statistics_sort_by] || 0);
  }

  function update_site_sort_order_button() {
    const button = document.getElementById('site-sort-order');
    if (!button) {
      return;
    }
    const desc = site_statistics_sort_order === 'desc';
    button.querySelector('i').className = desc ? 'ti ti-arrow-down' : 'ti ti-arrow-up';
    button.setAttribute('aria-label', desc ? '当前降序，点击改为升序' : '当前升序，点击改为降序');
    button.title = desc ? '当前降序，点击改为升序' : '当前升序，点击改为降序';
  }

  function apply_site_sort() {
    site_statistics_sort_by = $('#site-sort').val();
    site_statistics_sort_order = 'desc';
    render_site_statistics();
  }

  function toggle_site_sort_order() {
    site_statistics_sort_order = site_statistics_sort_order === 'desc' ? 'asc' : 'desc';
    render_site_statistics();
  }

  function render_site_statistics() {
    const list = $('#site-statistics-list');
    update_site_sort_order_button();

    if (!site_statistics_data.length) {
      list.html('<div class="col-12 text-center text-secondary py-4">没有站点数据</div>');
      $('#share-btn-container').hide();
      return;
    }

    $('#share-btn-container').show();

    const desc = site_statistics_sort_order === 'desc';
    const sorted = [...site_statistics_data].sort((a, b) => {
      const a_has = a.has_data !== false;
      const b_has = b.has_data !== false;
      if (a_has !== b_has) {
        return a_has ? -1 : 1;
      }
      let result;
      if (site_statistics_sort_by === 'update_at') {
        result = String(a.update_at || '').localeCompare(String(b.update_at || ''));
      } else {
        const av = site_statistics_sort_value(a);
        const bv = site_statistics_sort_value(b);
        result = av === bv ? 0 : (av > bv ? 1 : -1);
      }
      if (result === 0) {
        result = String(a.site || '').localeCompare(String(b.site || ''));
      }
      return desc ? -result : result;
    });

    site_statistics_columns = site_statistics_column_count();
    const columns = Array.from({ length: site_statistics_columns }, () => []);
    sorted.forEach((item, index) => {
      columns[index % site_statistics_columns].push(render_site_statistics_row(item, index));
    });
    list.html(columns.map(cards => `<div class="col d-flex flex-column gap-3">${cards.join('')}</div>`).join(''));
  }

  function site_favicon_html(item) {
    const image = item.favicon
      ? `<img src="${statistics_escape(item.favicon)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '';
    return `<span class="site-favicon"><i class="ti ti-world-www"></i>${image}</span>`;
  }

  function render_site_statistics_row(item, index) {
    const has_data = item.has_data !== false;
    const no_data = '<span class="text-secondary">—</span>';
    const ratio = has_data ? statistics_ratio_text(item.ratio) : no_data;
    // 站点名作为 JS 字符串嵌入单引号属性；先转义 & 和单引号，避免破坏属性
    const site_arg = JSON.stringify(String(item.site || ''))
      .replace(/&/g, '&amp;')
      .replace(/'/g, '&#39;');
    const detail_id = 'st-detail-' + index;
    const is_open = expanded_sites.has(String(item.site || ''));
    const message_icon = item.msg_unread > 0
      ? '<i class="ti ti-message text-primary flex-shrink-0" title="有未读消息"></i>'
      : '';
    const level = item.user_level
      ? `<span class="badge bg-secondary-lt rounded-pill flex-shrink-0">${statistics_escape(item.user_level)}</span>`
      : '';
    const join_at = item.join_at ? item.join_at.substring(0, 10) : '';
    const meta = has_data
      ? [statistics_escape(item.username || '—'), join_at ? '加入 ' + statistics_escape(join_at) : ''].filter(Boolean).join(' · ')
      : '还没有统计数据';
    const updated = has_data && item.update_at ? statistics_relative_time(item.update_at) : '';
    const name_link = `<a href='javascript:show_site_activity(${site_arg})' class="d-inline-flex align-items-center gap-1 mw-100 fw-semibold fs-4 text-reset" title="查看历史数据"><span class="text-truncate">${statistics_escape(item.site)}</span>${message_icon}</a>`;

    const foot = has_data
      ? `<div class="d-flex align-items-center justify-content-between gap-2 mt-3 pt-3 border-top">
          <span class="d-inline-flex align-items-center gap-1 fs-5 text-secondary"><i class="ti ti-clock"></i>${statistics_escape(updated || '等待更新')}</span>
          <button type="button" class="btn btn-link btn-sm p-0" data-bs-toggle="collapse" data-bs-target="#${detail_id}"
            aria-expanded="${is_open ? 'true' : 'false'}" aria-controls="${detail_id}"><span>${is_open ? '收起' : '全部指标'}</span><i class="ti ${is_open ? 'ti-chevron-down' : 'ti-chevron-right'}"></i></button>
        </div>`
      : `<div class="d-flex align-items-center justify-content-between gap-2 mt-3 pt-3 border-top">
          <span class="fs-5 text-secondary">这个站点还没有统计</span>
          <a href='javascript:ask_refresh_statistics(${site_arg})' class="btn btn-link btn-sm p-0">刷新本站</a>
        </div>`;

    const detail = has_data
      ? `<div class="collapse${is_open ? ' show' : ''}" id="${detail_id}" aria-hidden="${is_open ? 'false' : 'true'}">
          <div class="pt-3 mt-2 border-top">
            <div class="row row-cols-2 g-2 mx-0">
              <div><div class="text-secondary fs-5">做种数</div><div class="fs-4 fw-medium">${statistics_count_text(item.seeding)}</div></div>
              <div><div class="text-secondary fs-5">做种体积</div><div class="fs-4 fw-medium">${statistics_size_text(item.seeding_size)}</div></div>
              <div><div class="text-secondary fs-5">魔力值</div><div class="fs-4 fw-medium">${statistics_bonus_text(item.bonus)}</div></div>
              <div><div class="text-secondary fs-5">最近更新</div><div class="fs-4 fw-medium">${statistics_escape(item.update_at || '—')}</div></div>
              <div><div class="text-secondary fs-5">加入时间</div><div class="fs-4 fw-medium">${statistics_escape(join_at || '—')}</div></div>
              <div><div class="text-secondary fs-5">用户名</div><div class="fs-4 fw-medium">${statistics_escape(item.username || '—')}</div></div>
            </div>
            <div class="d-flex gap-3 mt-3">
              <a href='javascript:show_site_activity(${site_arg})' class="text-primary fw-medium fs-5 text-decoration-none"><i class="ti ti-history me-1"></i>历史数据</a>
              <a href='javascript:ask_refresh_statistics(${site_arg})' class="text-secondary fw-medium fs-5 text-decoration-none"><i class="ti ti-refresh me-1"></i>刷新本站</a>
            </div>
          </div>
        </div>`
      : '';

    return `
      <article class="card st-site-card rounded-4 shadow-none" data-site="${statistics_escape(item.site)}">
        <div class="card-body p-3">
          <div class="d-flex align-items-start gap-2">
            ${site_favicon_html(item)}
            <div class="flex-fill overflow-hidden">
              ${name_link}
              <div class="text-truncate text-secondary fs-5 mt-1">${meta}</div>
            </div>
            ${level}
          </div>
          <div class="d-flex gap-3 mt-3">
            <div class="flex-fill"><div class="text-secondary fs-5">上传</div><div class="fs-3 fw-semibold">${has_data ? statistics_size_text(item.upload) : no_data}</div></div>
            <div class="flex-fill"><div class="text-secondary fs-5">下载</div><div class="fs-3 fw-semibold">${has_data ? statistics_size_text(item.download) : no_data}</div></div>
            <div class="flex-fill"><div class="text-secondary fs-5">分享率</div><div class="fs-3 fw-semibold text-primary">${ratio}</div></div>
          </div>
          ${foot}
          ${detail}
        </div>
      </article>`;
  }

  // 展开状态跟随折叠动画同步，重新渲染后仍保持原来的展开项
  $(document).off('shown.bs.collapse.stcard hidden.bs.collapse.stcard', '.st-site-card .collapse')
    .on('shown.bs.collapse.stcard hidden.bs.collapse.stcard', '.st-site-card .collapse', function (event) {
      const card = this.closest('.st-site-card');
      if (!card) {
        return;
      }
      const open = event.type === 'shown';
      const site = String(card.getAttribute('data-site') || '');
      if (open) {
        expanded_sites.add(site);
      } else {
        expanded_sites.delete(site);
      }
      this.setAttribute('aria-hidden', open ? 'false' : 'true');
      const button = card.querySelector(`[aria-controls="${this.id}"]`);
      if (button) {
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        button.querySelector('span').textContent = open ? '收起' : '全部指标';
        button.querySelector('i').className = 'ti ' + (open ? 'ti-chevron-down' : 'ti-chevron-right');
      }
    });

  function reload_page_data() {
    load_total_statistics();
    show_site_history_day(current_date || moment().format('YYYY-MM-DD'), 1);
    if (!document.getElementById('st-view-sites').hidden) {
      load_site_statistics();
    }
  }

  function show_statistic_sites_modal() {
    const list = $('#statistic-sites-setting-list');
    list.html('<div class="text-muted py-3">加载中...</div>');
    $('#modal-statistic-sites').modal('show');

    axios_post_do('get_site_statistic_sites', {}, function (ret) {
      if (ret.code !== 0) {
        list.html(`<div class="text-danger py-3">${ret.msg || '加载失败'}</div>`);
        return;
      }

      const sites = ret.sites || [];
      if (!sites.length) {
        list.html('<div class="text-muted py-3">没有可配置的站点</div>');
        return;
      }

      list.html(sites.map(site => `
        <label class="form-selectgroup-item">
          <input type="checkbox" name="statistic_sites_setting" value="${site.id}"
            class="form-selectgroup-input" ${site.statistic ? 'checked' : ''}>
          <span class="form-selectgroup-label">${site.name}</span>
        </label>
      `).join(''));

  function save_statistic_sites_setting() {
    const settings = {};
    $('#statistic-sites-setting-list input[name="statistic_sites_setting"]').each(function () {
      settings[$(this).val()] = $(this).prop('checked');
    });

    axios_post_do('save_site_statistic_sites', { sites: settings }, function (ret) {
      if (ret.code !== 0) {
        show_fail_modal(ret.msg || '保存失败');
        return;
      }

      $('#modal-statistic-sites').modal('hide');
      show_success_modal(ret.msg || '保存成功');

  function show_history() {
    $('#modal-indexer-history').modal("show");

    $('#modal-indexer-history').one('shown.bs.modal', function () {
      if (chart_history) {
        chart_history.dispose();
      }

      chart_history = echarts.init(document.getElementById("chart-site-history"), null, {
        height: 350
      });

      $('#btn-history-one-week').trigger('click');

  function show_site_history(obj, days) {
    $('#modal-indexer-history .lit-segment-option').removeClass('active');
    $(obj).addClass('active');

    axios_post_do("get_site_history", { "days": days }, function (ret) {
      if (ret.code == 0) {
        const palette = statistics_chart_palette();
        let rotate = ret.dataset.length > 15 ? 40 : 0;
        let option_history = {
          animation: false,
          grid: { left: 8, top: 40, right: 8, bottom: 8, containLabel: true },
          color: [palette.accent, palette.muted],
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'line',
              lineStyle: { color: palette.axis, width: 1 }
            },
            valueFormatter: value => numeral(value).format('0.0 ib')
          },
          dataset: { source: ret.dataset },
          legend: {
            top: 0,
            right: 0,
            itemWidth: 12,
            itemHeight: 8,
            itemGap: 16,
            textStyle: { color: palette.secondary, fontSize: 12 }
          },
          xAxis: [{
            type: 'category',
            axisTick: { show: false },
            axisLine: { lineStyle: { color: palette.hairline } },
            axisLabel: { color: palette.secondary, fontSize: 11, rotate: rotate }
          }],
          yAxis: [{
            type: 'value',
            axisLine: { show: false },
            axisTick: { show: false },
            axisLabel: {
              color: palette.secondary,
              fontSize: 11,
              formatter: function (value) {
                return numeral(value).format('0.0 ib');
              }
            },
            splitLine: { lineStyle: { color: palette.grid } }
          }],
          series: [
            {
              name: "上传量",
              type: 'bar',
              barMaxWidth: 18,
              itemStyle: { borderRadius: [3, 3, 0, 0] }
            },
            {
              name: "下载量",
              type: 'bar',
              barMaxWidth: 18,
              itemStyle: { borderRadius: [3, 3, 0, 0] }
            }
          ]
        };

        chart_history.setOption(option_history);
        chart_history.resize();

        let up_all = 0;
        let dl_all = 0;
        let len = ret.dataset.length;
        for (let i = 1; i < len; i++) {
          up_all += ret.dataset[i][1];
        }
        for (let i = 1; i < len; i++) {
          dl_all += ret.dataset[i][2];
        }
        up_all = numeral(up_all).format('0.0 ib');
        dl_all = numeral(dl_all).format('0.0 ib');
        $('#site-history-title').text("历史数据 · 上传 " + up_all + " / 下载 " + dl_all);
      } else {
        show_fail_modal(`历史数据 查询失败：${ret.msg}`);
      }
    });
  }

  function statistics_pic_file_size(value) {
    return numeral(Number(value || 0)).format('0.00 ib');
  }

  function statistics_pic_bonus(value) {
    const num = Number(value || 0);
    if (num >= 1000000) {
      return `${(num / 1000000).toFixed(2)} M`;
    }
    if (num >= 1000) {
      return `${(num / 1000).toFixed(2)} K`;
    }
    return num.toFixed(2);
  }

  function statistics_pic_ratio(value) {
    const num = Number(value || 0);
    return num > 10000 ? '∞' : num.toFixed(2);
  }

  function statistics_pic_record_value(key, value) {
    const num = Number(value || 0);
    if (key === 'ratio' && num > 10000) {
      return Infinity;
    }
    return num;
  }

  function statistics_pic_site_available(item) {
    return Boolean(item && item.username && item.join_at);
  }

  function statistics_pic_drawable_sites() {
    return (site_statistics_data || []).filter(item => statistics_pic_site_available(item));
  }

  var STATISTICS_PIC_DEFAULT_SETTING = { favicon_blur: 37.5, show_timeline: true, watermark: 'nastool' };

  var STATISTICS_PIC_WATERMARKS = {
    nastool: 'NAStool'
  };

  function load_statistics_pic_depiler_version() {
    axios_post_do_async('pt_depiler_version', {}, function (ret) {
      const tag = String((ret && ret.code === 0 && ret.data && ret.data.version) || '').trim();
      if (!tag) {
        return;
      }
      const version = tag.charAt(0) === 'v' ? tag : 'v' + tag;
      STATISTICS_PIC_WATERMARKS.ptdepiler = `PT Depiler（${version}）`;
      $('#statistics-pic-watermark').prepend(
        $('<option>').val('ptdepiler').text(STATISTICS_PIC_WATERMARKS.ptdepiler)
      );
      if ($('#modal-statistics-pic-setting').hasClass('show')) {
        render_statistics_picture();
      }
    }, false);
  }

  function statistics_pic_favicon_blur_percent() {
    const input = document.getElementById('statistics-pic-favicon-blur');
    if (input && isFinite(Number(input.value))) {
      return Math.min(100, Math.max(0, Number(input.value)));
    }
    return STATISTICS_PIC_DEFAULT_SETTING.favicon_blur;
  }

  function statistics_pic_show_timeline() {
    const input = document.getElementById('statistics-pic-show-timeline');
    if (input) {
      return input.checked;
    }
    return STATISTICS_PIC_DEFAULT_SETTING.show_timeline;
  }

  function statistics_pic_watermark_type() {
    const select = document.getElementById('statistics-pic-watermark');
    if (select) {
      return select.value;
    }
    return STATISTICS_PIC_DEFAULT_SETTING.watermark;
  }

  function statistics_pic_watermark_html(timestamp) {
    const watermark = STATISTICS_PIC_WATERMARKS[statistics_pic_watermark_type()];
    if (!watermark) {
      return '';
    }
    return `<div style="margin-top: 16px; text-align: right; font-size: 24px; color: #b5b5b5;">Created By ${watermark} at ${timestamp}</div>`;
  }

  function statistics_pic_favicon_blur_px() {
    return statistics_pic_favicon_blur_percent() / 100 * 8;
  }

  function statistics_pic_format_blur(percent) {
    return `${Number(percent).toFixed(1).replace(/\.0$/, '')}%`;
  }

  var statistics_pic_blur_timer = null;

  function statistics_pic_favicon_blur_input(input) {
    $('#statistics-pic-favicon-blur-value').text(statistics_pic_format_blur(input.value));
    clearTimeout(statistics_pic_blur_timer);
    statistics_pic_blur_timer = setTimeout(render_statistics_picture, 80);
  }

  function show_statistics_picture_modal() {

    const sites = statistics_pic_drawable_sites()
      .sort((a, b) => Number(b.seeding || 0) - Number(a.seeding || 0));
    if (!sites.length) {
      show_fail_modal('没有可生成分享图的站点数据');
      return;
    }

    // 默认勾选做种数大于 50 的站点；若都不满足则全选
    const default_hit = sites.some(item => Number(item.seeding || 0) > 50);
    const is_checked = item => default_hit ? Number(item.seeding || 0) > 50 : true;

    $('#statistics-pic-favicon-blur').val(STATISTICS_PIC_DEFAULT_SETTING.favicon_blur);
    $('#statistics-pic-favicon-blur-value').text(statistics_pic_format_blur(STATISTICS_PIC_DEFAULT_SETTING.favicon_blur));
    $('#statistics-pic-show-timeline').prop('checked', STATISTICS_PIC_DEFAULT_SETTING.show_timeline);
    $('#statistics-pic-watermark').val(STATISTICS_PIC_DEFAULT_SETTING.watermark);

    $('#statistics-pic-sites').html(sites.map(item => `
      <label class="form-selectgroup-item">
        <input type="checkbox" name="statistics_pic_sites" value="${item.site}"
          class="form-selectgroup-input" onchange="render_statistics_picture()"
          ${is_checked(item) ? 'checked' : ''}>
        <span class="form-selectgroup-label">${item.site}</span>
      </label>
    `).join(''));

    $('#modal-statistics-pic-setting').modal('show');
    render_statistics_picture();
  }

  function render_statistics_picture() {
    const drawable_sites = statistics_pic_drawable_sites();
    const selected = select_GetSelectedVAL("statistics_pic_sites");
    const sites = drawable_sites.filter(item => selected.includes(item.site));
    $('#statistics-pic-poster').html(build_statistics_picture_html(sites));
    setTimeout(fit_statistics_picture_preview, 0);
  }

  function fit_statistics_picture_preview() {
    const preview = document.getElementById('statistics-pic-preview');
    const holder = document.getElementById('statistics-pic-scale');
    const poster = document.getElementById('statistics-pic-poster');
    if (!preview || !holder || !poster) {
      return;
    }

    const poster_width = poster.offsetWidth;
    const poster_height = poster.offsetHeight;
    if (!poster_width || !poster_height) {
      return;
    }

    const scale = Math.min(1, Math.max((preview.clientWidth - 24) / poster_width, 0));
    poster.style.transform = `scale(${scale})`;
    holder.style.width = `${Math.round(poster_width * scale)}px`;
    holder.style.height = `${Math.round(poster_height * scale)}px`;
  }

  var STATISTICS_PIC_ICON_PATH = {
    account:
      "M256 38Q217 38 183.0 56.5Q149 75 128 107Q128 126 152 143Q172 157 204 165Q233 173 256.0 173.0Q279 173 308 165Q340 157 360 143Q384 126 384 107Q363 75 329.0 56.5Q295 38 256 38ZM256 341Q283 341 301.5 322.5Q320 304 320.0 277.5Q320 251 301.5 232.0Q283 213 256.0 213.0Q229 213 210.5 232.0Q192 251 192.0 277.5Q192 304 210.5 322.5Q229 341 256 341ZM256 405Q214 405 174.5 389.0Q135 373 105.0 343.0Q75 313 59.0 273.5Q43 234 43.0 192.0Q43 150 59.0 110.5Q75 71 105.0 41.0Q135 11 174.5 -5.0Q214 -21 256.0 -21.0Q298 -21 337.5 -5.0Q377 11 407.0 41.0Q437 71 453.0 110.5Q469 150 469 192Q469 250 440.5 299.0Q412 348 363.0 376.5Q314 405 256 405Z",
    trophy:
      "M384 405Q369 405 355.0 391.5Q341 378 341 363H171Q171 378 157.0 391.5Q143 405 128 405H43V213Q43 197 56.0 184.0Q69 171 85 171H132Q139 135 162 114Q188 90 235 85V41Q213 38 198 27Q186 19 179 6Q174 -3 172 -13L171 -21H341L340 -13Q338 -3 333 6Q326 19 314 27Q299 38 277 41V85Q324 90 350 114Q373 135 380 171H427Q443 171 456.0 184.0Q469 197 469 213V405ZM128 213H85V363H128ZM427 213H384V363H427Z"
  };

  function statistics_pic_icon(name, size, fill) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 426 426" style="display: block;"><g transform="translate(-43,405) scale(1,-1)"><path fill="${fill}" d="${STATISTICS_PIC_ICON_PATH[name]}"/></g></svg>`;
  }

  var STATISTICS_PIC_HELP_PATH ="M10,19H13V22H10V19M12,2C17.35,2.22 19.68,7.62 16.5,11.67C15.67,12.67 14.33,13.33 13.67,14.17C13,15 13,16 13,17H10C10,15.33 10,13.92 10.67,12.92C11.33,11.92 12.67,11.33 13.5,10.67C15.92,8.43 15.32,5.26 12,5A3,3 0 0,0 9,8H6A6,6 0 0,1 12,2Z";

  function statistics_pic_help_icon(size, color) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="display: block;"><path fill="${color}" d="${STATISTICS_PIC_HELP_PATH}"/></svg>`;
  }

  function build_statistics_picture_html(sites) {
    sites = sites.filter(item => statistics_pic_site_available(item));
    if (!sites.length) {
      return `<div style="width: 1300px; height: 300px; box-sizing: border-box; background: #455a64; display: flex; align-items: center; justify-content: center; color: #9fb0ba; font-size: 32px;">请选择要展示的站点</div>`;
    }

    const ordered_sites = [...sites].sort((a, b) => String(a.join_at || '').localeCompare(String(b.join_at || '')));
    const total_upload = sites.reduce((sum, item) => sum + Number(item.upload || 0), 0);
    const total_download = sites.reduce((sum, item) => sum + Number(item.download || 0), 0);
    const total_seeding = sites.reduce((sum, item) => sum + Number(item.seeding || 0), 0);
    const total_seeding_size = sites.reduce((sum, item) => sum + Number(item.seeding_size || 0), 0);
    const total_bonus = sites.reduce((sum, item) => sum + Number(item.bonus || 0), 0);
    const total_ratio = total_download > 0 ? total_upload / total_download : (total_upload > 0 ? Infinity : 0);
    const join_times = sites
      .map(item => item.join_at ? new Date(String(item.join_at).replace(/-/g, '/')).getTime() : NaN)
      .filter(time => !isNaN(time));
    const age_years = join_times.length
      ? (Date.now() - Math.min(...join_times)) / (365 * 24 * 60 * 60 * 1000)
      : null;
    const username = (sites.find(item => item.username) || {}).username || 'NAStool';
    const timestamp = moment().format('YYYY-MM-DD HH:mm:ss');
    const font_family = "Arial, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif";
    const line_color = '#3d4f58';
    const favicon_blur = statistics_pic_favicon_blur_px();
    const favicon_filter = favicon_blur > 0 ? `filter: blur(${favicon_blur.toFixed(2)}px);` : '';
    const show_timeline = statistics_pic_show_timeline();

    const site_fields = [
      { label: '上传量', format: site => statistics_pic_file_size(site.upload) },
      { label: '下载量', format: site => statistics_pic_file_size(site.download) },
      { label: '做种数', format: site => String(Number(site.seeding || 0)) },
      { label: '做种量', format: site => statistics_pic_file_size(site.seeding_size) },
      { label: '积分值', format: site => statistics_pic_bonus(site.bonus) },
      { label: '分享率', format: site => statistics_pic_ratio(site.ratio) }
    ];
    const per_site_height = 408;
    const stats_top = per_site_height / 2 - 20 - 20 * site_fields.length;
    const date_top = per_site_height / 2 - 40;

    const summary = [
      ['总站点数', String(sites.length)],
      ['总上传量', statistics_pic_file_size(total_upload)],
      ['总下载量', statistics_pic_file_size(total_download)],
      ['总做种数', String(total_seeding)],
      ['总做种量', statistics_pic_file_size(total_seeding_size)],
      ['总积分值', statistics_pic_bonus(total_bonus)],
      ['总分享率', statistics_pic_ratio(total_ratio)],
      ['P龄', age_years === null ? '-' : `≈ ${age_years.toFixed(2)} 年`]
    ].map(([label, value]) => `
      <div style="height: 60px; line-height: 60px; font-size: 48px; color: #ffffff; white-space: nowrap;">${label}: ${value}</div>`).join('');

    const record_metrics = [
      { key: 'upload', format: statistics_pic_file_size },
      { key: 'download', format: statistics_pic_file_size },
      { key: 'seeding', format: value => String(Number(value || 0)) },
      { key: 'seeding_size', format: statistics_pic_file_size },
      { key: 'bonus', format: statistics_pic_bonus },
      { key: 'ratio', format: statistics_pic_ratio }
    ];
    const trophy_cell = gray => `
      <div style="height: 60px; display: flex; align-items: center;">
        <div style="width: 40px; height: 40px; margin-left: 4px; margin-top: 4px; display: flex;">${statistics_pic_icon('trophy', 40, gray ? '#B4B4B4' : '#C9B037')}</div>
      </div>`;
    const empty_cell = '<div style="height: 60px;"></div>';
    const record_cell = (site, format, metric_key) => {
      const icon = site.favicon
        ? `<img src="${site.favicon}" style="width: 40px; height: 40px; object-fit: contain; display: block; ${favicon_filter}">`
        : statistics_pic_help_icon(40, '#9e9e9e');
      return `
        <div style="height: 60px; display: flex; align-items: center;">
          <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">${icon}</div>
          <div style="margin-left: 20px; font-size: 48px; color: #ffffff; white-space: nowrap;">${format(site[metric_key])}</div>
        </div>`;
    };
    const records = trophy_cell(false) + trophy_cell(true) + record_metrics.map(metric => {
      const ranked = [...sites]
        .filter(item => item.join_at && item.username)
        .map(item => ({ item, value: statistics_pic_record_value(metric.key, item[metric.key]) }))
        .filter(({ value }) => Number.isFinite(value) && value > 0)
        .sort((a, b) => b.value - a.value);
      return (ranked[0] ? record_cell(ranked[0].item, metric.format, metric.key) : empty_cell) +
        (ranked[1] ? record_cell(ranked[1].item, metric.format, metric.key) : empty_cell);
    }).join('');

    const timeline = ordered_sites.map((site, index) => {
      const stats_on_left = index % 2 === 0;
      const is_last_site = index === ordered_sites.length - 1;
      const favicon = site.favicon
        ? `<img src="${site.favicon}" style="width: 76px; height: 76px; object-fit: contain; display: block; ${favicon_filter}">`
        : statistics_pic_help_icon(60, '#9e9e9e');
      const stats_block = `
        <div style="width: 100%;">
          <div style="font-size: 48px; font-weight: 700; line-height: 1; color: #ffffff;">${site.site}</div>
          <div style="margin-top: 8px; font-size: 32px; line-height: 40px; color: #ffffff; white-space: nowrap;">
            ${site_fields.map(field => `${field.label}: ${field.format(site)}`).join('<br>')}
          </div>
        </div>`;
      const date_block = `
        <div style="width: 100%;">
          <div style="font-size: 48px; font-weight: 700; line-height: 1; color: #ffffff; white-space: nowrap;">${(site.join_at || '').substring(0, 10) || '-'}</div>
          <div style="margin-top: 8px; width: 490px; font-size: 32px; line-height: 1.25; color: #ffffff; word-break: break-all;">${site.username || '-'} &lt;${site.user_level || '-'}&gt;</div>
        </div>`;
      const underline = `<div style="position: absolute; left: 20px; right: 53px; bottom: 2px; height: 4px; background: ${line_color};"></div>`;
      const right_underline = `<div style="position: absolute; left: 72px; right: 0; bottom: 2px; height: 4px; background: ${line_color};"></div>`;

      return `
        <div style="display: grid; grid-template-columns: 562px 96px 1fr; height: ${per_site_height}px;">
          <div style="position: relative; display: flex; align-items: flex-start; padding-top: ${stats_on_left ? stats_top : date_top}px; padding-left: 20px; padding-right: 53px;">
            ${stats_on_left ? stats_block : date_block}
            ${stats_on_left && !is_last_site ? underline : ''}
          </div>
          <div style="display: flex; align-items: center; justify-content: center;">
            <div style="position: relative; z-index: 1; width: 96px; height: 96px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden;">${favicon}</div>
          </div>
          <div style="position: relative; display: flex; align-items: flex-start; padding-top: ${stats_on_left ? date_top : stats_top}px; padding-left: 72px;">
            ${stats_on_left ? date_block : stats_block}
            ${!stats_on_left && !is_last_site ? right_underline : ''}
          </div>
        </div>`;
    }).join('');

    return `
      <div style="width: 1300px; box-sizing: border-box; background: #455a64; padding: 45px 40px 26px; color: #ffffff; font-family: ${font_family};">
        <div style="position: relative; display: flex; align-items: flex-start; height: 54px; padding-left: 5px;">
          <div style="flex-shrink: 0;">${statistics_pic_icon('account', 54, '#ffffff')}</div>
          <div style="margin-left: 31px; margin-top: 3px; font-size: 52px; font-weight: 400; color: #ffffff;">${username}</div>
          <div style="position: absolute; top: -7px; right: 0; font-size: 24px; line-height: 1; color: #9e9e9e;">${timestamp}</div>
        </div>
        <div style="position: relative; margin-top: 35px;">
          <div style="display: flex;">
            <div style="width: 558px; flex-shrink: 0;">${summary}</div>
            <div style="flex: 1; margin-left: 42px;">
              <div style="display: grid; grid-template-columns: 340px 1fr;">${records}</div>
            </div>
          </div>
          <div style="position: absolute; left: 558px; top: 16px; bottom: 3px; width: 4px; background: ${line_color};"></div>
          ${show_timeline ? `<div style="height: 4px; background: ${line_color}; margin-top: 26px;"></div>` : ''}
        </div>
        ${show_timeline ? `
        <div style="margin-top: 20px; font-size: 48px; font-weight: 700; line-height: 1.2; text-align: center;"><span style="position: relative; top: 4px;">... 这些年走过的路 ...</span></div>
        <div style="position: relative;">
          <div style="position: absolute; left: 608px; top: 20px; bottom: -20px; width: 4px; background: ${line_color};"></div>
          ${timeline}
        </div>` : ''}
        <div style="height: 4px; background: ${line_color}; margin-top: ${show_timeline ? 88 : 12}px;"></div>
        ${statistics_pic_watermark_html(timestamp)}
      </div>`;
  }

  var STATISTICS_PIC_IMAGE_PLACEHOLDER = 'data:image/svg+xml;base64,' + btoa(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#9e9e9e" d="${STATISTICS_PIC_HELP_PATH}"/></svg>`
  );

  function save_statistics_picture() {
    const poster = document.getElementById('statistics-pic-poster');
    if (!poster) {
      return;
    }
    const selected = select_GetSelectedVAL("statistics_pic_sites");
    if (!selected.length) {
      show_fail_modal('请先选择要展示的站点');
      return;
    }
    const width = poster.offsetWidth;
    const height = poster.offsetHeight;

    domtoimage.toBlob(poster, {
      bgcolor: '#455a64',
      width: width,
      height: height,
      style: { transform: 'none', position: 'static', top: 'auto', left: 'auto' },
      imagePlaceholder: STATISTICS_PIC_IMAGE_PLACEHOLDER
    }).then(function (blob) {
      saveAs(blob, `nastool_statistics_${moment().format('YYYYMMDDHHmmss')}.png`);
    }).catch(function () {
      show_fail_modal('生成图片失败');
    });
  }

  function ask_refresh_statistics(site_name) {
    var target = site_name ? '是否立即刷新【' + site_name + '】站点数据?' : "是否立即刷新所有站点的数据?";

    show_ask_modal(target, function () {
      axios_post_do_async("refresh_pt_statistics", { 'site': site_name }, function (ret) {
        if (ret.code !== 0) {
          show_fail_modal(ret.msg);
          return;
        }
        if (!site_name) {
          show_success_modal(ret.msg);
          return;
        }
        reload_page_data();
        if (ret.missing && ret.missing.length) {
          show_warning_modal(ret.msg);
        } else {
          show_success_modal(ret.msg);
        }
      });
    });
  }

  $(document).ready(function () {
    load_total_statistics();
    show_site_history_day(moment().format('YYYY-MM-DD'), 1);
    load_statistics_pic_depiler_version();

    $('#modal-statistics-pic-setting').on('shown.bs.modal', function () {
      fit_statistics_picture_preview();
    });
    $(window).on('resize', function () {
      if ($('#modal-statistics-pic-setting').hasClass('show')) {
        fit_statistics_picture_preview();
      }
    });
  });

</script>
