  @media (max-width: 767.98px) {

      .hx-table thead { display: none !important; }

      .hx-table tbody { display: block; }

      .hx-day > td { display: block; padding: 10px 14px 5px; }

      .hx-row {

          grid-template-areas:

          column-gap: 8px;
          row-gap: 6px;
          padding: 11px 14px 12px;
          border-top: 1px solid color-mix(in srgb, var(--tblr-body-color) 7%, transparent);

      .hx-day + .hx-row { border-top: 0; }

      .hx-row > td { display: block; padding: 0; border: 0; }

      .hx-row > td.hx-col-check,
      .hx-row > td.hx-col-time,

      .hx-row > td.hx-col-check { grid-area: check; align-self: center; padding: 0; }
      .hx-row > td.hx-col-time { grid-area: time; align-self: center; padding: 0; }
      .hx-row > td.hx-col-media { grid-area: media; padding: 0; }
      .hx-row > td.hx-col-path { grid-area: path; padding: 0 0 0 67px; }
      .hx-row > td.hx-col-menu { grid-area: menu; align-self: center; padding: 0; text-align: right; }

      .hx-row > td { background: transparent !important; }

      .hx-media { gap: 9px; }
      .hx-type { width: 28px; height: 28px; font-size: 15px; }

      .hx-flow { padding-left: 0; }
      .hx-flow::before,
      .hx-flow::after { content: none; }
      .hx-path-line { gap: 5px; line-height: 1.5; }
      .hx-path-line > .ti { font-size: 11px; }

      .hx-footer {
          flex-wrap: wrap;
          row-gap: 8px;

      }

      .hx-footer .pagination { width: 100%; justify-content: space-between; }
  }

  @media (prefers-reduced-motion: reduce) {
      .hx-spin { animation: none; }
      .hx-row, .hx-search input { transition: none; }

</style>

<div class="container-xl">
  <div class="page-header d-print-none mt-2">
    <div class="row align-items-end g-2">
      <div class="col">
        <h2 class="page-title">转移记录</h2>
        <div class="hx-head-meta" id="hx-head-meta">正在加载…</div>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          <button type="button" class="btn btn-primary" id="tr-batch-retry" aria-label="重新识别所选记录" disabled>
            <i class="ti ti-refresh fs-3"></i>
            <span class="d-none d-sm-inline">重新识别</span>
          </button>
          <div class="dropdown">
            <button type="button" class="btn btn-outline-danger dropdown-toggle" id="tr-batch-delete"
                    data-bs-toggle="dropdown" aria-expanded="false" aria-label="批量删除所选记录" disabled>
              <i class="ti ti-trash fs-3"></i>
              <span class="d-none d-sm-inline">批量删除</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end">
              <button type="button" class="dropdown-item text-danger" data-batch-action="del_source">删除源文件</button>
              <button type="button" class="dropdown-item text-danger" data-batch-action="del_dest">删除媒体库文件</button>
              <button type="button" class="dropdown-item text-danger" data-batch-action="del_all">删除源及媒体库文件</button>
            </div>
          </div>

      </div>

  </div>
</div>

<div class="page-body">
  <div class="container-xl">
    <div class="card rounded-3 shadow-none" id="hx-card">
      <div class="hx-toolbar">
        <label class="hx-search" id="hx-search-wrap">
          <i class="ti ti-search"></i>
          <input id="search_word" type="search" value="" autocomplete="off"
                 enterkeyhint="search" placeholder="搜索标题或文件名" aria-label="搜索标题或文件名">
          <button type="button" class="hx-search-clear" id="hx-search-clear" aria-label="清除搜索">
            <i class="ti ti-x"></i>
          </button>
        </label>
        <button type="button" class="hx-link-btn hx-page-select d-md-none" id="hx-page-select" hidden>全选</button>
        <div class="hx-selection" id="hx-selection" hidden>
          已选 <b id="hx-selection-count">0</b> 项
          <button type="button" class="hx-link-btn" id="hx-selection-clear">取消选择</button>
        </div>
      </div>

      <table class="hx-table" id="history-table-container">
        <colgroup>
          <col style="width:44px">
          <col style="width:74px">
          <col style="width:36%">
          <col>
          <col style="width:48px">
        </colgroup>
        <thead id="history-table-header">
          <tr>
            <th class="hx-col-check">
              <input class="form-check-input m-0 align-middle" type="checkbox" id="hx-select-all" aria-label="全选">
            </th>
            <th class="hx-col-time">时间</th>
            <th class="hx-col-media">媒体</th>
            <th>转移路径</th>
            <th class="hx-col-menu"><span class="visually-hidden">操作</span></th>
          </tr>
        </thead>
        <tbody id="history-table-body">
          <tr class="hx-empty-row">
            <td colspan="5">
              <div class="hx-empty">
                <span class="hx-empty-icon"><i class="ti ti-reload hx-spin"></i></span>
                <div class="hx-empty-title">正在加载…</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="hx-footer" id="pagination-container" hidden>
        <div class="hx-footer-meta" id="hx-footer-meta"></div>
        <ul class="pagination pagination-sm m-0 ms-auto" id="pagination-list"></ul>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
  (function () {
    var history_search = '';
    var history_page = 1;
    var history_page_size = 20;
    var history_req_seq = 0;

    var HX_TYPES = {
      '电影': {icon: 'ti-movie', tone: 'green'},
      '电视剧': {icon: 'ti-device-tv', tone: 'blue'},
      '动漫': {icon: 'ti-brand-bilibili', tone: 'orange'}
    };

    function hx_esc(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function hx_path(value) {
      return value ? String(value).replace(/\\/g, '/') : '';
    }

    function hx_join(dir, name) {
      if (!dir) {
        return name || '';
      }
      return dir.replace(/\/+$/, '') + '/' + (name || '');
    }

    function hx_clock(value) {
      var match = String(value || '').match(/\d{1,2}:\d{2}(:\d{2})?/);
      return match ? match[0].slice(0, 5) : '';
    }

    function hx_day_key(value) {
      var text = String(value || '');
      return text.length >= 10 ? text.slice(0, 10) : text;
    }

    function hx_day_info(key) {
      var date = new Date(key.replace(/-/g, '/'));
      if (isNaN(date.getTime())) {
        return {name: '', date: key || '未知日期'};
      }
      var now = new Date();
      var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var startDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      var diff = Math.round((startToday - startDay) / 86400000);
      var name = '';
      if (diff === 0) {
        name = '今天';
      } else if (diff === 1) {
        name = '昨天';
      } else if (diff > 1 && diff < 7) {
        name = '周' + '日一二三四五六'.charAt(date.getDay());
      } else if (diff < 0) {
        name = '';
      }
      var yearPrefix = date.getFullYear() !== now.getFullYear() ? date.getFullYear() + '年' : '';
      return {
        name: name,
        date: yearPrefix + (date.getMonth() + 1) + '月' + date.getDate() + '日'
      };
    }

    function hx_stamp(value) {
      var key = hx_day_key(value);
      if (!key) {
        return '';
      }
      var info = hx_day_info(key);
      var clock = hx_clock(value);
      return (info.name === '今天' || info.name === '昨天' ? info.name + ' ' : info.date + ' ') + clock;
    }

    function hx_day_html(key, count) {
      var info = hx_day_info(key);
      return `
        <tr class="hx-day">
          <td colspan="5">
            <div class="hx-day-inner">
              ${info.name ? `<span class="hx-day-name">${hx_esc(info.name)}</span>` : ''}
              <span class="hx-day-date">${hx_esc(info.date)}</span>
              <span class="hx-day-count">${count} 条</span>
            </div>
          </td>
        </tr>`;
    }

    function hx_title_html(item) {
      var title = item.TITLE || '未知标题';
      if (item.TMDBID) {
        var mediaType = item.TYPE === '电影' ? 'movie' : 'tv';
        return `<a class="hx-title-link" href="https://www.themoviedb.org/${mediaType}/${encodeURIComponent(item.TMDBID)}"
                   target="_blank" rel="noopener">${hx_esc(title)}</a>`;
      }
      return `<span class="hx-title-text">${hx_esc(title)}</span>`;
    }

    function hx_episode_html(item) {
      if (!item.SEASON_EPISODE) {
        return '';
      }
      var text = hx_esc(item.SEASON_EPISODE);
      if (item.TMDBID) {
        var suffix = String(item.SEASON_EPISODE).replace('S', '/season/').replace('E', '/episode/');
        var href = `https://www.themoviedb.org/tv/${encodeURIComponent(item.TMDBID)}${hx_esc(suffix)}`;
        return `<a class="hx-ep" href="${href}" target="_blank" rel="noopener">${text}</a>`;
      }
      return `<span class="hx-ep">${text}</span>`;
    }

    function hx_meta_html(item) {
      var parts = [];
      var typeLabel = item.CATEGORY || item.TYPE;
      if (typeLabel) {
        parts.push(hx_esc(typeLabel));
      }
      if (item.YEAR) {
        parts.push(hx_esc(item.YEAR));
      }
      if (item.SOURCE) {
        parts.push(hx_esc(item.SOURCE));
      }
      if (item.MODE) {
        parts.push(hx_esc(item.MODE));
      }

      var html = parts.length ? parts.join(' · ') : '';
      if (!item.TMDBID) {
        html += '<span class="hx-unmatched-actions">' +
          '<span class="hx-unmatched"><i class="ti ti-circle-x"></i>未匹配</span>' +
          '<button type="button" class="hx-inline-btn" data-row-action="manual">手动识别</button>' +
          '</span>';
      }
      return html;
    }

    function hx_dest_html(item) {
      var destPath = hx_path(item.DEST_PATH);
      var destName = item.DEST_FILENAME || '';
      var fullPath = hx_join(destPath, destName);
      if (!destName) {
        return `<span class="hx-path-line hx-dst is-missing" title="本次没有生成媒体库文件">
                  <i class="ti ti-alert-triangle"></i>
                  <span class="hx-path-name">未生成媒体库文件</span>
                </span>`;
      }
      if (!destPath) {
        return `<span class="hx-path-line hx-dst" title="${hx_esc(destName)}">
                  <i class="ti ti-folders"></i>
                  <span class="hx-path-name">${hx_esc(destName)}</span>
                </span>`;
      }
      return `<a class="hx-path-line hx-dst hx-dir-link" href="javascript:void(0)"
                 data-dir="${hx_esc(destPath)}" title="${hx_esc(fullPath || destName)}">
                <i class="ti ti-folders"></i>
                <span class="hx-path-name">${hx_esc(destName)}</span>
              </a>`;
    }

    function hx_source_html(item) {
      var sourcePath = hx_path(item.SOURCE_PATH);
      var sourceName = item.SOURCE_FILENAME || '';
      var fullPath = hx_join(sourcePath, sourceName);
      if (!sourceName) {
        return `<span class="hx-path-line hx-src"><i class="ti ti-download"></i><span class="hx-path-name">源文件未知</span></span>`;
      }
      if (!sourcePath) {
        return `<span class="hx-path-line hx-src" title="${hx_esc(sourceName)}">
                  <i class="ti ti-download"></i>
                  <span class="hx-path-name">${hx_esc(sourceName)}</span>
                </span>`;
      }
      return `<a class="hx-path-line hx-src hx-dir-link" href="javascript:void(0)"
                 data-dir="${hx_esc(sourcePath)}" title="${hx_esc(fullPath || sourceName)}">
                <i class="ti ti-download"></i>
                <span class="hx-path-name">${hx_esc(sourceName)}</span>
              </a>`;
    }

    function hx_row_html(item) {
      var type = item.TYPE || '';
      var typeMeta = HX_TYPES[type] || {icon: 'ti-file-info', tone: 'secondary'};
      var episodeHtml = hx_episode_html(item);
      var displayName = (item.TITLE || '未知标题') +
        (item.YEAR ? ` (${item.YEAR})` : '') +
        (item.SEASON_EPISODE ? ` ${item.SEASON_EPISODE}` : '');

      return `
        <tr class="hx-row"
            data-id="${hx_esc(item.ID)}"
            data-type="${hx_esc(type)}"
            data-path="${hx_esc(item.SOURCE_FILENAME || '')}"
            data-rmt="${hx_esc(item.RMT_MODE || '')}"
            data-name="${hx_esc(displayName)}">
          <td class="hx-col-check">
            <input class="form-check-input m-0 align-middle" type="checkbox" name="transfer_history"
                   value="${hx_esc(item.ID)}" aria-label="选择 ${hx_esc(displayName)}">
          </td>
          <td class="hx-col-time">
            <time class="hx-time" datetime="${hx_esc(item.DATE || '')}"
                  title="${hx_esc(item.DATE || '')}">${hx_esc(hx_clock(item.DATE))}</time>
          </td>
          <td class="hx-col-media">
            <div class="hx-media">
              <span class="hx-type bg-${typeMeta.tone}-lt text-${typeMeta.tone}">
                <i class="ti ${typeMeta.icon}"></i>
              </span>
              <div class="hx-media-main">
                <div class="hx-title">${hx_title_html(item)}${episodeHtml}</div>
                <div class="hx-meta">${hx_meta_html(item)}</div>
              </div>
            </div>
          </td>
          <td class="hx-col-path">
            <div class="hx-flow">
              ${hx_source_html(item)}
              ${hx_dest_html(item)}
            </div>
          </td>
          <td class="hx-col-menu">
            <div class="dropdown">
              <button type="button" class="btn-action hx-menu-btn" data-bs-toggle="dropdown"
                      aria-expanded="false" aria-label="记录操作">
                <i class="ti ti-dots-vertical fs-2"></i>
              </button>
              <div class="dropdown-menu dropdown-menu-end">
                <button type="button" class="dropdown-item" data-row-action="retry">重新识别</button>
                <button type="button" class="dropdown-item" data-row-action="manual">手动识别</button>
                <div class="dropdown-divider"></div>
                <button type="button" class="dropdown-item text-danger" data-row-action="del_source">删除源文件</button>
                <button type="button" class="dropdown-item text-danger" data-row-action="del_dest">删除媒体库文件</button>
                <button type="button" class="dropdown-item text-danger" data-row-action="del_all">删除源及媒体库文件</button>
              </div>
            </div>
          </td>
        </tr>`;
    }

    function hx_empty_html(keyword) {
      var isSearch = !!keyword;
      var title = isSearch ? '没有找到匹配的记录' : '还没有转移记录';
      var desc = isSearch
        ? `没有标题或文件名包含“${hx_esc(keyword)}”的记录`
        : '下载完成的文件转移到媒体库后，会在这里留下记录。';
      return `
        <tr class="hx-empty-row">
          <td colspan="5">
            <div class="hx-empty">
              <span class="hx-empty-icon"><i class="ti ${isSearch ? 'ti-list-search' : 'ti-history'}"></i></span>
              <div class="hx-empty-title">${title}</div>
              <div class="hx-empty-desc">${desc}</div>
              ${isSearch ? '<button type="button" class="btn btn-sm btn-outline-secondary" id="hx-empty-clear">清除搜索</button>' : ''}
            </div>
          </td>
        </tr>`;
    }

    function hx_update_search_clear() {
      $('#hx-search-wrap').toggleClass('has-value', !!$('#search_word').val());
    }

    function hx_update_selection() {
      var total = $('input[name="transfer_history"]').length;
      var count = select_GetSelectedVAL('transfer_history').length;
      $('#hx-selection').prop('hidden', count === 0);
      $('#hx-selection-count').text(count);
      $('#hx-selection-clear').toggle(total === 0 || count !== total);
      $('#tr-batch-retry, #tr-batch-delete').prop('disabled', count === 0);
      $('#hx-select-all')
        .prop('checked', total > 0 && count === total)
        .prop('indeterminate', count > 0 && count < total);
      $('#hx-page-select')
        .prop('hidden', total === 0)
        .text(total > 0 && count === total ? '取消全选' : '全选');
    }

    function hx_clear_selection() {
      $('input[name="transfer_history"]').prop('checked', false);
      hx_update_selection();
    }

    function hx_pagination_html(data) {
      var current = parseInt(data.CurrentPage) || 1;
      var pages = Math.max(1, Math.ceil((parseInt(data.TotalCount) || 0) / history_page_size));
      var list = [];

      function item(label, page, opts) {
        opts = opts || {};
        var cls = 'page-item' + (opts.active ? ' active' : '') + (opts.disabled ? ' disabled' : '');
        var inner = opts.disabled
          ? `<span class="page-link">${label}</span>`
          : `<a class="page-link" href="javascript:void(0)" data-page="${page}"
                ${opts.active ? 'aria-current="page"' : ''}>${label}</a>`;
        return `<li class="${cls}">${inner}</li>`;
      }

      list.push(item('<i class="ti ti-chevron-left fs-2"></i>', Math.max(1, current - 1), {disabled: current <= 1}));
      get_page_range(current, pages).forEach(function (page) {
        list.push(item(page, page, {active: page === current}));
      });
      list.push(item('<i class="ti ti-chevron-right fs-2"></i>', Math.min(pages, current + 1), {disabled: current >= pages}));
      return list.join('');
    }

    function hx_render(data) {
      var items = data.Historys || [];
      var keyword = data.Search || history_search;
      var total = parseInt(data.TotalCount) || 0;
      var current = parseInt(data.CurrentPage) || 1;
      var totalPage = Math.max(1, Math.ceil(total / history_page_size));
      var body = $('#history-table-body').empty();

      $('#hx-card').toggleClass('is-empty', items.length === 0);

      if (!items.length && total > 0) {
        var fallbackPage = Math.min(current, totalPage);
        if (fallbackPage !== current) {
          history_goto_page(history_search, fallbackPage);
          return;
        }
      }

      if (!items.length && total === 0 && current > 1) {
        history_goto_page(history_search, 1);
        return;
      }

      if (!items.length) {
        body.html(hx_empty_html(keyword));
        $('#pagination-container').prop('hidden', true);
        $('#hx-head-meta').text(keyword ? `搜索“${keyword}” · 共 0 条记录` : '共 0 条记录');
        hx_clear_selection();
        return;
      }

      var groups = [];
      var groupMap = {};
      items.forEach(function (item) {
        var key = hx_day_key(item.DATE) || '';
        if (!groupMap[key]) {
          groupMap[key] = {count: 0, rows: []};
          groups.push({key: key, group: groupMap[key]});
        }
        groupMap[key].count += 1;
        groupMap[key].rows.push(hx_row_html(item));
      });

      var html = '';
      groups.forEach(function (entry) {
        html += hx_day_html(entry.key, entry.group.count);
        html += entry.group.rows.join('');
      });
      body.html(html);

      var recent = hx_stamp(items[0].DATE);
      var scope = keyword ? `搜索“${keyword}” · ` : '';
      $('#hx-head-meta').text(`${scope}共 ${total} 条记录${recent ? ' · 最近一次 ' + recent : ''}`);

      $('#hx-footer-meta').text(`共 ${total} 条记录 · 第 ${current} / ${totalPage} 页`);
      $('#pagination-list').html(hx_pagination_html(data));
      $('#pagination-container').prop('hidden', false);

      $('#hx-select-all').prop('checked', false).prop('indeterminate', false);
      hx_update_selection();
    }

    function history_load_data(keyword, page) {
      var seq = ++history_req_seq;
      history_search = keyword || '';
      history_page = parseInt(page) || 1;
      $('#search_word').val(history_search);
      hx_update_search_clear();
      $('#history-table-container').attr('aria-busy', 'true');

      axios_post('/data/history', {
        s: history_search,
        page: history_page,
        pagenum: history_page_size
      }, function (response) {
        if (seq !== history_req_seq) {
          return;
        }
        $('#history-table-container').removeAttr('aria-busy');
        if (response.code === 0 && response.data) {
          hx_render(response.data);
        }
      });
    }

    function history_goto_page(keyword, page) {
      var targetPage = parseInt(page) || 1;
      setPageParams({s: keyword || '', page: targetPage});
      history_load_data(keyword, targetPage);
    }

    function rename_history(type, path, id, rmt_mode) {
      show_manual_transfer_modal(2, path, rmt_mode, type, '', id);
    }

    function delete_history(flag, logids, name) {
      var label = '';
      if (flag === 'del_all') {
        label = '源文件及媒体库';
      } else if (flag === 'del_source') {
        label = '源';
      } else if (flag === 'del_dest') {
        label = '媒体库';
      }
      var confirmTip = `${name ? name + ' 对应的' : ''}${label}文件将被同步删除，是否确认？`;
      show_confirm_modal(confirmTip, function () {
        axios_post_do('delete_history', {flag: flag, logids: logids}, function () {
          window_history_refresh();
        });
      });
    }

    function batch_check_action(flag) {
      var logids = select_GetSelectedVAL('transfer_history');
      if (logids.length === 0) {
        return;
      }
      if (flag.indexOf('del') === 0) {
        delete_history(flag, logids, '');
      } else if (flag === 'reidentification') {
        re_identification('history', logids);
      }
    }

    $(document).ready(function () {
      $('#search_word')
        .on('keypress', function (event) {
          if (event.key === 'Enter' || event.keyCode === 13) {
            event.preventDefault();
            history_goto_page($(this).val(), 1);
          }
        })
        .on('input', hx_update_search_clear);

      $('#hx-search-clear').on('click', function () {
        $('#search_word').val('').trigger('focus');
        history_goto_page('', 1);
      });

      $('#hx-select-all').on('change', function () {
        select_SelectALL($(this).prop('checked'), 'transfer_history');
        hx_update_selection();
      });

      $('#hx-selection-clear').on('click', hx_clear_selection);

      $('#hx-page-select').on('click', function () {
        var all = $('input[name="transfer_history"]');
        var count = all.filter(':checked').length;
        select_SelectALL(!(all.length && count === all.length), 'transfer_history');
        hx_update_selection();
      });
      $('#tr-batch-retry').on('click', function () {
        batch_check_action('reidentification');
      });

      $(document)
        .off('click.hx-batch', '[data-batch-action]')
        .on('click.hx-batch', '[data-batch-action]', function () {
          batch_check_action($(this).attr('data-batch-action'));
        });

      $('#history-table-body')
        .on('change', 'input[name="transfer_history"]', hx_update_selection)
        .on('click', '#hx-empty-clear', function () {
          history_goto_page('', 1);
        })
        .on('click', '.hx-dir-link', function () {
          var dir = $(this).attr('data-dir');
          if (dir) {
            navmenu('mediafile', {dir: dir});
          }
        })
        .on('click', '[data-row-action]', function (event) {
          event.preventDefault();
          var action = $(this).attr('data-row-action');
          var row = $(this).closest('.hx-row');
          var id = row.attr('data-id');
          var name = row.attr('data-name') || '';
          if (action === 'retry') {
            re_identification('history', [id]);
          } else if (action === 'manual') {
            rename_history(row.attr('data-type'), row.attr('data-path'), id, row.attr('data-rmt'));
          } else if (action === 'del_source' || action === 'del_dest' || action === 'del_all') {
            delete_history(action, [id], name);
          }
        });

      $('#pagination-list').on('click', '[data-page]', function (event) {
        event.preventDefault();
        history_goto_page(history_search, $(this).attr('data-page'));
      });

      setPageRefreshHandler(function () {
        history_load_data(history_search, history_page);
      });

      var params = (typeof getPageParams === 'function' && getPageParams()) || {};
      history_load_data(params.s || '', params.page || 1);
    });
  })();
</script>
