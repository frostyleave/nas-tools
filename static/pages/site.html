<style>
  #sites-container .site-name {
    font-size: 14.5px;
  }

  #sites-container .site-level {
    margin-top: 1px;
    color: var(--tblr-secondary);
    font-size: 11.5px;
    line-height: 18px;
  }

  #sites-container .site-actions {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: 2px;
  }
</style>

<div class="container-xl">
  <!-- Page title -->
  <div class="page-header d-print-none mt-2">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title">站点管理</h2>
      </div>
      <!-- Page title actions -->
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          <a href="javascript:show_site_modal()" class="btn btn-primary d-none d-sm-inline-flex">
            <i class="ti ti-plus fs-3"></i>
            新增站点
          </a>
          <a href="javascript:show_site_modal()" class="btn btn-primary d-sm-none mbtn-action">
            <i class="ti ti-plus fs-3"></i>
          </a>
          <a href="javascript:show_sitetest_modal()" class="btn btn-lime d-none d-sm-inline-flex">
            <i class="ti ti-activity-heartbeat fs-3"></i>
            站点测试
          </a>
          <a href="javascript:show_sitetest_modal()" class="btn btn-lime d-sm-none mbtn-action">
            <i class="ti ti-activity-heartbeat fs-3"></i>
          </a>
          <a href="javascript:show_bt_sites_modal()" class="btn btn-purple d-none d-sm-inline-flex">
            <i class="ti ti-world-search fs-3"></i>
            BT站点
          </a>
          <a href="javascript:show_bt_sites_modal()" class="btn btn-purple d-sm-none mbtn-action">
            <i class="ti ti-world-search fs-3"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="page-body mt-2" id="sites-container" style="display: none;">
  <div class="container-xl">
    <div class="mb-2">
      <div class="input-icon">
        <span class="input-icon-addon">
          <i class="ti ti-search"></i>
        </span>
        <input type="text" id="site_search" class="form-control" placeholder="搜索站点名称" autocomplete="off"
          aria-label="搜索站点">
      </div>
    </div>
    <div class="d-grid gap-3 grid-info-card active-grid" id="active-list">
    </div>
    <div class="site-divider" id="inactive-sites-divider" role="separator" style="display: none;">未启用</div>
    <div class="d-grid gap-3 grid-info-card" id="sites-list">
    </div>
  </div>
</div>

<nodata-found id="no-search-result" title="未找到站点" text="没有名称匹配的站点，请调整搜索关键词。" style="display: none;"></nodata-found>
<nodata-found id="no-sites" title="没有站点" text='没有添加任何站点，请点击”新增站点“按钮。' style="display: none;"></nodata-found>

<div class="modal modal-blur fade" id="modal-site" tabindex="-1" role="dialog" aria-hidden="true"
  aria-labelledby="modal-site-title" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-site-title">新增站点</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body d-flex flex-column gap-3">
        <input type="hidden" id="site_id" />

        <section>
          <div class="row g-3 align-items-center">
            <div class="col-12 col-xl-3">
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <label class="form-label mb-0 text-nowrap" for="site_name">名称</label>
                <input type="text" class="form-control flex-fill w-auto" id="site_name" size="1" placeholder="站点名称" autocomplete="off" required />
              </div>
            </div>
            <div class="col-12 col-xl">
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <label class="form-label mb-0 text-nowrap" for="site_signurl">地址</label>
                <input type="text" class="form-control flex-fill w-auto" id="site_signurl" size="1" placeholder="https://" autocomplete="off" required />
                <div class="invalid-feedback w-100">地址需以 http 开头</div>
              </div>
            </div>
            <div class="col-12 col-xl-2">
              <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 text-nowrap" for="site_proxy">使用代理</label>
                <label class="form-check form-switch p-0 m-0 d-flex align-items-center">
                  <input class="form-check-input float-none m-0" type="checkbox" role="switch" id="site_proxy" />
                </label>
              </div>
            </div>
          </div>
        </section>

        <section>
          <ul class="nav lit-segment" role="tablist" style="border-bottom-left-radius: 0; border-bottom-right-radius: 0;">
            <li class="nav-item" role="presentation" id="cookie-form-tab">
              <a href="#tabs-cookie-form" class="nav-link lit-segment-option active" data-bs-toggle="tab" aria-selected="true" role="tab">Cookie</a>
            </li>
            <li class="nav-item" role="presentation" id="api-form-tab">
              <a href="#tabs-api-form" class="nav-link lit-segment-option is-trailing" data-bs-toggle="tab" aria-selected="false" role="tab" tabindex="-1">API</a>
            </li>
          </ul>
          <div class="tab-content border rounded-3 p-3" style="border-top-left-radius: 0 !important; margin-top: -1px;">
            <div class="tab-pane fade show active" id="tabs-cookie-form" role="tabpanel">
              <div class="mb-3">
                <textarea class="form-control" id="site_cookie" rows="2" placeholder="粘贴站点 Cookie"
                  aria-label="Cookie" spellcheck="false"></textarea>
              </div>
              <div>
                <label class="form-label" for="site_ua">User-Agent</label>
                <div class="input-group input-group-flat">
                  <input type="text" class="form-control" id="site_ua" placeholder="留空使用全局设置"
                    autocomplete="off" />
                  <span class="input-group-text">
                    <a href="javascript:set_user_agent('site_ua')" class="link-secondary"
                      title="读取当前浏览器 User-Agent" data-bs-toggle="tooltip">
                      <i class="ti ti-arrow-bar-to-left fs-2"></i>
                    </a>
                  </span>
                </div>
              </div>
            </div>
            <div class="tab-pane fade" id="tabs-api-form" role="tabpanel">
              <div class="mb-3">
                <label class="form-label" for="site_apikey">
                  API Key
                  <span class="form-help" title="站点的 API Key，部分站点需要" data-bs-toggle="tooltip">?</span>
                </label>
                <input type="text" class="form-control" id="site_apikey" placeholder="API Key" autocomplete="off" />
              </div>
              <div>
                <label class="form-label" for="site_token">
                  Authorization
                  <span class="form-help" title="请求头中的 Authorization，部分站点需要" data-bs-toggle="tooltip">?</span>
                </label>
                <input type="text" class="form-control" id="site_token" placeholder="Authorization" autocomplete="off" />
              </div>
            </div>
          </div>
        </section>

        <section>
          <div class="d-flex align-items-center gap-2 mb-2">
            <label class="form-label fw-semibold cursor-pointer mb-0" for="site_subscribe">开启订阅</label>
            <label class="form-check form-switch p-0 m-0 d-flex align-items-center">
              <input class="form-check-input float-none m-0" type="checkbox" role="switch" id="site_subscribe"
                name="site_uses" value="D" checked>
            </label>
          </div>
          <div class="border rounded-3 px-3 py-2">
            <div class="row g-2 align-items-center">
              <label class="col-4 col-lg-2 col-form-label" for="site_rssurl">RSS 地址</label>
              <div class="col-8 col-lg-9">
                <input type="text" class="form-control" id="site_rssurl" placeholder="https://" autocomplete="off" />
              </div>
            </div>
            <div class="row g-2 align-items-center mt-1">
              <label class="col-4 col-lg-2 col-form-label" for="site_pri">订阅优先级</label>
              <div class="col-4 col-lg-3">
                <div class="d-flex align-items-center gap-2">
                  <input type="number" class="form-control" id="site_pri" min="0" placeholder="1" required />
                  <span class="form-help flex-shrink-0" title="多个站点同时命中订阅时，优先下载数值更小的站点"
                    data-bs-toggle="tooltip">?</span>
                </div>
              </div>
            </div>
            <div class="row g-2 align-items-center mt-1">
              <label class="col-4 col-lg-2 col-form-label" for="site_parse">解析种子详情</label>
              <div class="col-4 col-lg-3">
                <div class="d-flex align-items-center gap-2">
                  <label class="form-check form-switch p-0 m-0 d-flex align-items-center cursor-pointer">
                    <input class="form-check-input float-none m-0" type="checkbox" role="switch" id="site_parse" />
                  </label>
                  <span class="form-help flex-shrink-0" title="访问种子详情页判断 FREE 与 HR 状态，会增加站点访问压力"
                    data-bs-toggle="tooltip">?</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="border rounded-3 p-3">
          <div class="row g-3">
            <div class="col-12 col-sm-3">
              <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 text-nowrap" for="site_statistics">数据统计</label>
                <label class="form-check form-switch p-0 m-0 d-flex align-items-center">
                  <input class="form-check-input float-none m-0" type="checkbox" role="switch" id="site_statistics"
                    name="site_uses" value="T" checked>
                </label>
              </div>
            </div>
            <div class="col-12 col-sm-4">
              <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 text-nowrap" for="site_unread_msg_notify">未读消息通知</label>
                <label class="form-check form-switch p-0 m-0 d-flex align-items-center">
                  <input class="form-check-input float-none m-0" type="checkbox" role="switch"
                    id="site_unread_msg_notify" />
                </label>
              </div>
            </div>
            <div class="col-12 col-sm-4">
              <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 text-nowrap" for="site_subtitle">下载字幕</label>
                <label class="form-check form-switch p-0 m-0 d-flex align-items-center">
                  <input class="form-check-input float-none m-0" type="checkbox" role="switch" id="site_subtitle" />
                </label>
              </div>
            </div>
            <div class="col-12 col-xl-3">
              <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 text-nowrap" for="site_download_setting">下载设置</label>
                <select class="form-select flex-fill w-auto" id="site_download_setting">
                  <option value="">默认</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-xl-4">
              <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0 text-nowrap" for="site_rule">
                  过滤规则
                  <span class="form-help" title="仅作用于 RSS 与内置索引搜索，刷流不受限制"
                    data-bs-toggle="tooltip">?</span>
                </label>
                <select class="form-select flex-fill w-auto" id="site_rule">
                  <option value="" selected>默认</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-xl-5">
              <div class="d-flex align-items-center gap-2">
                <div class="form-label mb-0 text-nowrap">资源类型</div>
                <div class="form-selectgroup flex-fill" id="source-setting-group"></div>
              </div>
            </div>
          </div>
        </section>

        <details class="site-advanced">
          <summary>
            <span>站点流控</span>
            <span class="form-help" title="控制站点访问频率，触发时跳过该站点；全部留空则不限制"
              data-bs-toggle="tooltip">?</span>
          </summary>
          <div class="row g-3 site-advanced-body pt-3 px-2">
            <div class="col-md-4">
              <label class="form-label" for="sitelimit_interval">单位时间（分钟）</label>
              <input type="number" class="form-control" id="sitelimit_interval" min="1" placeholder="10" />
              <div class="invalid-feedback">请填写数字</div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="sitelimit_count">单位时间内访问次数</label>
              <input type="number" class="form-control" id="sitelimit_count" min="1" placeholder="10" />
              <div class="invalid-feedback">请填写数字</div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="sitelimit_seconds">访问间隔（秒）</label>
              <input type="number" class="form-control" id="sitelimit_seconds" min="1" placeholder="5" />
              <div class="invalid-feedback">请填写数字</div>
            </div>
          </div>
        </details>
      </div>
      <div class="modal-footer">
        <button type="button" id="site_del_btn" class="btn btn-ghost-danger me-auto">
          <i class="ti ti-trash"></i>删除
        </button>
        <button type="button" class="btn btn-ghost-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" id="add_or_edit_site_btn" class="btn btn-primary">新增站点</button>
      </div>
    </div>
  </div>
</div>

  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">

<script type="text/javascript">

  // Cookie / API 认证方式切换
  function site_show_auth_tab(mode) {
    const link = mode === "api" ? $("#api-form-tab a")[0] : $("#cookie-form-tab a")[0];
    if (link && window.bootstrap && bootstrap.Tab) {
      bootstrap.Tab.getOrCreateInstance(link).show();
    }
  }

  // 清空校验状态，并把弹窗滚回顶部
  function site_reset_form() {
    $("#modal-site .is-invalid").removeClass("is-invalid");
    $("#modal-site").one("shown.bs.modal", function () {
      $(this).find(".modal-body").scrollTop(0);
    });
  }

  // 打开新增站点框
  function show_site_modal() {
    $("#site_id").val('');
    $("#site_name").val('');
    $("#site_pri").val('1');
    $("#site_rssurl").val('');
    $("#site_signurl").val('');
    $("#site_cookie").val('');
    $("#site_token").val('');
    $("#site_apikey").val('');
    $("#site_ua").val('');
    $("#site_rule").val('');
    $("#site_download_setting").val('');
    $("#sitelimit_interval").val('');
    $("#sitelimit_count").val('');
    $("#sitelimit_seconds").val('');
    $("#site_proxy, #site_parse, #site_subtitle, #site_unread_msg_notify").prop("checked", false);
    $("input[name='site_uses']").prop("checked", true);
    $("#source-setting-group input").prop("checked", true);
    $("#modal-site .site-advanced").prop("open", false);
    $("#site_del_btn").hide();
    $("#modal-site-title").text("新增站点");
    $("#add_or_edit_site_btn").prop("disabled", false).text("新增站点");
    site_show_auth_tab("cookie");
    site_reset_form();
    $("#modal-site").modal("show");
  }

  //编辑站点
  function edit_site(tid) {
    $("#site_id").val(tid);
    $("#site_del_btn").show();
    //根据ID查询详细信息
    axios_post_do("get_site", {"id": tid}, function (ret) {
      if (!ret.site) {
        return;
      }
      const site = ret.site;
      $("#site_id").val(site.id);
      $("#site_name").val(site.name);
      $("#site_pri").val(site.pri);
      $("#site_rssurl").val(site.rssurl);
      $("#site_signurl").val(site.signurl);
      $("#site_cookie").val(site.cookie);
      $("#site_token").val(site.token);
      $("#site_apikey").val(site.apikey);
      $("#site_ua").val(site.ua);
      $("#site_download_setting").val(site.download_setting);
      $("#site_rule").val(site.rule);
      $("#site_proxy").prop("checked", !!site.proxy);
      $("#site_parse").prop("checked", !!site.parse);
      $("#site_subtitle").prop("checked", !!site.subtitle);
      $("#site_unread_msg_notify").prop("checked", !!site.unread_msg_notify);
      select_SelectPart(site.uses, "site_uses");
      select_SelectPart(site.source_type, "source_setting");
      $("#sitelimit_interval").val(site.limit_interval);
      $("#sitelimit_count").val(site.limit_count);
      $("#sitelimit_seconds").val(site.limit_seconds);
      $("#modal-site .site-advanced").prop("open", !!(
        site.limit_interval || site.limit_count || site.limit_seconds
      ));
      $("#modal-site-title").text("编辑站点");
      $("#add_or_edit_site_btn").prop("disabled", false).text("保存修改");
      site_show_auth_tab(site.apikey ? "api" : "cookie");
      site_reset_form();
      $("#modal-site").modal("show");
    });
  }

  //删除站点
  function del_site(tid) {
    axios_post_do("del_site", {"id": tid}, function (ret) {
      window_history_refresh();
    });
  }

  //新增or更新站点
  function add_or_edit_site() {
    let firstInvalid = null;
    // 标记字段错误；多个字段同时出错时只定位到第一个
    const invalid = (selector, message) => {
      const $field = $(selector).addClass("is-invalid");
      if (message) {
        $field.siblings(".invalid-feedback").text(message);
      }
      $field.closest("details").prop("open", true);
      if (!firstInvalid) {
        firstInvalid = $field[0];
      }
    };
    const isUrl = (value) => /^https?:\/\//i.test(value);

    $("#modal-site .is-invalid").removeClass("is-invalid");

    //名称
    const site_name = $.trim($("#site_name").val());
    if (!site_name) {
      invalid("#site_name", "请填写站点名称");
    }
    //优先级
    const site_pri = $.trim($("#site_pri").val());
    if (!site_pri || isNaN(site_pri)) {
      invalid("#site_pri", "请填写订阅优先级");
    }
    //站点地址
    const site_signurl = $.trim($("#site_signurl").val());
    if (site_signurl && !isUrl(site_signurl)) {
      invalid("#site_signurl", "地址需以 http 开头");
    }
    //RSS URL：填写了就必须是 http 地址；开启订阅时必须填写
    const site_rssurl = $.trim($("#site_rssurl").val());
    const site_uses = select_GetSelectedVAL("site_uses").join("");
    if (site_rssurl && !isUrl(site_rssurl)) {
      invalid("#site_rssurl", "地址需以 http 开头");
    } else if (site_uses.includes("D") && !site_rssurl) {
      invalid("#site_rssurl", "开启订阅需要填写 RSS 地址");
    }
    //流控规则
    [["#sitelimit_interval", "单位时间需填写数字"],
      ["#sitelimit_count", "访问次数需填写数字"],
      ["#sitelimit_seconds", "访问间隔需填写数字"]].forEach(([selector, message]) => {
      const value = $.trim($(selector).val());
      if (value && isNaN(value)) {
        invalid(selector, message);
      }
    });

    if (firstInvalid) {
      firstInvalid.scrollIntoView({block: "center", behavior: "smooth"});
      firstInvalid.focus({preventScroll: true});
      return;
    }

    const data = {
      "site_id": $("#site_id").val(),
      "site_name": site_name,
      "site_pri": site_pri,
      "site_rssurl": site_rssurl,
      "site_signurl": site_signurl,
      "site_cookie": $("#site_cookie").val(),
      "site_token": $("#site_token").val(),
      "site_apikey": $("#site_apikey").val(),
      "site_include": site_uses,
      "site_note": {
        "rule": $("#site_rule").val(),
        "download_setting": $("#site_download_setting").val(),
        "parse": $("#site_parse").prop("checked") ? "Y" : "N",
        "ua": $("#site_ua").val(),
        "proxy": $("#site_proxy").prop("checked") ? "Y" : "N",
        "message": $("#site_unread_msg_notify").prop("checked") ? "Y" : "N",
        "subtitle": $("#site_subtitle").prop("checked") ? "Y" : "N",
        "limit_interval": $.trim($("#sitelimit_interval").val()),
        "limit_count": $.trim($("#sitelimit_count").val()),
        "limit_seconds": $.trim($("#sitelimit_seconds").val()),
        "source_type": select_GetSelectedVAL("source_setting").join(',')
      }
    };

    const $btn = $("#add_or_edit_site_btn");
    const idleText = data.site_id ? "保存修改" : "新增站点";
    $btn.prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-2"></span>保存中');
    // 发送请求
    axios_post_do("update_site", data, function (ret) {
      if (ret && ret.code && ret.code !== 400) {
        $("#modal-site").modal("hide");
        window_history_refresh();
        return;
      }
      $btn.prop("disabled", false).text(idleText);
      show_fail_modal((ret && ret.msg) || "保存失败");
    }).finally(() => {
      if ($btn.prop("disabled")) {
        $btn.prop("disabled", false).text(idleText);
      }
    });
  }

  //关闭或者删除
  function close_or_del() {
    $("#modal-site").modal("hide");
    let tid = $("#site_id").val();
    if (tid) {
      del_site(tid);
    }
  }

  //绑定事件
  $("#add_or_edit_site_btn").unbind("click").click(function () {
    add_or_edit_site();
  });

  $("#site_del_btn").unbind("click").click(function () {
    var site_name = $("#site_name").val();
    var site_id = $("#site_id").val();
    show_ask_modal("是否确认删除站点 " + site_name + "？", function () {
      $("#modal-site").modal("hide");
      del_site(site_id);
    });
  });

  // 输入时清除该字段的错误提示
  $("#modal-site").on("input change", ".is-invalid", function () {
    $(this).removeClass("is-invalid");
  });

  // 单行输入框回车直接保存
  $("#modal-site").on("keydown", "input.form-control", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      add_or_edit_site();
    }
  });

  //显示测试站点
  function show_sitetest_modal() {
    $("#modal-sitetest").modal("show");
  }

  //显示BT站点
  function show_bt_sites_modal() {

    $("#modal-bt-sites").modal("show");

    const btSitesTable = $('#modal-bt-sites tbody');
    btSitesTable.empty();

    // 当模态框完全显示后，加载站点
    $('#modal-bt-sites').one('shown.bs.modal', function () {

      axios_post('/data/indexer?p=1', {}, function (response) {

        var sourceTypes = response.data.sourceTypes;

        response.data.indexers.forEach(site => {

          // 生成资源类型标签
          let sourceTypeBadges = '';
          if (site.source_type && Array.isArray(site.source_type)) {
            sourceTypeBadges = site.source_type.map(source => {
              const sourceStr = source.toString();
              const sourceLabel = sourceTypes && sourceTypes[sourceStr] ? sourceTypes[sourceStr] : source;
              return `<span class="badge bg-blue me-2">${sourceLabel}</span>`;
            }).join('');
          }

          // 生成特性标签
          let featureBadges = '';
          if (site.proxy) featureBadges += '<span class="badge bg-lime-lt mb-1 me-1">代理</span>';
          if (site.en_expand) featureBadges += '<span class="badge bg-cyan-lt mb-1 me-1">扩展</span>';

          let searchParamBadges = '';
          if (site.search_param == 'imdb') {
            searchParamBadges = `<span class="badge bg-yellow-lt me-2">${site.search_param_name}</span>`
          } else if (site.search_param == 'douban') {
            searchParamBadges = `<span class="badge bg-lime-lt me-2">${site.search_param_name}</span>`
          } else if (site.search_param == 'en') {
            searchParamBadges = `<span class="badge bg-cyan-lt me-2">${site.search_param_name}</span>`
          } else {
            searchParamBadges = `<span class="badge bg-blue-lt me-2">${site.search_param_name}</span>`
          } 

          const rowHtml = `
            <tr>
              <td class="w-1">
                <div class="form-switch">
                  <input name="indexer_sites" type="checkbox" class="form-check-input" value="${site.id}" ${site.checked ? 'checked' : ''}>
                </div>
              </td>
              <td><span>${site.name}</span></td>
              <td>${sourceTypeBadges}</td>
              <td>${searchParamBadges}</td>
              <td>${featureBadges}</td>
              <td>
                <a href="javascript:edit_indexer_conf('${site.domain}')" class="btn-action ms-1" title="编辑站点">
                  <i class="ti ti-edit fs-2"></i>
                </a>
              </td>
            </tr>
          `;
          
          btSitesTable.append(rowHtml);

        });

      });

    });

  }

  //测试一个站点
  function test_one_site(siteid, callBack) {
    if (!siteid) {
      return;
    }
    axios_post_do_async("test_site", { id: siteid }, function (ret) {
      if (ret.code === 0) {
        $(`#sitetest_item${siteid}`).html('<span class="badge bg-green me-1 mb-1">是</span>');
        $(`#sitetest_item${siteid}_time`).html(`<span class="text-green">${ret.time} 毫秒</span>`);
        $(`#sitetest_item${siteid}_msg`).html('');
      } else {
        $(`#sitetest_item${siteid}`).html('<span class="badge bg-red me-1 mb-1">否</span>');
        $(`#sitetest_item${siteid}_time`).html(`<span class="text-red">${ret.time} 毫秒</span>`);
        $(`#sitetest_item${siteid}_msg`).html(`<span class="text-muted">${ret.msg}</span>`);
      }
      callBack(true);
    });
  }

  // 站点测试按钮
  $("#sitetest_btn").unbind("click").click(async function () {
    let btn_obj = $(this);
    let siteids = select_GetSelectedVAL("test_sites_item");
    let sitetest_count_totol = siteids.length;
    let sitetest_count_finished = 0;
    btn_obj.text("测试中...").attr("disabled", true);
    for (let siteid of siteids) {
      test_one_site(siteid, ret => {
        if (ret) {
          sitetest_count_finished++;
          if (sitetest_count_finished >= sitetest_count_totol) {
            btn_obj.text("重新测试").attr("disabled", false);
          }
        }
      })
    }
  });

  // 格式化json文本内容并填充到textarea
  function append_json_to_textarea(elem_id, json_str) {

    if (!json_str) {
      return
    }

    // 格式化
    var lint_json = JSON.parse(json_str);
    // 格式化显示
    var json = JSON.stringify(lint_json, undefined, 4);

    $("#" + elem_id).val(json);

    var match_break_line = json.match(/\n/ig);
    if (match_break_line) {
      var height = Math.min(match_break_line.length * 22 + 15, 500);
      $("#" + elem_id).height(height + 'px');
    }

  }

  // 编辑索引配置
  function edit_indexer_conf(site_url, ispt) {

    $("#modal-manual-indexer").data("indexer", NaN);
    if (ispt) {
      $('.pt-hide').hide();
      $("[name='indexer-copy-btn']").show();
    } else {
      $('.pt-hide').show();
      $("[name='indexer-copy-btn']").hide();
    }

    // 根据ID查询详细信息
    axios_post_do("get_indexer", { "url": site_url }, function (ret) {

      if (ret.data) {

        // 数据绑定到容器上
        $("#modal-manual-indexer").data("indexer", ret.data);

        $("#indexer-id").val(ret.data.id).prop("disabled", true);
        $("#indexer-name").val(ret.data.name).prop("disabled", true);
        $("#indexer-url").val(ret.data.domain);

        // 下拉
        $("#indexer-download-setting").val(ret.data.downloader ?? 0);
        $("#indexer-parser-type").val(ret.data.parser ?? '');

        if (ret.data.search) {
          append_json_to_textarea('search_cfg', ret.data.search)
        }

        if (ret.data.torrents) {
          append_json_to_textarea('torrent_cfg', ret.data.torrents)
        }

        if (ret.data.category) {
          append_json_to_textarea('category_cfg', ret.data.category)
        }

        if (ret.data.public && ret.data.extra != '') {

          var extra_json = JSON.parse(ret.data.extra);

          // 多选
          select_SelectPart(extra_json.source_type, "indexer-source-type")

          $('#indexer-search-params').val(extra_json.search_param ?? 'kw')

          $("#indexer-proxy").prop("checked", extra_json.proxy);
          $("#indexer-en-expand").prop("checked", extra_json.en_expand);

        }

        $("#indexer-modal-title").text("编辑索引站点");
        $("[name='indexer-add-btn']").hide();
        $("[name='indexer-edit-btn']").show();

        $("#modal-manual-indexer").modal("show");
        return;
      }

      if (ret.msg) {
        show_fail_modal(ret.msg);
        return;
      }

    });
  }

  /**
   * 纯数字大小格式化（1000 进制）
   * 示例：1234 → 1.23K，2000000 → 2M
   * @param {number} num 需要格式化的数字
   * @returns {string} 格式化后的字符串，如 "1.23K"、"2M"
   */
  function formatNumber(num) {
    if (num === 0) return '0';

    const k = 1000;
    const sizes = ['', 'K', 'M', 'B', 'T', 'P', 'E']; // 可根据需要增减

    // 初始单位索引
    let i = Math.floor(Math.log(num) / Math.log(k));
    i = Math.min(i, sizes.length - 1);

    let value = num / Math.pow(k, i);

    // 四舍五入后若整数部分 >= 1000，则向上进一个单位
    while (parseFloat(value.toFixed(2)) >= 1000 && i < sizes.length - 1) {
      i++;
      value = num / Math.pow(k, i);
    }

    // 保留两位小数并去掉多余的尾零
    return parseFloat(value.toFixed(2)) + sizes[i];
  }

  // 搜索站点：按卡片名称过滤
  function filter_site_cards(keyword) {
    const kw = (keyword || '').trim().toLowerCase();
    let visible = 0;
    let inactive_visible = 0;

    const filter_group = function (selector, is_inactive) {
      $(selector).find('.card').each(function () {
        const name = $(this).find('a.text-reset.card-text').text().trim().toLowerCase();
        const matched = kw === '' || name.includes(kw);
        $(this).toggle(matched);
        if (matched) {
          visible++;
          if (is_inactive) {
            inactive_visible++;
          }
        }
      });
    };

    filter_group('#active-list', false);
    filter_group('#sites-list', true);

    // 未启用分界线仅在还有可见的未启用站点时显示
    $('#inactive-sites-divider').toggle(inactive_visible > 0);
    // 有关键词但无匹配卡片时显示提示
    $('#no-search-result').toggle(kw !== '' && visible === 0);
  }

  // 绑定搜索框事件
  $('#site_search').off('input').on('input', function () {
    filter_site_cards(this.value);
  }).off('keydown').on('keydown', function (event) {
    if (event.key === 'Escape') {
      this.value = '';
      filter_site_cards('');
    }
  });

</script>

<script type="text/javascript">

  function table_display(site) {
    return `
      <table class="table table-borderless table-transparent mb-0">
        <colgroup>
          <col style="width: 30%">
          <col style="width: 35%">
          <col style="width: 35%">
        </colgroup>
        <thead>
          <tr>
            <th class="p-0">分享率</th>
            <th class="p-0">上传量</th>
            <th class="p-0">下载量</th>
          </tr>
        </thead>
        <tbody class="fw-bold">
          <tr>
            <td class="p-0 text-azure">${site.ratio > 10000 ? 'Infinity' : site.ratio.toFixed(2)}</td>
            <td class="p-0 text-indigo">${formatFileSize(site.upload)}</td>
            <td class="p-0 text-purple">${formatFileSize(site.download)}</td>
          </tr>
        </tbody>
      </table>
    `
  }

  function cell_display(site) {
    return `
      <div class="d-flex align-items-center">
        <span title="上传量"><i class="ti ti-arrow-up text-indigo"></i> ${formatFileSize(site.upload)}</span>
        <span class="ms-1" title="下载量"><i class="ti ti-arrow-down text-purple"></i> ${formatFileSize(site.download)}</span>
        <span class="ms-1" title="做种数"><i class="ti ti-seedling text-orange"></i> ${site.seeding}</span>
        <span class="ms-1" title="分享率"><i class="ti ti-share text-azure"></i> ${site.ratio > 10000 ? 'Infinity' : site.ratio.toFixed(2)}</span>
        <span class="ms-1" title="魔力值"><i class="ti ti-diamond"></i> ${formatNumber(site.bonus)}</span>
      </div>
    `;
  }

  // 站点图标（与统计页一致，未收录图标时显示默认图标）
  function site_favicon_html(site) {
    const image = site.favicon
      ? `<img src="${site.favicon}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '';
    return `<span class="site-favicon"><i class="ti ti-world-www"></i>${image}</span>`;
  }

  // 生成单个站点卡片
  function site_card_html(site, data) {

    // 站点等级去掉括号及其中的内容，如“Power User（xxx）”
    const siteLevel = String(site.level || '').replace(/[（(][^（）()]*[）)]/g, '').trim();

    return `
              <div class="card glass-card" id='site-${site.id}-pop-card'>
                <div class="card-body p-3" >
                  <div class="col d-flex flex-column p-0 h-100">
                    <div class="d-flex justify-content-between align-items-start gap-2 pb-2 border-bottom">
                      <div class="d-flex align-items-start gap-2 flex-fill overflow-hidden">
                        ${site_favicon_html(site)}
                        <div class="flex-fill overflow-hidden lh-base">
                          <a class="site-name card-text d-block text-truncate text-reset fw-semibold" href="${site.strict_url}" target="_blank" title="${site.name}">${site.name}</a>
                          ${siteLevel ? `<div class="site-level text-truncate">${siteLevel}</div>` : ''}
                        </div>
                      </div>
                      <div class="form-switch flex-shrink-0 ms-1" title="启用 / 停用站点">
                        <input name="indexer_sites" type="checkbox" class="form-check-input" value="${site.indexer_id}" data-site-id="${site.id}" ${data.indexerSites.includes(site.indexer_id) ? 'checked' : ''}>
                      </div>
                    </div>
                    <div class="flex-grow-1 px-1 py-2">
                      <div class="d-flex align-items-center">
                        <small>
                          ${site.subscribe_enabled ? '<span class="badge bg-primary-lt text-blue me-1">订阅</span>' : ''}
                          ${site.statistic_enabled ? '<span class="badge bg-primary-lt text-blue me-1">数据统计</span>' : ''}
                          ${site.rule && data.RuleGroups && data.RuleGroups[site.rule] ? `<span class="badge bg-primary-lt text-rss me-1">${data.RuleGroups[site.rule]}</span>` : ''}
                          ${site.download_setting && data.DownloadSettings && data.DownloadSettings[site.download_setting] ? `<span class="badge bg-primary-lt text-rss me-1">${data.DownloadSettings[site.download_setting]}</span>` : ''}
                        </small>
                        <small>
                          ${site.parse ? '<span class="badge bg-primary-lt text-google me-1">解析</span>' : ''}
                          ${site.unread_msg_notify ? '<span class="badge bg-primary-lt text-google me-1">消息</span>' : ''}
                          ${site.proxy ? '<span class="badge bg-primary-lt text-teal me-1">代理</span>' : ''}
                        </small>
                      </div>
                    </div>
                    <div class="d-flex align-items-end justify-content-between gap-2 mt-2">
                      <div class="flex-fill overflow-hidden">
                        ${table_display(site)}
                      </div>
                      <div class="site-actions mb-1">
                        <a class="lit-icon-btn" href="javascript:edit_indexer_conf('${site.strict_url}', true)" title="编辑索引">
                          <i class="ti ti-tool fs-2"></i>
                        </a>
                        <a class="lit-icon-btn" href="javascript:edit_site('${site.id}')" title="配置站点">
                          <i class="ti ti-settings fs-2"></i>
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `;
  }

  // 页面加载完成后，使用axios_post请求/data/site接口获取数据并填充页面
  $(document).ready(function () {

    // 监听站点启用-停用
    $(document).on('change', 'input[name="indexer_sites"]', function () {

      var $checkbox = $(this);
      var previousChecked = !this.checked;

      var siteId = $checkbox.val();
      var siteDbId = $checkbox.attr('data-site-id');
      if (!siteId && !siteDbId) {
        // 还原 checkbox 为点击前的状态
        $checkbox.prop('checked', previousChecked);
        // 弹窗提示
        show_fail_modal('操作失败: 站点id为空, 请检查该站点是否匹配站点索引模板');
        return;
      }

      let params = { "site_id": siteId, "checked": this.checked };
      if (siteDbId) {
        // 站点卡片以数据库站点ID启用，未匹配索引器时由后端校验后分配默认索引器
        params.site_db_id = siteDbId;
      }
      axios_post_do("set_user_indexer_sites", params,
        function (ret) {
          if (ret.code != 0) {
            // 还原 checkbox 为点击前的状态
            $checkbox.prop('checked', previousChecked);
            // 弹窗提示
            show_fail_modal('操作失败, ' + ret.msg);
          } else {
            // 启用成功后同步索引器ID（未匹配索引器的站点会分配默认索引器）
            if (siteDbId && ret.indexer_id) {
              $checkbox.val(ret.indexer_id);
            }
            // 卡片的DOM id按站点ID生成（多个站点可能共用同一个索引配置）
            var $card = $('#site-' + $checkbox.attr('data-site-id') + '-pop-card');
            $card.detach();                     // 从当前所在容器移除
            if (previousChecked) {
              $('#sites-list').append($card);    // 添加到目标容器
            } else {
              $('#active-list').append($card);
            }
            // 分组变化后重新应用搜索过滤，并同步分界线显示
            filter_site_cards($('#site_search').val());
          }
        },
        true);

    });

    axios_post('/data/site', {}, function (response) {

      if (response.code === 0 && response.data) {

        const data = response.data;

        // 填充过滤规则选项
        if (data.RuleGroups) {
          const ruleSelect = $('#site_rule');
          ruleSelect.empty();
          ruleSelect.append('<option value="" selected>默认</option>');
          Object.entries(data.RuleGroups).forEach(([id, name]) => {
            ruleSelect.append(`<option value="${id}">${name}</option>`);
          });
        }

        // 填充下载设置选项
        if (data.DownloadSettings) {
          const downloadSelect = $('#site_download_setting');
          downloadSelect.empty();
          downloadSelect.append('<option value="">默认</option>');
          Object.entries(data.DownloadSettings).forEach(([id, name]) => {
            downloadSelect.append(`<option value="${id}">${name}</option>`);
          });
        }

        // 生成站点列表
        if (data.Sites && data.Sites.length > 0) {

          $('#sites-container').show();

          $('#active-list').empty();
          $('#sites-list').empty();

          data.Sites.forEach(site => {

            const site_card = site_card_html(site, data);

            if (data.indexerSites.includes(site.indexer_id)) {
              $('#active-list').append(site_card);
            } else {
              $('#sites-list').append(site_card);
            }

          });

          // 卡片渲染完成后应用当前搜索关键词
          filter_site_cards($('#site_search').val());

          // 生成站点测试表格行
          const testTableBody = $('#modal-sitetest tbody');
          testTableBody.empty();
          data.Sites.forEach(site => {
            const testRow = `
              <tr>
                <td class="w-1"><input class="form-check-input m-0 align-middle" name="test_sites_item" value="${site.id}" type="checkbox"></td>
                <td><span>${site.name}</span></td>
                <td id="sitetest_item${site.id}"></td>
                <td id="sitetest_item${site.id}_time"></td>
                <td id="sitetest_item${site.id}_msg"></td>
              </tr>
            `;
            testTableBody.append(testRow);
          });

          $('#no-sites').hide();
        } else {
          $('#sites-container').hide();
          $('#no-sites').show();
        }

        // 填充资源类型选项
        if (data.sourceTypes) {
          const sourceTypesGroup = $('#source-setting-group');
          sourceTypesGroup.empty();
          Object.entries(data.sourceTypes).forEach(([key, value]) => {
            const sourceTypeItem = `
              <label class="form-selectgroup-item">
                <input type="checkbox" name="source_setting" value="${key}" class="form-selectgroup-input" checked>
                <span class="form-selectgroup-label">${value}</span>
              </label>
            `;
            sourceTypesGroup.append(sourceTypeItem);
          });
        }

      } else {
        show_fail_modal('站点数据加载失败, ' + response.msg);
      }
    });

  });

</script>
