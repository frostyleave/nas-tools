<div class="container-xl">
  <!-- Page title -->
  <div class="page-header d-print-none mt-2">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="page-title">TMDB缓存</h2>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <div class="btn-list">
          <a href="javascript:clear_tmdb_cache()" class="btn btn-danger d-none d-sm-inline-block">
            <i class="ti ti-eraser fs-3"></i>
            清空TMDB缓存
          </a>
          <a href="javascript:clear_tmdb_cache()" class="btn btn-danger d-sm-none mbtn-action" title="清空TMDB缓存">
            <i class="ti ti-eraser fs-3"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- 业务页面代码 -->
<div class="page-body">
  <div class="container-xl">
    <!-- 工具栏 -->
    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="d-flex align-items-center">
          <div class="text-muted">
            共 <span id="total-count">0</span> 条记录
          </div>
          <div class="ms-auto text-muted">
            搜索:
            <div class="ms-2 d-inline-block">
              <input id="search_word" value="" type="text"
                     class="form-control form-control-sm" aria-label="搜索">
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- 缓存卡片列表 -->
    <div class="d-grid gap-3 tmdbcache-grid" id="tmdb-cache-list">
      <div class="text-center text-muted py-4">加载中...</div>
    </div>
    <!-- 分页 -->
    <div class="d-flex align-items-center mt-3" id="pagination-container" style="display: none;">
      <p class="m-0 text-muted">当前页 <span id="current-count">0</span> 条</p>
      <ul class="pagination m-0 ms-auto" id="pagination-list">
      </ul>
    </div>
  </div>
</div>
<nodata-found id="no-data" title="没有缓存记录" text="当前没有匹配的 TMDB 缓存条目。" style="display: none;"></nodata-found>
<div class="modal modal-blur fade" id="tmdb_cache_detail" tabindex="-1" role="dialog" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tmdb_cache_title">缓存条目</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <pre class="modal-body" id="tmdb_cache_content"
           style="display:flex; flex-direction:column-reverse;font-size:12px;">
            </pre>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">取消</button>
      </div>
    </div>
  </div>
</div>
<div class="modal modal-blur fade" id="modal-tmdbcache-modify" tabindex="-1" role="dialog" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">修改TMDB缓存</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <label class="form-label required">标题</label>
          <div class="row mb-3">
            <input type="hidden" id="tmdbcache_key">
            <input type="text" value="" id="tmdbcache_title" class="form-control" placeholder="标题">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link me-auto" data-bs-dismiss="modal">取消</button>
        <a href="javascript:modify_title()" id="tmdbcache_modify_btn" class="btn btn-primary">确定</a>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">

  // 上一页
  function go_pre_page(search, page) {
    navmenu("tmdbcache", { s: search, page: page - 1 })
  }

  // 下一页
  function go_next_page(search, page) {
    navmenu("tmdbcache", { s: search, page: page + 1 })
  }

  // 显示修改
  function show_modify(key, title) {
    $("#tmdbcache_key").val(key);
    $("#tmdbcache_title").val(title);
    $("#modal-tmdbcache-modify").modal('show');
  }

  // 修改标题
  function modify_title() {
    const key = $("#tmdbcache_key").val();
    if (!key) {
      return;
    }
    const title = $("#tmdbcache_title").val();
    if (!title) {
      $("#tmdbcache_title").addClass("is-invalid");
      return;
    } else {
      $("#tmdbcache_title").removeClass("is-invalid");
    }
    $("#modal-tmdbcache-modify").modal('hide');
    axios_post_do("modify_tmdb_cache", {"key": key, "title": title}, function () {
      window_history_refresh();
    });
  }

  //清空TMDB缓存
  function clear_tmdb_cache() {
    show_confirm_modal("清空TMDB缓存后，将会增加TMDB API的请求次数，增加搜索响应时间，但是可以一次性解决TMDB改名后本地缓存未更新的问题，是否确认？", function () {
      axios_post_do("clear_tmdb_cache", {}, function (ret) {
        show_success_modal("TMDB缓存清理完成！");
        window_history_refresh();
      });
    });
  }

  //删除提示
  function manual_delete(key) {
    show_confirm_modal(key + " 对应的缓存TMDB条目将被删除，是否确认？", function () {
      axios_post_do("delete_tmdb_cache", {"cache_key": key}, function () {
        window_history_refresh();
      });
    });
  }

  // 搜索按钮
  $('#search_word').bind('keypress', function (event) {
    if (event.keyCode == "13") {
      let keyword = $("#search_word").val();
      navmenu("tmdbcache", { s: keyword });
    }
  });

</script>

<script type="text/javascript">

  // 页面加载完成后，使用axios_post请求/data/tmdbcache接口获取数据并填充页面
  $(document).ready(function() {

    // 获取页面参数
    const urlParams = getPageParams();
    const searchKeyword = urlParams.s || '';
    const currentPage = urlParams.page || 1;
    const pageNum = 20;

    // HTML 转义，避免标题中的引号/尖括号破坏结构
    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 设置搜索框的值
    $('#search_word').val(searchKeyword);

    const requestData = {};
    requestData.pagenum = pageNum;
    requestData.s = searchKeyword;
    requestData.page = currentPage;

    axios_post('/data/tmdbcache', requestData, function(response) {

      if (response.code === 0 && response.data) {
        
        const data = response.data;

        // 生成TMDB缓存卡片列表
        const cacheList = $('#tmdb-cache-list');
        const paginationContainer = $('#pagination-container');
        const noData = $('#no-data');

        cacheList.empty();

        $('#total-count').text(data.TotalCount || 0);

        if (data.TmdbCaches && data.TmdbCaches.length > 0) {

          $('#current-count').text(data.TmdbCaches.length);

          data.TmdbCaches.forEach(tmdbCache => {

            var cacheKey = tmdbCache.key;
            var cacheData = tmdbCache.meta;
            var indexKey = tmdbCache.key.replace("[电影]", "").replace("[电视剧]", "").replace("[动漫]", "").replace("[未知]", "").replace("-None", "");
            var mediaType = cacheData.media_type === '电影' ? 'movie' : 'tv';

            // 类型角标：风格、内容与 normal-card 左上角角标一致
            var mediaTypeLabel = cacheData.media_type || '未知';
            var badgeClass = mediaTypeLabel === '电影' ? 'green'
              : mediaTypeLabel === '动漫' ? 'orange'
              : 'flickr';

            var posterSrc = cacheData.poster_path ?
              `https://image.tmdb.org/t/p/w185${cacheData.poster_path}` : '../static/img/no-image.svg';

            var card = `
              <div class="card tmdbcache-card glass-card">
                <div class="card-body d-flex align-items-start gap-3">
                  <img class="tmdbcache-poster shadow-sm" loading="lazy"
                       src="${posterSrc}"
                       onerror="this.src='../static/img/no-image.svg'" alt="">
                  <div class="tmdbcache-main flex-fill">
                    <div class="d-flex align-items-center gap-1">
                      <span class="tmdbcache-key text-truncate" title="${escapeHtml(indexKey)}">${escapeHtml(indexKey)}</span>
                    </div>
                    <div class="d-flex align-items-center gap-1 mt-1">
                      <span class="badge bg-primary-lt text-${badgeClass}">${mediaTypeLabel}</span>
                      <span class="tmdbcache-title text-truncate" title="${escapeHtml(cacheData.title)}">${escapeHtml(cacheData.title)}</span>
                    </div>
                    <div class="tmdbcache-meta text-muted mt-1 d-flex align-items-center gap-1">
                      <a class="lh-1 d-inline-flex align-items-center" href="https://www.themoviedb.org/${mediaType}/${cacheData.id}" target="_blank" title="在 TMDB 中打开">
                        <i class="ti ti-link fs-2"></i>
                      </a>
                      <span>${cacheData.id}</span>
                    </div>
                  </div>
                  <div class="dropdown flex-shrink-0">
                    <a href="#" class="btn-action" data-bs-toggle="dropdown" aria-expanded="false">
                      <i class="ti ti-dots-vertical fs-2"></i>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end">
                      <a class="dropdown-item tmdbcache-edit" href="javascript:void(0)"
                         data-key="${escapeHtml(cacheKey)}" data-title="${escapeHtml(cacheData.title)}">
                        修改
                      </a>
                      <a class="dropdown-item text-danger tmdbcache-delete" href="javascript:void(0)"
                         data-key="${escapeHtml(cacheKey)}">
                        删除
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            `;
            cacheList.append(card);
          });

          // 修改/删除（事件委托，避免标题中的引号破坏内联脚本）
          cacheList.off('click.tmdbcache')
            .off('show.bs.dropdown.tmdbcache shown.bs.dropdown.tmdbcache hidden.bs.dropdown.tmdbcache')
            .on('click.tmdbcache', '.tmdbcache-edit', function () {
              show_modify($(this).attr('data-key'), $(this).attr('data-title'));
            })
            .on('click.tmdbcache', '.tmdbcache-delete', function () {
              manual_delete($(this).attr('data-key'));
            })
            // 弹出菜单时将所在卡片提到最上层，避免被下方卡片遮挡
            .on('show.bs.dropdown.tmdbcache', '.dropdown', function () {
              $(this).closest('.tmdbcache-card').addClass('is-dropdown-open');
            })
            .on('hidden.bs.dropdown.tmdbcache', '.dropdown', function () {
              $(this).closest('.tmdbcache-card').removeClass('is-dropdown-open');
            })
            // 弹出过渡动画：用 Web Animations API 驱动，不依赖样式表是否已刷新
            .on('shown.bs.dropdown.tmdbcache', '.dropdown', function () {
              const menu = this.querySelector('.dropdown-menu');
              if (!menu || typeof menu.animate !== 'function') {
                return;
              }

              const easing = 'cubic-bezier(0.22, 1, 0.36, 1)';

              // 菜单整体：淡入 + 自上而下展开（clip-path 不改变定位，也不受 Popper 的 transform 影响）
              menu.animate([
                {opacity: 0, clipPath: 'inset(0 0 100% 0 round 4px)'},
                {opacity: 1, clipPath: 'inset(0 0 0 0 round 4px)'}
              ], {duration: 180, easing: easing});

              // 菜单项：随展开过程依次浮现
              menu.querySelectorAll('.dropdown-item').forEach(function (item, index) {
                item.animate([
                  {opacity: 0},
                  {opacity: 1}
                ], {duration: 150, delay: index * 30, easing: 'ease-out', fill: 'backwards'});
              });
            });

          noData.hide();
          cacheList.show();

          // 生成分页
          if (data.TotalCount > 0) {
            const paginationList = $('#pagination-list');
            paginationList.empty();

            // 上一页
            const prevDisabled = data.CurrentPage == 1 ? 'disabled' : '';
            paginationList.append(`
              <li class="page-item ${prevDisabled}">
                <a class="page-link" href="javascript:go_pre_page('${data.Search || ''}', ${data.CurrentPage})" tabindex="-1" aria-disabled="true">
                  <i class="ti ti-chevron-left fs-2"></i>
                </a>
              </li>
            `);

            var total_page = (data.TotalCount + pageNum - 1) / pageNum;
            var page_range = get_page_range(data.CurrentPage, total_page);
            // 页码
            page_range.forEach(page => {
              const active = page == data.CurrentPage ? 'active' : '';
              paginationList.append(`
                <li class="page-item ${active}">
                  <a class="page-link" href="javascript:navmenu('tmdbcache?s=${data.Search || ''}&page=${page}')">${page}</a>
                </li>
              `);
            });

            // 下一页
            const nextDisabled = data.CurrentPage >= total_page ? 'disabled' : '';
            const nextHref = data.CurrentPage < total_page ?
              `javascript:go_next_page('${data.Search || ''}', ${data.CurrentPage})` :
              'javascript:void(0)';
            paginationList.append(`
              <li class="page-item ${nextDisabled}">
                <a class="page-link" href="${nextHref}">
                  <i class="ti ti-chevron-right fs-2"></i>
                </a>
              </li>
            `);

            paginationContainer.show();
          }
        } else {
          // 没有数据
          cacheList.hide();
          paginationContainer.hide();
          noData.show();
        }
      }
    });
  });

</script>
