
<div id="main-info-container" class="container-xl placeholder-glow page-wrapper-top-off" >
</div>

<script type="text/javascript">
  
  $(document).ready(function() {

      // 获取URL参数
      const [path, queryString] = window.location.hash.split("?");
      const urlParams = new URLSearchParams(queryString);
      const media_type = urlParams.get('type') || '';
      const tmdbid = urlParams.get('id') || '';
      const year = urlParams.get('year') || '';
      const title = urlParams.get('title') || '';      

      if (!media_type || !tmdbid) {
          show_fail_modal("页面参数(type/tmdbid)缺失！");
          window.history.go(-1);
          return;
      }

      $('#main-info-container').empty();
      $('#main-info-container').append('<div id="bg-mask-layer" class="bg-mask-layer"></div>');

      // 执行主数据请求
      axios_post_do("media_brief_info", { "type": media_type, "tmdbid": tmdbid, "year": year, "title": title },
        (ret) => {
          if (ret.code === 0) {

            var media_info = ret.data;

            // 数据绑定
            $('#main-info-container').data("type", media_type);
            $('#main-info-container').data("tmdbid", tmdbid + "");
            $('#main-info-container').data("data", media_info);

            // 绘制主要信息
            const mainHtml = generateMainHtml(media_info, media_info.fav, media_info.item_url, tmdbid, media_type);
            $('#main-info-container').append(mainHtml);

            // 背景轮播
            buildBackgroundCarousel(media_info.background);

            $('#main-info-container').append(`<div id="season-pannel" class="container-fluid overflow-hidden px-0"></div>`);

            // 季容器
            renderSeasonContainer(media_info.tmdb_info);
            
            // 演职人员、季集信息
            asyncRenderExtraDataCard(tmdbid, media_type, media_info);

            // 推荐影片
            asyncRenderRecommendCard(tmdbid, media_type, media_info.title);

            // 类似影片
            asyncRenderSimCard(tmdbid, media_type, media_info.title);
            
            // 绑定动态生成的元素的事件
            bindDynamicEvents(media_info);

          } else {
            show_fail_modal("未查询到TMDB媒体信息！");
            window.history.go(-1);
          }
        });

      // --- HTML 生成辅助函数 ---
      function generateMainHtml(info, fav, item_url, tmdbid, media_type) {

          var genresHtml = info.genres ? info.genres.map(el => 
              `<div class="list-inline-item">${el}</div>`
          ).join('') : '';

          if (info.year) {
            genresHtml = `<div class="list-inline-item">${info.year}</div>` + genresHtml;
          }

          const doubanHtml = info.douban_id ? 
              `<span id="doubanid-link-tag" class="mb-1 ms-1 d-inline-flex"><i class="ti ti-brand-douban fs-2 text-green"></i> ${renderDoubanLink(info.douban_id)}</span>` : '';          

          const tmdbHtml = info.tmdbid && !info.tmdbid.includes(':') && info.link ?
            `<span id="tmdbid-link-tag" class="mb-1 d-inline-flex"><i class="ti ti-badge-tm fs-2 text-blue"></i><a class="text-reset" href="${info.link}" target="_blank">${info.tmdbid}</a></span>` : '';

          const searchBtnHtml = `
              <span class="btn btn-primary d-sm-inline-flex px-3 badge-pill" id="search-btn">
                搜索资源
              </span>`;
          
          const favBtnHtml = fav == "1" ? `
              <span class="btn btn-pinterest px-3 d-sm-inline-flex badge-pill" onclick='rss_love_click(event, "${info.title}", "${info.year}", "${media_type}", "${tmdbid}", "${fav}")'>
                删除订阅
              </span>` : `
              <span class="btn btn-purple px-3 d-sm-inline-flex badge-pill" onclick='rss_love_click(event, "${info.title}", "${info.year}", "${media_type}", "${tmdbid}", "${fav}")'>
                添加订阅
              </span>`;

          const watchBtnHtml = item_url ? `
              <span class="btn btn-green px-3 d-sm-inline-flex badge-pill" id="watch-btn" data-url="${item_url}">
                在线观看
              </span>` : '';

          return `
          <div id="main-card" class="card rounded-0 custom-media-info-height bg-transparent">
            <div id="main-info-background" class="card-img-overlay rounded-0">
              <div class="d-flex flex-row mb-4 align-items-stretch justify-content-center justify-content-md-start">
                <custom-img id="main-poster-card" class="d-none d-md-flex justify-content-center flex-shrink-0 me-3" div-style="position:relative;"
                  img-class="rounded-3 object-cover lit-media-info-image"
                  img-error="0"
                  img_vote="${info.vote}"
                  img_mark="${fav == "2" ? "1" : "0"}"
                  img-src="${info.image}">
                </custom-img>
                <div class="d-flex flex-column align-items-center justify-content-end">
                  <div>
                    <h1 class="display-6 text-start text-shadow-b1">
                      <strong calss="d-inline">${info.title}</strong>
                    </h1>
                  </div>
                  <div class="list-inline list-inline-dots mt-1 text-center fw-bold text-shadow-b1">${genresHtml}</div>
                  <div class="text-center mt-1" id="tags-container">
                    <span class="mb-1 ${!info.runtime ? 'd-none' : 'd-inline-flex'}"><i class="ti ti-clock fs-2"></i>&nbsp;${info.runtime}</span>
                    ${tmdbHtml}
                    ${doubanHtml}
                  </div>
                  <div class="text-start mt-3 mb-1">
                    ${searchBtnHtml}
                    ${favBtnHtml}
                    ${watchBtnHtml}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div id="overview-container">
            <h1 class="ms-2">
              <strong>简介</strong>
            </h1>
            <div class="col-lg-9 py-2 row-cards overview-container">
              <h2 class="ms-3 me-2 secondry-text-color">
                <small>${info.overview ?? ''}</small>
              </h2>
            </div>
          </div>
          `;
      }

      function isToday(dateStr) {

        if (!dateStr) return false;

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');

        // 今天的本地日期字符串
        const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

        // 取输入的前 10 位，兼容 "2026-10-23 10:00:00" 这种带时间的格式
        return dateStr.slice(0, 10) === today;
      }

      function getLatestEpisode(tmdb_info, seasonInfo) {

        // 下一集信息
        var next_episode_to_air = tmdb_info.next_episode_to_air;

        // 判断是否当前季
        if (next_episode_to_air 
          && seasonInfo.season_number == next_episode_to_air.season_number
          && next_episode_to_air.air_date
          && next_episode_to_air.episode_number
        ) {
          // 比较更新时间是否为今天
          var air_date = next_episode_to_air.air_date;
          if (isToday(air_date)) {
            return next_episode_to_air.episode_number;
          }
          
        }

        // 最新更新集
        var last_episode_to_air = tmdb_info.last_episode_to_air;
        if (last_episode_to_air) {
          return last_episode_to_air.episode_number;
        }

        return 0;

      }
      
      function pickSeason(seasons, targetSeason) {
        // 空数组保护
        if (!seasons || seasons.length === 0) return null;

        // 用 $.grep 筛选出 season_number 匹配的项（返回数组）
        var matched = $.grep(seasons, function (item) {
          return item.season_number === targetSeason;
        });

        // 找到就取第一个，否则兜底取最后一个元素
        return matched.length > 0 ? matched[0] : seasons[seasons.length - 1];
      }

      function renderSeasonContainer(tmdb_info) {

        // 没有季信息 不展示
        if (!tmdb_info || !tmdb_info.seasons || tmdb_info.seasons.length == 0) {
          return;
        }

        var displaySeason = pickSeason(tmdb_info.seasons, tmdb_info.number_of_seasons);
        // 绘制更新进度标签
        if (!document.getElementById('progress-tag') && displaySeason.episode_count) {
          var latestEp = getLatestEpisode(tmdb_info, displaySeason);
          if (latestEp) {
            var progressHtml = '';
            if (latestEp < displaySeason.episode_count) {
              progressHtml = `<span id="progress-tag" class="mb-1 me-1 d-inline-flex fw-bold"><i class="ti ti-flame2 fs-2 text-google"></i>${latestEp}/${displaySeason.episode_count}</span>`;
            } else {
              progressHtml = `<span id="progress-tag" class="mb-1 me-1 d-inline-flex fw-bold"><i class="ti ti-circle-check fs-2 text-google"></i>已完结</span>`;
            }
            $('#tags-container').append(progressHtml);
          }
        }

        // 只有1季 不单独展示面板
        if (tmdb_info.seasons.length <= 1) {
          return;
        }

        var seasonBadge = tmdb_info.number_of_seasons && tmdb_info.number_of_seasons > 0
        ? `<span class="badge bg-info-lt text-blue fw-bolder me-1">共 ${tmdb_info.number_of_seasons} 季</span>`
        : "";

        var innerHtml = `
          <div class="page-header d-print-none">
            <div class="d-flex justify-content-between">
              <div class="d-inline-flex">
                <a class="nav-link ms-2 mb-2 cursor-default" href="javascript:void(0)">
                  <h2 class="my-1"><strong>最新季</strong></h2>
                  <div class="ms-2">${seasonBadge}</div>
                </a>
              </div>
            </div>
          </div>`;

        var displaySeason = pickSeason(tmdb_info.seasons, tmdb_info.number_of_seasons);
        if (displaySeason != null) {
          var posterPath = displaySeason.poster_path;
          if (!posterPath || posterPath == '') {
            var el = document.getElementById('main-poster-card');
            if (el) {
              posterPath = el.getAttribute('img-src');
              if (isDoubanImgUrl(posterPath)) {
                posterPath = '/doubanimg?url=' + posterPath;
              }
            }
          }
          innerHtml +=`
            <div class="d-flex align-items-stretch mx-1 p-3 rounded-3" style="max-width: 43rem; border: 1px solid var(--lit-person-card-bg); background-color: var(--card-transparent-bg);">
              <div class="col-auto d-flex align-items-center border border-1">
                <img alt="海报" class="rounded" style="display: block;min-width: 100%;max-width: 140px;object-fit: cover;" src="${posterPath}">
              </div>
              <div class="col ms-3 mt-3">
                <h3>${displaySeason.name}</h3>
                <small><span class="badge badge-pill px-2">共 ${displaySeason.episode_count} 集</span></small>
                <p class="secondry-text-color mt-3">${displaySeason.overview}</p>
              </div>
            </div>
          `;
        }
        
        $('#season-pannel').html(innerHtml);

      }

      function asyncRenderExtraDataCard(tmdbid, media_type, media_info) {

        media_id = tmdbid.startsWith('DB:') ? tmdbid : media_info.tmdbid

        // 演职人员、季集信息
        axios_post_do("media_extra_info", { "type": media_type, "mediaid": media_id },
          (ret) => {
            if (ret.code === 0) {

              var extra_data = ret.data;
              // 填充主数据
              media_info.tmdbid = extra_data.tmdbid;
              media_info.douban_id = extra_data.douban_id;

              // 重绘标签
              renderTagsContainer(extra_data);
              
              // 背景轮播
              buildBackgroundCarousel(extra_data.background);

              // 演职人员
              buildCrewsSlideCards(extra_data.crews)

              // 生成季集信息
              renderSeasonContainer(extra_data);
              
              if (!document.getElementById('sim-slide')) {
                asyncRenderSimCard(media_info.tmdbid, media_type, media_info.title);
              }

            }
          }, false);
      }

      function renderTagsContainer(info) {

        if (!document.getElementById('tmdbid-link-tag')) {
          if (info.tmdbid && !info.tmdbid.includes(':') && info.link) {
            var tmdbHtml = `<span id="tmdbid-link-tag" class="mb-1 d-inline-flex"><i class="ti ti-badge-tm fs-2 text-blue"></i><a class="text-reset" href="${info.link}" target="_blank">${info.tmdbid}</a></span>`;
            if (document.getElementById('doubanid-link-tag')) {
              $('#doubanid-link-tag').before(tmdbHtml);
            } else {
              $('#tags-container').append(tmdbHtml);
            }
          }
        }

        if (!document.getElementById('doubanid-link-tag') && info.douban_id) {
            var doubanHtml = `<span id="doubanid-link-tag" class="mb-1 ms-1 d-inline-flex"><i class="ti ti-brand-douban fs-2 text-green"></i> ${renderDoubanLink(info.douban_id)}</span>`;
            if (document.getElementById('tmdbid-link-tag')) {
              $('#tmdbid-link-tag').after(doubanHtml);
            } else {
              $('#tags-container').append(doubanHtml);
            }
        }

      }

      function buildBackgroundCarousel(backgrounds) {

        if (!backgrounds || backgrounds.length == 0) {
          return;
        }

        $('#background-carousel').remove();

        const bgCarousel = document.createElement('custom-img');
        bgCarousel.setAttribute('id', 'background-carousel');
        bgCarousel.setAttribute('style', 'inset: 0; display: block;  width: 100%; height: 100%; z-index: 0; pointer-events: none; position: absolute;');
        bgCarousel.setAttribute('div-style', 'display:inline;');
        bgCarousel.setAttribute('img-placeholder', '0');
        bgCarousel.setAttribute('img-error', '0');
        bgCarousel.setAttribute('img-class', 'card-img rounded-0 background-carousel-img');
        bgCarousel.img_src_list = backgrounds;

        $('#bg-mask-layer').append(bgCarousel);
        
      }

      function buildCrewsSlideCards(crewList) {

        if (!crewList || crewList.length == 0) {
          return;
        }

        var slide_cards = [];                      
        crewList.map((card, index) => {
          const nc = document.createElement('person-card');
          nc.setAttribute('lazy', '1');
          nc.setAttribute('person-id', card.id);
          nc.setAttribute('person-image', card.image);
          nc.setAttribute('person-name', card.original_name);
          nc.setAttribute('person-role', card.role);
          nc.onclick = () => {
            navmenu('recommend?type='+media_type+'&subtype=person&personid='+card.id+'&title=参与作品&subtitle='+card.original_name);
          };

          slide_cards.push(nc);
        });

        $('#crews-slide-cards').remove();

        const personSlide = document.createElement('custom-slide');
        personSlide.setAttribute('id', 'crews-slide-cards');
        personSlide.setAttribute('slide-title', '演职人员');
        personSlide.setAttribute('lazy', 'person-card');
        personSlide.slide_card = slide_cards;

        $('#season-pannel').after(personSlide);

      }

      function asyncRenderSimCard(tmdbid, media_type, media_title) {

        axios_post_do("get_recommend", { "type": media_type, "subtype": "sim", "tmdbid": tmdbid, "page": 1 }, 
        (ret) => {

          if (document.getElementById('sim-slide')) {
            return;
          }

          if (!ret.Items || ret.Items.length == 0) {
            return;
          }

          const similarSlide = document.createElement('custom-slide');
          similarSlide.id = 'sim-slide';
          similarSlide.setAttribute('slide-title', '类似');
          similarSlide.setAttribute('lazy', 'normal-card');
          similarSlide.setAttribute('slide-click',
              `javascript:navmenu('recommend?type=${media_type}&subtype=sim&tmdbid=${tmdbid}&title=类似&subtitle=${media_title}')`
              );
          
          $('#main-info-container').append(similarSlide);

          var slide_cards = [];                      
          // 生成 normal-card 集合
          ret.Items.map((card, index) => {
            const nc = document.createElement('normal-card');
            nc.setAttribute('lazy', '1');
            nc.setAttribute('card-showsub', '1');
            nc.setAttribute('card-tmdbid', card.id);
            nc.setAttribute('card-mediatype', card.type);
            nc.setAttribute('card-image', card.image);
            nc.setAttribute('card-fav', card.fav);
            nc.setAttribute('card-vote', card.vote);
            nc.setAttribute('card-year', card.year);
            nc.setAttribute('card-title', card.title);
            nc.setAttribute('card-overview', card.overview);
            nc.setAttribute('card-restype', card.media_type);
            slide_cards.push(nc);
          });
          similarSlide.slide_card = slide_cards;

        }, false);
      }

      function asyncRenderRecommendCard(tmdbid, media_type, media_title) {

        axios_post_do("get_recommend", { "type": media_type, "subtype": "more", "tmdbid": tmdbid, "page": 1 }, 
        (ret) => {

          if (!ret.Items || ret.Items.length == 0) {
            return;
          }

          const customSlide = document.createElement('custom-slide');                  
          customSlide.setAttribute('slide-title', '推荐');
          customSlide.setAttribute('lazy', 'normal-card');
          customSlide.setAttribute('slide-click',
              `javascript:navmenu('recommend?type=${media_type}&subtype=more&tmdbid=${tmdbid}&title=推荐&subtitle=${media_title}')`
              );

          var slide_cards = [];                      
          // 生成 normal-card 集合
          ret.Items.map((card, index) => {
            const nc = document.createElement('normal-card');
            nc.setAttribute('lazy', '1');
            nc.setAttribute('card-showsub', '1');
            nc.setAttribute('card-tmdbid', card.id);
            nc.setAttribute('card-mediatype', card.type);
            nc.setAttribute('card-image', card.image);
            nc.setAttribute('card-fav', card.fav);
            nc.setAttribute('card-vote', card.vote);
            nc.setAttribute('card-year', card.year);
            nc.setAttribute('card-title', card.title);
            nc.setAttribute('card-overview', card.overview);
            nc.setAttribute('card-restype', card.media_type);
            slide_cards.push(nc);
          });
          
          customSlide.slide_card = slide_cards;
          $('#main-info-container').append(customSlide);

        }, false);

      }

      function renderDoubanLink(douban_id) {
          if (!douban_id) return '';
          return douban_id.split(',').map(id => 
              `<a class="text-reset" href="https://movie.douban.com/subject/${id}" target="_blank">${id}</a> `
          ).join('');
      }

      // --- 事件绑定辅助函数 ---
      function bindDynamicEvents(media_info) {
          
          // 使用事件委托来绑定动态添加的元素
          const $document = $(document);

          // 搜索按钮
          $document.on('click', '#search-btn, #search-btn-icon', function(e) {
            e.stopPropagation();

            var tmdbid = $('#main-info-container').data("tmdbid");
            var pageData = $('#main-info-container').data("data");
            var mediaType = $('#main-info-container').data("type");

            if (pageData && pageData.tmdbid && pageData.tmdbid != tmdbid) {
              tmdbid = pageData.tmdbid;
            }

            media_search(tmdbid, pageData.title, mediaType);
          });

          // 观看按钮 (来自 _openItemUrl)
          $document.on('click', '#watch-btn, #watch-btn-icon', function(e) {
            e.stopPropagation();
            window.open($(this).data('url'), '_blank');
          });

      }

  });

  function isDoubanImgUrl(url) {
    try {
      const u = new URL(url);
      return (
        u.protocol === 'https:' &&
        /^img\d+\.doubanio\.com$/.test(u.hostname)
      );
    } catch (e) {
      return false;
    }
  }

</script>
